openapi: 3.0.3
info:
  title: Notifications API
  version: 2.0.0
  description: |
    Notifications API is an EBSI core service that helps to send async or delayed notifications by
    addressing the DID of a natural person or legal entity.

    * Notification service can be used by any entity/user registered in the DID registry or
    application registered in the Trusted Applications Registry (TAR).
    * Entity or application is notified via its DID registered in the DID registry or TAR.

  termsOfService: /docs/terms
  contact:
    name: EBSI Support - Service Desk
    url: https://ec.europa.eu/digital-building-blocks/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
servers:
  - url: http://localhost
    description: Local Computer Environment
  - url: https://api.preprod.ebsi.eu
    description: EBSI Pre-production Environment
  - url: https://api.ebsi.eu
    description: EBSI Production Environment
paths:
  /notifications/v2/notifications:
    get:
      summary: List notifications
      description: Lists all the notifications corresponding to the Bearer Token's DID.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Notification"
                        - properties:
                            _links:
                              type: object
                              properties:
                                self:
                                  type: object
                                  properties:
                                    href:
                                      type: string
                                      description: URI to the specific notification with its id
                                      example: https://api.ebsi.xyz/notifications/v2/notifications/123
                                  required:
                                    - href
                              required:
                                - self
                          required:
                            - _links
                          example:
                            _links:
                              self:
                                href: https://api.ebsi.xyz/notifications/v2/notifications/123
                  self:
                    type: string
                    description: |
                      Absolute URI (http or https) to the the resource's own location.
                  links:
                    description: Pagination links
                    type: object
                    properties:
                      last:
                        type: string
                        description: URI of the last page
                      prev:
                        type: string
                        description: URI of the previous page
                      next:
                        type: string
                        description: URI of the next page
                      first:
                        type: string
                        description: URI of the first page
                    example:
                      first: https://api.ebsi.xyz/notifications/v2/notifications?page[after]=1&page[size]=2
                      prev: https://api.ebsi.xyz/notifications/v2/notifications?page[after]=2&page[size]=2
                      next: https://api.ebsi.xyz/notifications/v2/notifications?page[after]=4&page[size]=2
                      last: https://api.ebsi.xyz/notifications/v2/notifications?page[after]=7&page[size]=2
                  pageSize:
                    type: integer
                    description: Maximum number of items per page.
                  total:
                    type: integer
                    description: Total number of items across all pages.
              examples:
                Get notifications:
                  value:
                    items:
                      - schemaId: notification-001
                        type:
                          - Notification
                          - StoreVerifiableCredential
                        "@context":
                          - https://www.w3.org/2018/credentials/v1
                          - https://essif.europa.eu/schemas/vc/2020/v1
                          - https://essif.europa.eu/schemas/notifications/2020/v1
                        from: did:ebsi:zub5ZZUfHLLptCduwEy8xRj
                        to: did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ
                        issuanceDate: "2019-06-22T14:11:44Z"
                        expirationDate: "2019-06-27T14:11:44Z"
                        payload: {}
                        proof:
                          type: EcdsaSecp256k1Signature2019
                          created: "2019-11-17T14:00:00Z"
                          proofPurpose: assertionMethod
                          verificationMethod: did:ebsi:zub5ZZUfHLLptCduwEy8xRj#key-1
                          jws: eyJh..Iw
                        _links:
                          self:
                            href: /notifications/v2/notifications/123
                      - schemaId: notification-001
                        type:
                          - Notification
                          - RequestVerifiablePresentation
                        "@context":
                          - https://www.w3.org/2018/credentials/v1
                          - https://essif.europa.eu/schemas/vc/2020/v1
                          - https://essif.europa.eu/schemas/notifications/2020/v1
                        from: did:ebsi:zub5ZZUfHLLptCduwEy8xRj
                        to: did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ
                        issuanceDate: "2019-06-22T14:11:44Z"
                        expirationDate: "2019-06-27T14:11:44Z"
                        payload: {}
                        proof:
                          type: EcdsaSecp256k1Signature2019
                          created: "2019-11-17T14:00:00Z"
                          proofPurpose: assertionMethod
                          verificationMethod: did:ebsi:zub5ZZUfHLLptCduwEy8xRj#key-1
                          jws: eyJh..Iw
                        _links:
                          self:
                            href: https://api.ebsi.xyz/notifications/v2/notifications/124
                    total: 13
                    pageSize: 2
                    self: https://api.ebsi.xyz/notifications/v2/notifications?page[after]=3&page[size]=2
                    links:
                      first: https://api.ebsi.xyz/notifications/v2/notifications?page[after]=1&page[size]=2
                      prev: https://api.ebsi.xyz/notifications/v2/notifications?page[after]=2&page[size]=2
                      next: https://api.ebsi.xyz/notifications/v2/notifications?page[after]=4&page[size]=2
                      last: https://api.ebsi.xyz/notifications/v2/notifications?page[after]=7&page[size]=2
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                BadRequest:
                  $ref: "#/components/examples/BadRequest"
        "401":
