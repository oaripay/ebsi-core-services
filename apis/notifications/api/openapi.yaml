          application/json:
            schema:
              $ref: "#/components/schemas/Notification"
            examples:
              New Notification:
                value:
                  schemaId: notification-001
                  type:
                    - Notification
                    - StoreVerifiableCredential
                  "@context":
                    - https://www.w3.org/2018/credentials/v1
                    - https://essif.europa.eu/schemas/vc/2020/v1
