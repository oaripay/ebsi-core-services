        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      security:
        - bearerAuth: []
      operationId: get-notifications-v2-notifications
      parameters:
        - $ref: "#/components/parameters/conformanceHeader"
        - in: query
          name: page[before]
          schema:
            type: string
          description: |
            Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: page[after]
          schema:
            type: string
          description: |
            Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
    post:
      summary: Create a notification
      description: Creates a new notification and stores it to the Decentralized Storage.
      parameters:
        - $ref: "#/components/parameters/conformanceHeader"
      operationId: post-notifications-v2-notifications
      security:
        - bearerAuth: []
      requestBody:
        description: |
          Notification Request Input

          [conformance description]
          [EBSI conformance testing](https://ec.europa.eu/digital-building-blocks/wikis/pages/viewpage.action?spaceKey=EBSIEA&title=EBSI+Wallet+Conformance+Testing) The API supports
          the following EBSI conformance tests:
          * Call conformance /issuer-mock/authorize (CT ISSUE_041)
          * Call conformance /issuer-mock/token (CT ISSUE_052)
          * Call conformance /issuer-mock/credential (CT ISSUE_062)
          * Call conformance /verifier-mock/authentication-requests (CT VERIFY_041)
          * Call conformance /verifier-mock/authentication-responses (CT VERIFY_061)
