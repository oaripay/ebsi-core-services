  /notifications/v2/notifications/{id}:
    get:
      summary: Get a notification
      description: Gets a specific notification identified by its ID.
      operationId: get-notifications-v2-notifications-id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/conformanceHeader"
        - name: id
          in: path
          schema:
            type: string
            example: ecd0e108a98e192af1d2c25055f4e3bed784b5c877204e73219a5203251feaab
          required: true
          description: |
            ID of the notification, sha3-256 hash of the serialized notification schema.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
              examples:
