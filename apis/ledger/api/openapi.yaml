  /ledger/v2/blockchains/fabric/channels/{channel}/blocks/{blockNumber}:
    get:
      tags:
        - Hyperledger Fabric
      summary: Get a block
      description: Returns the block for the specified channel and block number.
      operationId: get-ledger-v2-blockchains-fabric-channel-block
      parameters:
        - in: path
          name: channel
          required: true
          description: Fabric channel name.
          schema:
            type: string
          example: iossdrpocchannel
        - in: path
          name: blockNumber
          required: true
          description: Block number.
          schema:
            type: string
          example: "0"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
              examples:
                Success:
                  value:
                    blockNum: 0
                    channelName: iossdrpocchannel
                    timestamp: "2021-04-19T15:20:43.000Z"
                    dataHash: uYPaaVY4xpLO1eu7B09NxFY9tX2-w41vQi3Okdj8Gugs
                    prevHash: u
                    txCount: 0
                    txIds: []
        "400":
          description: Bad request. The format of the {channel} or {blockNumber} parameter is not valid.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Invalid {channel} Parameter:
                  value:
                    title: Bad request
                    status: 400
                    detail: '["channelName must match /^[a-z][a-z0-9.-]*$/ regular expression"]'
                Invalid {blockNumber} Parameter:
                  value:
                    title: Bad request
                    status: 400
                    detail: '["blockNumber must be a number string"]'
        "404":
          description: Channel or block not found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Channel Not Found:
                  value:
                    detail: Channel {channel} not found
                    status: 404
                    title: Not Found
