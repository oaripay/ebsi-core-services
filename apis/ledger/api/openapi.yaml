  /ledger/v2/blockchains/fabric/jsonrpc:
    post:
      operationId: post-ledger-v2-blockchains-fabric-jsonrpc
      tags:
        - Hyperledger Fabric
      summary: Fabric JSON-RPC API
      description: Hyperledger Fabric JSON-RPC API
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).
          It requires the following fields:

          - **jsonrpc**: Must be exactly "2.0"
          - **method**: Method invoked. It must be "readContract"
          - **params**: Array of parameters.
          - **id**: Identifier established by the client.
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly "2.0"
                  type: string
                method:
                  description: JSON-RPC method to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    oneOf:
                      - type: boolean
                      - type: object
                      - type: string
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              Read Contract:
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: "readContract"
                  params:
                    - channelName: "iossdrpocchannel"
                      contractName: "iossdrpociossvatid"
                      fcn: "checkIossVatIdExists"
                      args: ["ABCDEF123456"]
              Send Proposal:
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: "sendProposal"
                  params:
                    - channelName: "iossdrpocchannel"
                      contractName: "iossdrpociossvatid"
                      action:
                        init: false
                        transientMap:
                          iossvatid: eyJpb3NzdmF0aWQiOiIwNWY0OWQ1ZWE3OGEifQ==
                        transactionId: e35bb106916bc1c9338a811cae2fdcd5b6d9a10fa70248588a61d6d3bdbf780b
                        args:
                          - cmVnaXN0ZXJJb3NzVmF0SWQ=
                          - MjAyMS0xMC0xMw==
                          - MjAyMS0xMC0xNQ==
                          - MjAyMS0xMC0xMyAxNToyMDo0NQ==
                          - OTlhOTNhZDctYjk4OC00ZWRkLWE1MzgtNDk3YmI3YWE2MzA4
                          - Nzk4NTllYmMyOTE4M2UzNzBmZGE=
                        fcn: registerIossVatId
                        header:
                          signature_header: CugIChF...
                          channel_header: CAMQARoMCM...
                        proposal:
                          header: Cn4IAxABG...
                          payload: CpsBCpgBCA...
                      payload: CogKCn4IAxABGgwIzfKbiw...
                      signature: MEUCIQC/rRRItmu3HcgS+...
              Commit Transaction:
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: commitTransaction
                  params:
                    - channelName: "iossdrpocchannel"
                      contractName: "iossdrpociossvatid"
                      action:
                        init: false
                        payload:
                          header:
                            signature_header: CugIChF...
                            channel_header: CAMQARoMCM...
                          data: PeMY4e...
                      payload: CogKCn4IAxABGgwIzfKbiw...
                      signature: MEUCIQC/rRRItmu3HcgS+...
                      transactionId: fed4...
      responses:
        "200":
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
              examples:
                Read Contract:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: RVhJU1RT
                Send Proposal:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      - endorsement:
                          endorser: 4eME...
                          signature: MU/raH+...
                        payload: CapMr...
                        response:
                          message: ""
                          payload: ""
                Commit Transaction:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: OK
                Invalid Request:
                  $ref: "#/components/examples/InvalidRequestJsonRpcError"
                Method Not Found:
                  $ref: "#/components/examples/MethodNotFoundJsonRpcError"
                Internal Error:
                  $ref: "#/components/examples/InternalJsonRpcError"
  /ledger/v2/blockchains/fabric/channels:
    get:
      tags:
        - Hyperledger Fabric
      summary: List channels
      description: Returns a list of all the available EBSI Fabric channels.
      operationId: get-ledger-v2-blockchains-fabric-channels
      parameters:
        - in: query
          name: page[after]
          description: Cursor that points to the end of the page of data that has been returned.
          schema:
            type: string
        - in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI of the current page
                  items:
                    type: array
                    description: List of channel names.
                    items:
                      $ref: "#/components/schemas/Channel"
                  links:
                    $ref: "#/components/schemas/Links"
                  total:
                    type: integer
                    description: Total number of pages in a collection.
                  pageSize:
                    type: integer
                    description: Number of items to be return per page.
              examples:
                "[test] Get Available Channels":
                  value:
                    self: https://api.test.intebsi.xyz/ledger/v2/blockchains/fabric/channels?page[after]=1&page[size]=10
                    items:
                      - iossdrpocchannel
                    total: 1
                    pageSize: 10
                    links:
                      first: https://api.test.intebsi.xyz/ledger/v2/blockchains/fabric/channels?page[after]=1&page[size]=10
                      prev: https://api.test.intebsi.xyz/ledger/v2/blockchains/fabric/channels?page[after]=1&page[size]=10
                      next: https://api.test.intebsi.xyz/ledger/v2/blockchains/fabric/channels?page[after]=1&page[size]=10
                      last: https://api.test.intebsi.xyz/ledger/v2/blockchains/fabric/channels?page[after]=1&page[size]=10
                "[pilot] Get Available Channels":
                  value:
                    self: https://api.preprod.ebsi.eu/ledger/v2/blockchains/fabric/channels?page[after]=1&page[size]=10
                    items:
                      - iossdrpocchannel
                    total: 1
                    pageSize: 10
                    links:
                      first: https://api.preprod.ebsi.eu/ledger/v2/blockchains/fabric/channels?page[after]=1&page[size]=10
                      prev: https://api.preprod.ebsi.eu/ledger/v2/blockchains/fabric/channels?page[after]=1&page[size]=10
                      next: https://api.preprod.ebsi.eu/ledger/v2/blockchains/fabric/channels?page[after]=1&page[size]=10
                      last: https://api.preprod.ebsi.eu/ledger/v2/blockchains/fabric/channels?page[after]=1&page[size]=10
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /ledger/v2/blockchains/fabric/channels/{channel}:
    get:
      tags:
        - Hyperledger Fabric
      summary: Check if a channel exists
      description: Check if a channel exists.
      operationId: get-ledger-v2-blockchains-fabric-channel
      parameters:
        - in: path
          name: channel
          description: Fabric channel name.
          required: true
          schema:
            type: string
          example: iossdrpocchannel
      responses:
        "204":
          description: Success. Channel exists.
        "400":
          description: Bad request. The format of the {channel} parameter is not valid.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Invalid {channel} Parameter:
                  value:
                    title: Bad request
                    status: 400
                    detail: '["channelName must match /^[a-z][a-z0-9.-]*$/ regular expression"]'
        "404":
          description: Channel {channel} not found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Channel Not Found:
                  value:
                    detail: Channel {channel} not found
                    status: 404
                    title: Not Found
                    type: about:blank
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
