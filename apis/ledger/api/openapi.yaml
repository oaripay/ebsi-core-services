components:
  schemas:
    JsonRpcResponse:
      title: JSON-RPC Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly "2.0"
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: array
            - type: boolean
            - type: object
            - type: string
        error:
          description: Error details
          type: object
          properties:
            code:
              description: Error code
              type: integer
            message:
              description: Error message
              type: string
    ProblemDetails:
      title: Problem Details
      description: A [Problem Details](https://datatracker.ietf.org/doc/html/rfc7807) object.
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    Block:
      title: Hyperledger Fabric Block
      type: object
      properties:
        blockNum:
          type: integer
          description: Block number
        txCount:
          type: integer
          description: Transactions count
        txIds:
          type: array
          description: Array of transactions IDs
          items:
            type: string
        dataHash:
          type: string
          description: Data hash
        prevHash:
          type: string
          description: Previous hash
        channelName:
          type: string
          description: Channel name
        timestamp:
          type: string
          description: Block creation time
      description: Hyperledger Fabric block data model
    Transaction:
      title: Hyperledger Fabric Transaction
      type: object
      properties:
        txId:
          type: string
          description: Transaction ID
        type:
          type: string
          description: Type
        timestamp:
          type: string
          description: Timestamp
        channelId:
          type: string
          description: Channel ID
        creatorMspId:
          type: string
          description: Creator MSP ID
        blockNum:
          type: integer
          description: Block number
        validationCode:
          type: number
          description: Transaction validation code
        actions:
          type: array
          description: Actions
          items:
            type: object
            properties:
              chaincodeId:
                type: string
              proposalHash:
                type: string
              response:
                type: object
              endorsersMspId:
                type: array
                items:
                  type: string
                  nullable: true
              creatorMspId:
                type: string
    Channel:
      title: Hyperledger Fabric Channel
      description: Hyperledger Fabric channel data model
      type: string
    Links:
      title: Links
      description: Links model used for pagination
      type: object
      properties:
        last:
          type: string
          description: URI of the last page
        prev:
          type: string
          description: URI of the previous page
        next:
          type: string
          description: URI of the next page
        first:
          type: string
          description: URI of the first page
  examples:
    BesuPermissions:
      value:
        title: Forbidden
        status: 403
        detail: The method 'eth_sendRawTransaction' needs besu permissions
        type: about:blank
    NoDeploySC:
      value:
        title: Forbidden
        status: 403
        detail: Deployment of new smart contracts is not allowed
        type: about:blank
    NoAnonymous:
      value:
        title: Unauthorized
        status: 401
        detail: The method 'eth_sendRawTransaction' is not available for anonymous access
        type: about:blank
    MethodDisabled:
      value:
        title: Bad Request
        status: 400
        detail: The method 'eth_compileSolidity' is currently disabled
        type: about:blank
    MethodNoExists:
      value:
        title: Bad Request
        status: 400
        detail: The method {method} does not exist
        type: about:blank
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
        type: about:blank
    InvalidToken:
      value:
        title: Invalid Token
        status: 400
        detail: Token has expired. Max age of a token is 15 min.
        type: about:blank
    InternalError:
      value:
        title: Internal Server Error
        status: 500
        detail: The server encountered an internal error and was unable to complete your request.
        type: about:blank
    InvalidRequestJsonRpcError:
      value:
        jsonrpc: "2.0"
        id: 1
        error:
          code: -32600
          message: Validations Errors
    MethodNotFoundJsonRpcError:
      value:
        jsonrpc: "2.0"
        id: 1
        error:
          code: -32601
          message: Method Not Found
    InternalJsonRpcError:
      value:
        jsonrpc: "2.0"
        id: 1
        error:
          code: -32603
          message: The server encountered an internal error and was unable to complete your request
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
