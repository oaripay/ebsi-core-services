  /ledger/v2/blockchains/fabric/channels/{channel}/transactions/{transactionId}:
    get:
      tags:
        - Hyperledger Fabric
      summary: Get a transaction
      description: Returns the transaction of the channel {channel} specified by its transaction ID.
      operationId: get-ledger-v2-blockchains-fabric-channel-transaction
      parameters:
        - in: path
          name: channel
          required: true
          description: Fabric channel name.
          schema:
            type: string
          example: iossdrpocchannel
        - in: path
          name: transactionId
          required: true
          description: Transaction ID.
          schema:
            type: string
          example: 2778b2cdeae04ceda9544ad02407f9086910643238738eef04e9c1dd22d00809
        - in: query
          name: page[after]
          description: Cursor that points to the end of the page of data that has been returned.
          schema:
            type: string
        - in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
              examples:
                Transaction found:
                  value:
                    txId: 2778b2cdeae04ceda9544ad02407f9086910643238738eef04e9c1dd22d00809
                    type: ENDORSER_TRANSACTION
                    timestamp: "2021-04-19T15:31:58.872Z"
                    channelId: iossdrpocchannel
                    creatorMspId: FRCSTIOSSDRPOCMSP
                    validationCode: 0
                    actions:
                      - chaincodeId: "_lifecycle"
                        proposalHash: uBQzye8ESWKwg3RQu6oWYCEWAo5mRqirxyAs8bracLX8
                        response:
                          status: 200,
                          message: ""
                          payload:
                            type: "Buffer"
                            data: []
                        endorsersMspId: [null]
        "400":
          description: Bad request. The format of the {channel} parameter is not valid.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Invalid {channel} Parameter:
                  value:
                    title: Bad request
                    status: 400
                    detail: '["channelName must match /^[a-z][a-z0-9.-]*$/ regular expression"]'
                Invalid {transactionId} Parameter:
                  value:
                    title: Bad request
                    status: 400
                    detail: '["transactionId must be a hexadecimal number"]'
