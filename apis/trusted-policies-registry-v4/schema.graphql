schema {
  query: Query
}

type Policy {
  id: String!
  policyName: String!
  description: String!
  status: Boolean!
}

type User {
  id: String!
  attributes: [String!]!
}

input Policy_filter {
  policyName: String
}

type Query {
  policies(skip: Int = 0, first: Int = 100, where: Policy_filter): [Policy!]!
  users(skip: Int = 0, first: Int = 100): [User!]!
  user(id: ID!): User
}
