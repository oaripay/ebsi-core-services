query GetPolicyNames($skip: Int!, $pagesize: Int!, $where: Policy_filter) {
  policies(first: $pagesize, skip: $skip, where: $where) {
    policyName
  }
}

query GetPolicy($policyName: String!) {
  policies(first: 1, where: { policyName: $policyName }) {
    id
    policyName
    description
    status
  }
}

query GetBlockTimestamp {
  _meta {
    block {
      timestamp
    }
  }
}
