openapi: 3.0.3
info:
  title: DID Registry API v4
  description: |
    DID Registry is a generic core service of the EBSI platform providing the capability of
    resolving EBSI Decentralised Identifiers (DIDs).

    It enables consumers to interact with the DID Registry SC to:
    - Insert a DID/DID Document
    - Update a DID Document
    - Revoke a DID/DID Controlling keys
    - Resolve a DID (and obtain a DID Document)
    - Resolve a version of a DID Document at a certain point in time

    For more information see:
    * [DID Registry API Technical Specifications](https://ec.europa.eu/digital-building-blocks/wikis/display/EBSIDOC/DID+Registry+API)
    * [DID Registry Smart Contract Technical Specifications](https://ec.europa.eu/digital-building-blocks/wikis/display/EBSIDOC/DID+Registry+Smart+Contract)
    * [Code Repository](https://ec.europa.eu/digital-building-blocks/code/projects/EBSI/repos/core-services/browse)
  version: 4.0.0
  termsOfService: https://api-preprod.ebsi.eu/docs/terms
  contact:
    name: EBSI Support - Service Desk
    url: https://ec.europa.eu/digital-building-blocks/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
