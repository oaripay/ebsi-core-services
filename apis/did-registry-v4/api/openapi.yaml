  /did-registry/v4/identifiers/{did}:
    get:
      tags:
        - DID Documents
      summary: Get a DID Document
      description: Gets the DID Document corresponding to the DID.
      operationId: get-did-registry-v4-identifier
      parameters:
        - in: path
          name: did
          description: |
            A DID to be resolved.
            [conformance description] The API supports the following EBSI conformance tests:
            - A user wallet checks if the DID is correctly included in the DID Registry (CT ONBOARD_063)
          required: true
          schema:
            type: string
          examples:
            "[test] DID":
              value: did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH
            "[pilot] DID":
              value: did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH
        - in: query
          name: valid-at
          description: |
            This option is used to get a the version in the past
            of a DID Document. It must be a date in ISO-8601 format
          schema:
            type: string
      responses:
        "200":
          description: Success. A user wallet gets DID resolution (CT ONBOARD_063)
          content:
            application/did+ld+json:
              schema:
                $ref: "#/components/schemas/DIDDocument"
              examples:
                "[test] Success":
                  value:
                    "@context":
                      - https://www.w3.org/ns/did/v1
                    id: did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH
                    verificationMethod:
                      - controller: did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH
                        id: did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH#vm-3
                        type: EcdsaSecp256k1RecoveryMethod2020
                        publicKeyBase58: H3C2AVvLMv6gmMNam3uVAjZpfkcJCwDwnZn6z3wXmqPV
                "[pilot] Success":
                  value:
                    "@context": https://w3id.org/did/v1
                    id: did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH
                    verificationMethod:
                      - id: did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH#keys-1
                        type: Secp256k1VerificationKey2018
                        controller: did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH
                        publicKeyHex: 04f9139fbd3b9780863b17e8390934a1017fc8d0f18b84f02acb04f24c9cae261e45745c6507881509b9e6d837329153ea75fafb2c1a5d504702d04f1e22a80ecc
                    authentication:
                      - did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH
                    assertionMethod:
                      - did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH#keys-1
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Invalid {did} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {did} parameter is not valid
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                DID Not Found:
                  $ref: "#/components/examples/NotFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /did-registry/v4/identifiers/{did}/actions:
    post:
      tags:
        - DID Documents
      summary: Perform actions in did
      description: Perform actions in did like checking a controller
      operationId: get-did-registry-v4-actions
      parameters:
        - in: path
          name: did
          description: DID related to the action.
          required: true
          schema:
            type: string
          examples:
            "[test] DID":
              value: did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH
            "[pilot] DID":
              value: did:ebsi:z24q8qN8UE1j4XAFiFKtvJbH
      requestBody:
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: must be exactly "2.0"
          - **method**: method to be invoked
          - **params**: method parameters
          - **id**: identifier established by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly "2.0"
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: string
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              checkController:
                value:
                  jsonrpc: "2.0"
                  method: "checkController"
                  params: ["0x6C286fA9e15Df7f245B8A751d4e9a0FA4C43E8b6"]
                  id: 1
      responses:
        "200":
          description: Response
          content:
            application/json:
              schema:
                title: JSON-RPC Response
                type: object
                properties:
                  jsonrpc:
                    description: Must be exactly "2.0"
                    type: string
                  id:
                    description: Same identifier established by the client in the call
                    type: integer
                  result:
                    description: Result of the call
                    oneOf:
                      - type: object
                      - type: string
                      - type: boolean
              examples:
                checkController:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: true
  /did-registry/v4/jsonrpc:
    post:
      operationId: post-did-registry-v4-jsonrpc
      tags:
        - JSON-RPC
      summary: JSON-RPC API
      description: |
        The JSON-RPC API provides methods assisting the construction of blockchain transactions and
        interaction with the ledger, i.e. write operation on ledger.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Conformance
          description: |
            The header MUST be used ONLY for the EBSI conformance testing.
            - Type: string
            - Format: UUID V4

            The header is used to log the activities. See Conformance testing header section in the [documentation](https://ec.europa.eu/digital-building-blocks/wikis/x/5YDwG).
          required: false
          schema:
            type: string
            format: uuid
          example: edb60e02-398d-4b62-8028-85710b2476a5
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: must be exactly "2.0"
          - **method**: method to be invoked
          - **params**: method parameters
          - **id**: identifier established by the client

          ### API Methods

          #### insertDidDocument

          Call to build an unsigned transaction to insert a new DID Document.

          Parameters:
          - **from**: Ethereum address of the signer
          - **did**: DID to insert. It must be for a legal entity (DID v1)
          - **baseDocument**: JSON string containing the @context of the DID Document
          - **vMethodId**: Thumbprint of the public key
          - **publicKey**: Public key for seckp256k1 in compressed or uncompressed format
          - **isSecp256k1**: It must be true
          - **notBefore**: capability invocation is valid from this time
          - **notAfter**: expiration of the capability invocation

          #### updateBaseDocument

          Call to build an unsigned transaction to update the base document
          of an existing DID.

          Parameters:
          - **from**: Ethereum address of the signer
          - **did**: Existing DID
          - **baseDocument**: JSON string containing the @context of the DID Document

          #### addController

          Call to build an unsigned transaction to add a new controller
          to an existing DID Document.

          Parameters:
          - **from**: Ethereum address of the signer
          - **did**: Existing DID
          - **controller**: DID of the new controller

          #### revokeController

          Call to build an unsigned transaction to revoke a controller
          from a DID Document.

          Parameters:
          - **from**: Ethereum address of the signer
          - **did**: Existing DID
          - **controller**: DID of controller to revoke

          #### addVerificationMethod

          Call to build an unsigned transaction to add a verification method.

          Parameters:
          - **from**: Ethereum address of the signer
          - **did**: Existing DID
          - **vMethodId**: New verification method id
          - **isSecp256k1**: Boolean defining if the public key is for
            secp256k1 curve or not
          - **publicKey**: Public key as hex string. For algorithms different
            to ES256K it must be the JWK transformed to string and then to
            hex format.

          #### addVerificationRelationship

          Call to build an unsigned transaction to add a verification relationship.

          Parameters:
          - **from**: Ethereum address of the signer
          - **did**: Existing DID
          - **name**: Name of the verification relationship
          - **vMethodId**: Reference to the verification method
          - **notBefore**: Verification relationship is valid from this time
          - **notAfter**: Expiration of the verification relationship

          #### revokeVerificationMethod

          Call to build an unsigned transaction to revoke a verification method.

          Parameters:
          - **from**: Ethereum address of the signer
          - **did**: Existing DID
          - **vMethodId**: Reference to the verification method
          - **notAfter**: Date on which the revocation takes effect. It must be in the past

          #### expireVerificationMethod

          Call to build an unsigned transaction to expire a verification method.

          Parameters:
          - **from**: Ethereum address of the signer
          - **did**: Existing DID
          - **vMethodId**: Reference to the verification method
          - **notAfter**: New expiration date. It must be in the future

          #### rollVerificationMethod

          Call to build an unsigned transaction to roll a verification method.

          Parameters:
          - **from**: Ethereum address of the signer
          - **did**: Existing DID
          - **vMethodId**: New verification method id (thumbprint of the new public key)
          - **isSecp256k1**: Boolean defining if the public key is for
            secp256k1 curve or not
          - **publicKey**: Public key as hex string. For algorithms different
            to ES256K it must be the JWK transformed to string and then to
            hex format.
          - **notBefore**: Verification relationship is valid from this time
          - **notAfter**: Expiration of the verification relationship
          - **oldVMethodId**: Old verification method id that will be rolled
          - **duration**: Duration of the period of transition. During this period
            both verification methods will be valid.

          #### sendSignedTransaction

          Call to send a signed transaction to the blockchain.

          [conformance description]

          ### [EBSI conformance testing](https://ec.europa.eu/digital-building-blocks/wikis/x/5YDwG)

          The API supports the following EBSI conformance tests:

          - Construct a blockchain transaction to register a DID (CT ONBOARD_061)
          - Broadcast a signed blockchain transaction to register a DID (CT ONBOARD_062)
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly "2.0"
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              "[conformance] ct1_did_01":
                summary: Build blockchain transaction to register a DID Document (CT ONBOARD_061)
                description: |
                  EBSI conformance test: Build blockchain transaction to register a DID Document (DID_01).

                  A successful response (HTTP 200) means that the service (wallet) can:

                    - create an [EBSI-compliant DID](https://ec.europa.eu/digital-building-blocks/wikis/x/x4XyGQ)
                    - create an [EBSI-compliant DID Document](https://ec.europa.eu/digital-building-blocks/wikis/x/x4XyGQ)

                value:
                  jsonrpc: "2.0"
                  method: insertDidDocument
                  params:
                    - from: "0xD8feEbc61E1a94efDE2999028ff3eAeC4898Cea3"
                      did: "did:ebsi:zzGFTqDCm5PzcUL8we3cmNe"
                      baseDocument: '{"@context":["https://www.w3.org/ns/did/v1","https://w3id.org/security/suites/jws-2020/v1"]}'
                      vMethodId: "TnaihEiXpx3-yDOpBw_qQXJj8wUJm4rYhCBGfIpUZpQ"
                      publicKey: "0x040159d8e2aec4ce0b331cc440572dc8386b4a01095a27880373d359a7c014242de14421e2fa4571f0efb0827dd8604c1c101f65ab8fd9fd00b5c0377796bf6fa4"
                      isSecp256k1: true
                      notBefore: 1665742665
                      notAfter: 1665746265
                  id: 1
              "[conformance] ct1_did_02":
                summary: Send blockchain transaction to register a DID Document (CT ONBOARD_062)
                description: >
                  EBSI conformance test: Send blockchain transaction to register a DID Document (DID_02).

                  A successful response (HTTP 200) means that the service (wallet) can:

