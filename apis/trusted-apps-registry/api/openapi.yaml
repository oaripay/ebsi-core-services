openapi: 3.0.3
info:
  title: Trusted Apps Registry API v3
  version: 3.0.0
  description: |
    Trusted Apps Registry (TAR) API is an EBSI core service. It enables us to interact with the Trusted Apps Registry Smart Contract to:
    * manage (register/update/revoke) trusted EBSI and trusted external applications,
    * manage application authorizations,
    * manage application administrators,
    * obtain application information,
    * obtain application authorizations.
  termsOfService: https://api-pilot.ebsi.eu/docs/terms
  contact:
    name: EBSI Support - Service Desk
    url: https://ec.europa.eu/digital-building-blocks/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
paths:
  /trusted-apps-registry/v3/apps:
    get:
      operationId: get-trusted-apps-registry-v2-apps
      summary: List apps
      description: Returns a list of apps.
      tags:
        - Apps
      parameters:
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
        - in: query
          name: public_key_id
          schema:
            type: string
          description: Filter results by public key id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to apps
                  items:
                    type: array
                    description: List of apps
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ID of the app
                        name:
                          type: string
                          description: Name of the app
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                "[test] Success":
                  value:
                    self: https://api-test.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=3&page[size]=2
                    items:
                      - id: "0x3f571838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0909"
                        name: test-app-1
                        href: https://api-test.ebsi.eu/trusted-apps-registry/v3/apps/test-app-1
                      - id: "0x1b891838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0854"
                        name: test-app-2
                        href: https://api-test.ebsi.eu/trusted-apps-registry/v3/apps/test-app-2
                    total: 124
                    pageSize: 2
                    links:
                      first: https://api-test.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=1&page[size]=2
                      prev: https://api-test.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=2&page[size]=2
                      next: https://api-test.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=4&page[size]=2
                      last: https://api-test.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=62&page[size]=2
                "[pilot] Success":
                  value:
                    self: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=3&page[size]=2
                    items:
                      - id: "0x3f571838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0909"
                        name: test-app-1
                        href: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps/test-app-1
                      - id: "0x1b891838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0854"
                        name: test-app-2
                        href: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps/test-app-2
                    total: 124
                    pageSize: 2
                    links:
                      first: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=1&page[size]=2
                      prev: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=2&page[size]=2
                      next: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=4&page[size]=2
                      last: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=62&page[size]=2
        "400":
