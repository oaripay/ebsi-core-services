  /trusted-apps-registry/v3/jsonrpc:
    post:
      operationId: post-ledger-v2-blockchains-besu
      summary: JSON-RPC API
      description: |
        The JSON-RPC API provides methods assisting the construction of blockchain transactions and
        interaction with the ledger.
      tags:
        - JSON-RPC
      security:
        - bearerAuth: []
      requestBody:
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: must be exactly "2.0"
          - **method**: method to be invoked
          - **params**: method parameters
          - **id**: identifier established by the client

          ### API Methods

          #### deleteAppAdministrator

          Call to build an unsigned transaction to delete an app administrator. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **applicationId**: Application ID
          - **administratorId**: DID of app administrator

          #### insertApp

          Call to build an unsigned transaction to insert an App. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **name**: Name of the app
          - **domain**: Domain. 1 (ebsi) or 2 (external)
          - **appAdministrator**: DID of the app administrator

          #### insertAppAdministrator

          Call to build an unsigned transaction to insert an app administrator. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **applicationId**: Application ID.
          - **administratorId**: DID of the app administrator to add

          #### insertAppInfo

          Call to build an unsigned transaction to insert app info. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **applicationId**: Application ID.
          - **info**: Info. This field must be a JSON stringified and converted into hex string

          #### insertAppPublicKey

          Call to build an unsigned transaction to insert a public key. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **applicationId**: Application ID
          - **publicKey**: Public key. Insert the hex string representation of PEM string.
          - **status**: Status. 1 (active), 2 (revoked), or 3 (suspended)
          - **notBefore**: Point in time when the public key becomes valid. It should be defined in epoch time.
          - **notAfter**: Point in time when the public key becomes invalid. It should be defined in epoch time.

          #### insertAuthorization

          Call to build an unsigned transaction to insert an authorisation. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **name**: Application name
          - **authorizedAppName**: Authorized app name
          - **iss**: Administrator did
          - **status**: Status. 1 (active), 2 (revoked), or 3 (suspended)
          - **permissions**: CRUD permissions. It must be a number between 0 and 15 (default). It's binary representation enables or disables each one of the 4 CRUD permissions (create, read, update, delete).
          - **notBefore**: Point in time when the authorisation becomes valid. It should be defined in epoch time.
          - **notAfter**: Point in time when the authorisation becomes invalid. It should be defined in epoch time.

          #### insertPolicy

          Call to build an unsigned transaction to insert a policy in the registry. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **policyId**: Policy Id
          - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string

          #### insertRevocation

          Call to build an unsigned transaction to insert a revocation. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **applicationId**: Application ID
          - **revokedBy**: Administrator DID
          - **notBefore**: Point in time when the revocation becomes valid. It should be defined in epoch time.

          #### updateApp

          Call to build an unsigned transaction to update an app. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **applicationId**: Application ID
          - **domain**: Domain. 1 (ebsi) or 2 (external)

          #### updateAppPublicKey

          Call to build an unsigned transaction to update an existing public key. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **publicKeyId**: Public key ID
          - **status**: Status. 1 (active), 2 (revoked), or 3 (suspended)
          - **notAfter**: Point in time when the public key becomes invalid. It should be defined in epoch time.

          #### updateAuthorization

          Call to build an unsigned transaction to update an authorisation. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **authorizationId**: Authorization ID
          - **status**: Status. 1 (active), 2 (revoked), or 3 (suspended)
          - **permissions**: CRUD permissions. It must be a number between 0 and 15 (default). It's binary representation enables or disables each one of the 4 CRUD permissions (create, read, update, delete).
          - **notAfter**: Point in time when the authorisation becomes invalid. It should be defined in epoch time.

          #### updatePolicy.

          Call to build an unsigned transaction to update a policy. This method requires user attributes in the Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the administrator
          - **policyId**: Policy Id
          - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string

          #### sendSignedTransaction

          Call to send a signed transaction to the blockchain.
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly "2.0"
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
