      operationId: get-apps-applicationId-public-keys-public-key
      summary: Get a public key
      description: Returns the public key identified by its ID.
      tags:
        - Apps
      parameters:
        - name: applicationName
          in: path
          schema:
            type: string
          examples:
            "[test] applicationName":
              description: valid test applicationName
              value: "ledger-api"
            "[pilot] applicationName":
              description: valid preprod applicationName
              value: "ledger-api"
          required: true
        - name: publicKeyId
          in: path
          schema:
            type: string
          examples:
            "[test] publicKeyId":
              description: valid test publicKeyId
              value: "0xb9f5523a132d9c22c552bf126691a0c9dfa3ba550c8de3e8409c0c21b28e0e99"
            "[pilot] publicKeyId":
              description: valid preprod publicKeyId
              value: "0x7623198d13d51cc485e4ec6bd52af05f6b691c1d9dd06a4b3f609d9c19efb985"
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    description: Unique app ID
                  publicKey:
                    type: string
                    description: Public key in base64
                  status:
                    type: string
                    description: Status
                    enum: ["undefined", "active", "revoked", "suspended"]
                  notBefore:
                    description: Date and time before the public key must be considered invalid.
                    type: number
                  notAfter:
                    description: Date and time after the public key must be considered invalid.
                    type: number
              examples:
                "[test] Success":
                  value:
                    applicationId: "0xb9f5523a132d9c22c552bf126691a0c9dfa3ba550c8de3e8409c0c21b28e0e99"
                    publicKey: "LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0t..."
