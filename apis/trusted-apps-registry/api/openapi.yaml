components:
  schemas:
    App:
      title: App
      type: object
      description: App data model
      properties:
        applicationId:
          type: string
          description: Unique app ID
        name:
          type: string
          description: App name
        domain:
          type: string
          description: domain
          enum: ["undefined", "ebsi", "external"]
        administrators:
          type: array
          items:
            type: string
        publicKeys:
          type: array
          items:
            type: string
        info:
          type: object
        authorizations:
          type: array
          items:
            $ref: "#/components/schemas/Authorization"
        revocation:
          type: object
          nullable: true
          properties:
            revokedBy:
              type: string
            notBefore:
              type: number
    Authorization:
      description: Authorization data model
      type: object
      properties:
        authorizationId:
          type: string
          format: multi-base64url encoded authorisation id
        resourceApplicationId:
          description: Application id of application that authorizes an app (requesterApplicationId) to perform operations.
          type: string
          format: multi-base64url encoded application id
        requesterApplicationId:
          description: Application id of the app that is authorized to consume app (resourceApplicationId) resources.
          type: string
          format: multi-base64url encoded application id
        resourceApplicationName:
          description: Application name
          type: string
        requesterApplicationName:
          description: Application name
          type: string
        iss:
          description: DID of the authorisation issuer.
          type: string
          format: DID
        permissions:
          description: Application permissions
          type: object
          properties:
            create:
              type: string
              enum: ["true", "false"]
            read:
              type: string
              enum: ["true", "false"]
            update:
              type: string
              enum: ["true", "false"]
            delete:
              type: string
              enum: ["true", "false"]
        status:
          description: "Authorization status: active, revoked"
          type: string
          enum: ["undefined", "active", "revoked", "suspended"]
        notBefore:
          description: Date and time before the authorisation must be considered invalid.
          type: number
        notAfter:
          description: Date and time after the authorisation must be considered invalid.
          type: number
    Links:
      title: Links
      description: Links model used for pagination.
      type: object
      properties:
        last:
          type: string
          description: URI of the last page
        prev:
          type: string
          description: URI of the previous page
        next:
          type: string
          description: URI of the next page
        first:
          type: string
          description: URI of the first page
      x-examples:
        Links:
          first: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=1&page[size]=2
          prev: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=2&page[size]=2
          next: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=4&page[size]=2
          last: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps?page[after]=13&page[size]=2
    JsonRpcResponse:
      title: JSON-RPC Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly "2.0"
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: object
            - type: string
    Policy:
      title: Policy
      description: Policy data model.
      type: object
      properties:
        policyId:
          type: string
          description: Unique policy ID
        policy:
          type: string
          description: Base64 encoded policy
        hash:
          type: string
          description: Hash (multihash) of the policy
    ProblemDetails:
      title: Problem Details
      description: A [Problem Details](https://datatracker.ietf.org/doc/html/rfc7807) object.
      type: object
      x-examples:
        Not Enough Credit:
          type: https://example.com/probs/out-of-credit
          title: You do not have enough credit.
          detail: Your current balance is 30, but that costs 50.
          instance: /account/12345/msgs/abc
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide
            human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem. It may or may
            not yield further information if dereferenced.
  examples:
    BadRequest:
      value:
        title: Bad request
        status: 400
        detail: Bad request
    InvalidToken:
      value:
        title: Invalid token
        status: 400
        detail: Invalid token
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: http://localhost
    description: Local Computer Environment
  - url: https://api-test.ebsi.eu
    description: EBSI Test Environment
  - url: https://api-pilot.ebsi.eu
    description: EBSI Pilot Environment
  - url: "https://api-conformance.ebsi.eu"
    description: EBSI Conformance Environment
