version: "3.7"

services:
  cassandradb:
    image: cassandra:latest
    container_name: cassandradb
    ports:
      - "7000:7000"
      - "9042:9042"
  storage-api-v3:
    build: .
    env_file:
      - .env.default
      - .env.local
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      - "cassandradb"
