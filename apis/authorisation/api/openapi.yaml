openapi: 3.1.0
info:
  title: Authorisation API v2
  description: |
    The Authorisation API is a core EBSI service responsible to issue Short Term
    Access Tokens (JWS) to the EBSI Platform for entities (Natural Persons,
    Legal Entities) and trusted Applications (EBSI or third-party applications)
    in exchange of their presentation of a long term EBSI Verifiable
    Authorisation credential, plus their authentication/identification. Access
    tokens are required by entities and applications to access the protected
    resources of EBSI.

    Users receive access tokens after they present a valid EBSI Verifiable
    Authorisation credential and prove ownership over their DID.

    Trusted Applications receive access tokens if they are well registered in
    the Trusted Apps Registry (application public keys are listed), are
    authorised there to access the requested protected resources, and
    successfully prove their private key ownership. We implement the
    Authenticated Key Exchange cryptographic identification protocol.
  version: 2.0.0
  contact:
    name: EBSI Support - Service Desk
    url: https://ec.europa.eu/digital-building-blocks/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
servers:
  - url: http://localhost
    description: Local Computer Environment
  - url: https://api-test.ebsi.eu
    description: EBSI Test Environment
  - url: https://api-pilot.ebsi.eu
    description: EBSI Pilot Environment
  - url: https://api-conformance.ebsi.eu
    description: EBSI Conformance Environment
paths:
  /authorisation/v2/authentication-requests:
    post:
      operationId: post-authentication-requests
      tags:
        - Endpoints
      summary: Initiate a SIOP DID Auth request
      description: Natural Person and Legal Entities entry point to initiate a SIOP DID Auth Request.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticationRequest"
            examples:
              OIDC SIOP Authentication Request:
                description: |
                  EBSI supports OIDC and OAuth2 authentication, hence the scope MUST a valid EBSI authentication scope.
                  The endpoint returns an OIDC SIOP V2 authentication request as URI string.
                value:
                  scope: openid did_authn
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationRequestResponse"
              examples:
                Authentication Request:
                  value:
                    uri: "openid://?response_type=id_token&client_id=https%3A%2F%2Fapi-pilot.ebsi.eu%2Fauthorisation%2Fv2%2Fsiop-sessions&scope=openid+did_authn&nonce=09e8ebfe-674e-4e4c-82b3-da153f8625c2&request=eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QiLCJraWQiOiJodHRwczovL2FwaS1waWxvdC5lYnNpLmV1L3RydXN0ZWQtYXBwcy1yZWdpc3RyeS92My9hcHBzL2F1dGhvcmlzYXRpb24tYXBpX3BpbG90LXRlbXAtMDEifQ..Z8jVzKtcTtSD1kBlYin_1jnfZ6BhhYdo18lUSf5xz0RFtkoPonsQyKsS7u72w7fV3oxWUs8YV7QAynGyUxuR_w"
        "400":
          $ref: "#/components/responses/400"
        "500":
          $ref: "#/components/responses/500"
  /authorisation/v2/siop-sessions:
    post:
      operationId: post-siop-sessions
      summary: Create a SIOP Session
      description: Sessions Token endpoint as the callback for DID SIOP Response.
      tags:
        - Endpoints
      requestBody:
        description: |
          The request body must contain an ID Token (parameter name: `id_token`) and, optionally, a VP token (as `vp_token`) (only for onboarding).

          The ID Token should be a JWT.
          Its header must contain the signer's `kid` (e.g. `"kid": "did:ebsi:zbM8cCuoBMFNLeQyLiVFyxw#keys-1"`).
          The ID Token payload must contain the following fields:
          - `aud`: the URL of the /siop-sessions endpoint, e.g. "https://api-pilot.ebsi.eu/authorisation/v2/siop-sessions"
          - `sub`: the subject
          - `sub_jwk`: the JWK used to sign the JWT
          - `nonce`: a random UUID
          - `claims`:
            - `encryption_key`: public key used to encrypt the response
          - `responseMode`: should be "form_post",
          - `iss`: should be "https://self-issued.me/v2",
          - `_vp_token`: only if the request also contains a VP token.
            - `presentation_submission`: a VP submission object (https://identity.foundation/presentation-exchange/spec/v2.0.0/#presentation-submission).

          Here's an example of a valid `presentation_submission`:

          ```json
            "presentation_submission": {
              "id": "237b0eec-0b7e-4a16-b3bc-bdd42f57b86b",
              "definition_id": "b5c07e84-55f6-48e1-a531-3608d26fc336",
              "descriptor_map": [
                {
                  "id": "6f43bcea-da4b-4e45-ac2c-25307d6dfe34",
                  "format": "jwt_vp",
                  "path": "$",
                  "path_nested": {
                    "id": "onboarding-input-id",
                    "format": "jwt_vc",
                    "path": "$.vp.verifiableCredential[0]"
                  }
                }
              ]
            }
          ```

          With the associated `vp_token` being a Verifiable Presentation JWT:

          ```
          eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QiLCJraWQiOiJkaWQ6ZWJzaTp6c3ROc2VtaWZrd2ZVY2pBYzJucDFXcCNTLTJiQV9lUXNTa1JDbmw0ZnNielVWZGtwM3F4WEVrcnFKTTI3WWhBZUtzIn0..86g3f_b5JvsvKwuayWGp_9BpQ0GwsvmY_51K88npaFM2CWJH6D3Aqjee4_URXHPtdSzKoiBhPdGqGyz3RACsKQ
          ```
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SiopSessionsRequest"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ake1SiopResponse"
              examples:
                Encrypted access token:
                  value:
                    ake1_enc_payload: 
                    ake1_sig_payload:
                      iat: 1672841881
                      exp: 1672842781
                      ake1_nonce: 53a6e914-ef94-412b-b226-82da24be3dd9
                      ake1_enc_payload: 
                      did: did:ebsi:zbM8cCuoBMFNLeQyLiVFyxw
                      iss: authorisation-api_pilot-temp-01
                    ake1_jws_detached: eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QiLCJraWQiOiJodHRwczovL2FwaS1waWxvdC5lYnNpLmV1L3RydXN0ZWQtYXBwcy1yZWdpc3RyeS92My9hcHBzL2F1dGhvcmlzYXRpb24tYXBpX3BpbG90LXRlbXAtMDEifQ..bJ5gwcsgYcRTpMAJYpkUPGSYA962eioQ94Yju7buVGneuCCmelxWH-ZhKxMf7RolebgdVrrnNIIhdTZLJ8NpMw
                    kid: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps/authorisation-api_pilot-temp-01
        "400":
          $ref: "#/components/responses/400"
        "500":
          $ref: "#/components/responses/500"
  /authorisation/v2/oauth2-sessions:
    post:
      operationId: post-oauth2-sessions
      summary: Create an OAuth2 Session
      description: Session Token endpoint for Component Authorisation (DID Auth - CCG Flow).
      tags:
        - Endpoints
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuth2SessionsRequest"
            examples:
              OAuth2 Session Request:
                value:
                  grantType: client_credentials
                  clientAssertionType: "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
                  clientAssertion: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NksiLCJraWQiOiJodHRwczovL2FwaS1waWxvdC5lYnNpLmV1L3RydXN0ZWQtYXBwcy1yZWdpc3RyeS92My9hcHBzL3Rlc3QtYXBwLXBpbG90MiJ9.eyJpYXQiOjE2NzI4NDUxOTYsImV4cCI6MTY3Mjg0NTIxMSwianRpIjoiZDQwNzdmMzctNzMxYy00Y2M0LThmYmItZDE0MWE5MjUyODViIiwiYXVkIjoibGVkZ2VyLWFwaSIsInN1YiI6InRlc3QtYXBwLXBpbG90MiIsIm5vbmNlIjoiOWEzNTQxODQtMzlmMy00MGJiLTg1NDctMjc5N2YzZDhlNThhIiwiaXNzIjoidGVzdC1hcHAtcGlsb3QyIn0.enmQemuwwkBSPTokpUjacOSgjM4JIo6OnHLaOiw_A3lwwJqGssBjHOfrxEIVOBCvdtLOSFDa6he8qCnqGef95Q
                  scope: openid did_authn
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ake1OAuth2Response"
              examples:
                OAuth2 response:
                  value:
                    ake1_enc_payload: 
                    ake1_sig_payload:
                      iat: 1672845197
                      exp: 1672846097
                      ake1_nonce: 9a354184-39f3-40bb-8547-2797f3d8e58a
                      ake1_enc_payload: 
                      kid: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps/test-app-pilot2
                      iss: authorisation-api_pilot-temp-01
                    ake1_jws_detached: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NksiLCJraWQiOiJodHRwczovL2FwaS1waWxvdC5lYnNpLmV1L3RydXN0ZWQtYXBwcy1yZWdpc3RyeS92My9hcHBzL2F1dGhvcmlzYXRpb24tYXBpX3BpbG90LXRlbXAtMDEifQ..PHbuIxA7oSp8-6oh7BED0fEiFL8gItKETlFzaiuFIKH0aF3RRjJQv-CKc5kEfmhGSO8_46yD2qFXZnsTrHAJFg
                    kid: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps/authorisation-api_pilot-temp-01
        "400":
          $ref: "#/components/responses/400"
        "500":
          $ref: "#/components/responses/500"
components:
  schemas:
    ProblemDetails:
      title: Problem Details
      description: A [Problem Details](https://datatracker.ietf.org/doc/html/rfc7807) object.
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide
            human-readable documentation for the problem type.
          default: "about:blank"
        title:
          type: string
          description: A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem. It may or may
            not yield further information if dereferenced.
    AuthenticationRequest:
      title: SIOP Authentication Request
      description: Request to initiate a SIOP authentication process.
      type: object
      properties:
        scope:
          type: string
          description: Scope is used to define the authentication response method.
          example: openid did_authn
      required:
        - scope
    AuthenticationRequestResponse:
      title: SIOP Authentication Request Response
      type: object
      properties:
        uri:
          description: OpenId DID SIOP Uri response.
          type: string
          example: "openid://?response_type=id_token&client_id=https%3A%2F%2Fapi-pilot.ebsi.eu%2Fauthorisation%2Fv2%2Fsiop-sessions&scope=openid+did_authn&nonce=09e8ebfe-674e-4e4c-82b3-da153f8625c2&request=eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QiLCJraWQiOiJodHRwczovL2FwaS1waWxvdC5lYnNpLmV1L3RydXN0ZWQtYXBwcy1yZWdpc3RyeS92My9hcHBzL2F1dGhvcmlzYXRpb24tYXBpX3BpbG90LXRlbXAtMDEifQ..Z8jVzKtcTtSD1kBlYin_1jnfZ6BhhYdo18lUSf5xz0RFtkoPonsQyKsS7u72w7fV3oxWUs8YV7QAynGyUxuR_w"
      description: DID SIOP OIDC URI
    SiopSessionsRequest:
      title: SIOP Session Request
      description: Access token request.
      type: object
      properties:
        id_token:
          type: string
          description: JWS compact serialised ID Token
        vp_token:
          type: string
          description: A Verifiable Presentation JWT. Only for onboarding.
      required:
        - id_token
    Ake1SiopResponse:
      title: SIOP Session Response
      description: Ake1 Response for OAuth2 authentication
      type: object
      properties:
        ake1_enc_payload:
          description: Encrypted payload with user's public key
          type: string
          example: 
        ake1_jws_detached:
          description: Detached JWS of AKE1 Signing Payload
          type: string
          example: eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QiLCJraWQiOiJodHRwczovL2FwaS1waWxvdC5lYnNpLmV1L3RydXN0ZWQtYXBwcy1yZWdpc3RyeS92My9hcHBzL2F1dGhvcmlzYXRpb24tYXBpX3BpbG90LXRlbXAtMDEifQ..bJ5gwcsgYcRTpMAJYpkUPGSYA962eioQ94Yju7buVGneuCCmelxWH-ZhKxMf7RolebgdVrrnNIIhdTZLJ8NpMw
        ake1_sig_payload:
          type: object
          properties:
            ake1_enc_payload:
              description: Encrypted payload with user's public key
              type: string
              example: 
            ake1_nonce:
              description: Nonce used during the authentication process
              type: string
              example: 53a6e914-ef94-412b-b226-82da24be3dd9
            did:
              description: API DID
              type: string
              example: did:ebsi:zbM8cCuoBMFNLeQyLiVFyxw
            iat:
              description: Issued at
              type: number
              example: 1627652364
            exp:
              description: Expires
              type: number
              example: 1627653264
            iss:
              description: Issuer (Authorisation API)
              type: string
              example: authorisation-api_pilot-temp-01
        kid:
          description: API KID
          type: string
          example: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps/authorisation-api_pilot-temp-01
    OAuth2SessionsRequest:
      title: OAuth2 Session Request
      description: Request for JWT bearer assertion grant.
      type: object
      properties:
        grantType:
          description: |
            Grant type. Must be set to "client_credentials"
          type: string
          example: client_credentials
        clientAssertionType:
          description: |
            Client Assertion type. Must be set to "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
          type: string
          example: "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
        clientAssertion:
          type: string
          description: Self-signed JWT
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NksiLCJraWQiOiJodHRwczovL2FwaS1waWxvdC5lYnNpLmV1L3RydXN0ZWQtYXBwcy1yZWdpc3RyeS92My9hcHBzL3Rlc3QtYXBwLXBpbG90MiJ9.eyJpYXQiOjE2NzI4NDUxOTYsImV4cCI6MTY3Mjg0NTIxMSwianRpIjoiZDQwNzdmMzctNzMxYy00Y2M0LThmYmItZDE0MWE5MjUyODViIiwiYXVkIjoibGVkZ2VyLWFwaSIsInN1YiI6InRlc3QtYXBwLXBpbG90MiIsIm5vbmNlIjoiOWEzNTQxODQtMzlmMy00MGJiLTg1NDctMjc5N2YzZDhlNThhIiwiaXNzIjoidGVzdC1hcHAtcGlsb3QyIn0.enmQemuwwkBSPTokpUjacOSgjM4JIo6OnHLaOiw_A3lwwJqGssBjHOfrxEIVOBCvdtLOSFDa6he8qCnqGef95Q
        scope:
          type: string
          description: Scope is used to define the authentication method. Must be set to "openid did_authn"
          example: openid did_authn
      required:
        - grantType
        - clientAssertionType
        - clientAssertion
        - scope
    Ake1OAuth2Response:
      title: OAuth2 Session Response
      type: object
      properties:
        ake1_enc_payload:
          description: Encrypted payload with user's public key
          type: string
          example: 
        ake1_jws_detached:
          description: Detached JWS of AKE1 Signing Payload
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NksiLCJraWQiOiJodHRwczovL2FwaS1waWxvdC5lYnNpLmV1L3RydXN0ZWQtYXBwcy1yZWdpc3RyeS92My9hcHBzL2F1dGhvcmlzYXRpb24tYXBpX3BpbG90LXRlbXAtMDEifQ..PHbuIxA7oSp8-6oh7BED0fEiFL8gItKETlFzaiuFIKH0aF3RRjJQv-CKc5kEfmhGSO8_46yD2qFXZnsTrHAJFg
        ake1_sig_payload:
          type: object
          properties:
            ake1_enc_payload:
              description: Encrypted payload with user's public key
              type: string
              example: 
            ake1_nonce:
              description: Nonce used during the authentication process
              type: string
              example: 9a354184-39f3-40bb-8547-2797f3d8e58a
            kid:
              description: Trusted App KID
              type: string
              example: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps/test-app-pilot2
            iat:
              description: Issued at
              type: number
              example: 1672845197
            exp:
              description: Expires
              type: number
              example: 1672846097
            iss:
              description: Issuer (Authorisation API)
              type: string
              example: authorisation-api_pilot-temp-01
        kid:
          description: API KID
          type: string
          example: https://api-pilot.ebsi.eu/trusted-apps-registry/v3/apps/authorisation-api_pilot-temp-01
      description: Ake1 Response for OAuth2 authentication
  responses:
    "400":
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            Bad Request:
              $ref: "#/components/examples/BadRequest"
            Token Expired:
              $ref: "#/components/examples/TokenExpired"
            Issuer Not Found:
              $ref: "#/components/examples/IssuerNotFound"
    "500":
      description: Internal Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            Internal Server Error:
              $ref: "#/components/examples/InternalError"
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
    IssuerNotFound:
      value:
        title: Issuer Not Found
        status: 400
        detail: Issuer not found in the trusted apps registry.
    TokenExpired:
      value:
        title: Token Expired
        status: 400
        detail: The token has expired.
    InternalError:
      value:
        title: Internal Server Error
        status: 500
        detail: The server encountered an internal error and was unable to process your request.
