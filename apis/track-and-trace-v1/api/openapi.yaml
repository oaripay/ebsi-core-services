                    grantedBy: did:ebsi:zYgwhP7EDQ5bsNeghFLDVbk
                    permission: creator
                  - subject: did:ebsi:zqNtY2Cv8wuFBVW7FTtNk84
                    documentId: "0xd06f39f1b07bdb5040665111ca96c63b100165f8e06ab2787d273d25ad6bb169"
                    grantedBy: did:ebsi:zYgwhP7EDQ5bsNeghFLDVbk
                    permission: delegate
                  - subject: did:ebsi:zqNtY2Cv8wuFBVW7FTtNk84
                    documentId: "0xd06f39f1b07bdb5040665111ca96c63b100165f8e06ab2787d273d25ad6bb169"
                    grantedBy: did:ebsi:zYgwhP7EDQ5bsNeghFLDVbk
                    permission: write
                total: 3
                pageSize: 10
                links:
                  first: https://api-test.ebsi.eu/track-and-trace/v1/documents/0xd06f39f1b07bdb5040665111ca96c63b100165f8e06ab2787d273d25ad6bb169/accesses?page[after]=1&page[size]=10
                  prev: https://api-test.ebsi.eu/track-and-trace/v1/documents/0xd06f39f1b07bdb5040665111ca96c63b100165f8e06ab2787d273d25ad6bb169/accesses?page[after]=1&page[size]=10
                  next: https://api-test.ebsi.eu/track-and-trace/v1/documents/0xd06f39f1b07bdb5040665111ca96c63b100165f8e06ab2787d273d25ad6bb169/accesses?page[after]=1&page[size]=10
