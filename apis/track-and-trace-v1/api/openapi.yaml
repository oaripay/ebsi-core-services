          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /track-and-trace/v1/jsonrpc:
    post:
      operationId: post-track-and-trace-v1-jsonrpc
      tags:
        - JSON-RPC
      summary: JSON-RPC API
      description: |
        The JSON-RPC API provides methods assisting the construction of blockchain transactions and
        interaction with the ledger, i.e. write operation on ledger.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: must be exactly "2.0"
          - **method**: method to be invoked
          - **params**: method parameters
          - **id**: identifier established by the client

          ### API Methods

          #### authoriseDid

          Call to build an unsigned transaction to authorise a DID to create
          documents. Requires an access token with "tnt_authorise" scope.

          Parameters:
          - **from**: Ethereum address of the signer
          - **didEbsi**: DID to authorise
          - **whiteList**: Boolean to define if the DID is authorized or unauthorized

          #### createDocument

          Call to build an unsigned transaction to create a new Document. Requires an access token with "tnt_create" scope. By default it records the timestamp of the blockchain, but it's possible to define a different timestamp with its respective proof.

          Parameters:
          - **from**: Ethereum address of the signer
          - **documentHash**: Document hash
          - **documentMetadata**: Document metadata as hex string
          - **didEbsiCreator**: DID of the creator as hex string
          - **timestamp** (optional): Timestamp as hex string. By default it uses takes the timestamp from the blockchain
          - **timestampProof** (optional): Timestamp proof as hex string. It must be defined when "timestamp" is defined

          #### removeDocument

          Call to build an unsigned transaction to remove a document and all related resources. Requires an access token with "tnt_write" scope.

          Parameters:
          - **from**: Ethereum address of the signer
          - **documentHash**: Document hash to remove

          #### grantAccess

          Call to build an unsigned transaction to grant a permission for a DID in a specific document. Requires an access token with "tnt_write" scope. "write" grant requires the transaction signer to be creator of the Document, or signer must have "delegate" permission in the Document. "delegate" grant requires the transaction signer to be creator of the Document.

          Parameters:
          - **from**: Ethereum address of the signer
          - **documentHash**: Document hash
          - **grantedByAccount**: DID that grants the permission (hex string format)
          - **subjectAccount**: DID that receives the grant (hex string format)
          - **grantedByAccType**: grantedBy type. Use 0 for "did:ebsi" or 1 for "did:key"
          - **subjectAccType**: subject type. Use 0 for "did:ebsi" or 1 for "did:key"
          - **permission**: Type of permission. Use 0 for "delegate" or 1 for "write"

          #### revokeAccess

          Call to build an unsigned transaction to revoke a permission from a DID in a specific Document. Requires an access token with "tnt_write" scope.

          Parameters:
          - **from**: Ethereum address of the signer
          - **documentHash**: Document hash
          - **revokeByAccount**: DID that revokes the grant (hex string format)
          - **subjectAccount**: DID revoked (hex string format)
          - **permission**: Type of permission. Use 0 for "delegate" or 1 for "write"

          #### writeEvent

          Call to build an unsigned transaction to write an event into a specific document. Requires an access token with "tnt_write" scope. By default it records the timestamp of the blockchain, but it's possible to define a different timestamp with its respective proof.

          Parameters:
          - **from**: Ethereum address of the signer
          - **eventParams**: Event parameters. JSON with the following fields:
            - **documentHash**: Document hash (hex string)
            - **eventHash**: Event hash (hex string)
            - **externalHash**: External hash (string)
            - **sender**: Sender (string)
            - **origin**: Origin (string)
            - **metadata**: Metadata (string)
          - **writer**: DID that writes the event (hex string format)
          - **timestamp** (optional): Timestamp as hex string. By default it uses takes the timestamp from the blockchain
          - **timestampProof** (optional): Timestamp proof as hex string. It must be defined when "timestamp" is defined
          - **timestampSource** (optional): It should be defined when timestamp is defined. Its value should be 1 (external source)

          #### sendSignedTransaction

          Call to send a signed transaction to the blockchain.
          Requires an access token with "tnt_authorise", "tnt_create" or "tnt_write" scope.
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly "2.0"
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              Build tx to authoriseDid:
                value:
                  jsonrpc: "2.0"
                  method: authoriseDid
                  params:
                    - from: "0xc9765eC58E49e6E386549CEAA34FB0d8bB69C320"
                      didEbsi: did:ebsi:z23eve8qDNzYuNVqfSaErpuJ
                      whiteList: "0x01"
                  id: 474
              Build tx to createDocument (using block timestamp):
                value:
                  jsonrpc: "2.0"
                  method: createDocument
                  params:
                    - from: "0xc9765eC58E49e6E386549CEAA34FB0d8bB69C320"
                    - documentHash: "cd299cdabd6299907c31f7cdf112830bda9e2d9f5d33c9fc75dd62caa6b9bd67"
                    - documentMetadata: "0x74657374206d65746164617461"
                    - didEbsiCreator: "0x6469643a656273693a7a32336576653871444e7a59754e5671665361457270754a"
                  id: 474
              Build tx to createDocument (using external timestamp):
                value:
                  jsonrpc: "2.0"
                  method: createDocument
                  params:
                    - from: "0xc9765eC58E49e6E386549CEAA34FB0d8bB69C320"
                    - documentHash: "cd299cdabd6299907c31f7cdf112830bda9e2d9f5d33c9fc75dd62caa6b9bd67"
                    - documentMetadata: "0x74657374206d65746164617461"
                    - didEbsiCreator: "0x6469643a656273693a7a32336576653871444e7a59754e5671665361457270754a"
                    - timestamp: "0x65b776cb"
                    - timestampProof: "0x4d9f29fa5c0676e0888a3be59223609962c93b61c5c022d46812348aaae1b528"
                  id: 474
              Build tx to removeDocument:
                value:
                  jsonrpc: "2.0"
                  method: removeDocument
                  params:
                    - from: "0xc9765eC58E49e6E386549CEAA34FB0d8bB69C320"
                    - documentHash: "cd299cdabd6299907c31f7cdf112830bda9e2d9f5d33c9fc75dd62caa6b9bd67"
                  id: 474
              Build tx to grantAccess:
                value:
                  jsonrpc: "2.0"
                  method: grantAccess
                  params:
                    - from: "0xc9765eC58E49e6E386549CEAA34FB0d8bB69C320"
                    - documentHash: "cd299cdabd6299907c31f7cdf112830bda9e2d9f5d33c9fc75dd62caa6b9bd67"
                    - grantedByAccount: "0x6469643a656273693a7a32336576653871444e7a59754e5671665361457270754a"
                    - subjectAccount: "0x6469643a656273693a7a625a4e464d5863454e664161523137376e394d596738"
                    - grantedByAccType: "0x00"
                    - subjectAccType: "0x00"
                    - permission: "0x01"
                  id: 474
              Build tx to revokeAccess:
                value:
                  jsonrpc: "2.0"
                  method: revokeAccess
                  params:
                    - from: "0xc9765eC58E49e6E386549CEAA34FB0d8bB69C320"
                    - documentHash: "cd299cdabd6299907c31f7cdf112830bda9e2d9f5d33c9fc75dd62caa6b9bd67"
                    - revokeByAccount: "0x6469643a656273693a7a32336576653871444e7a59754e5671665361457270754a"
                    - subjectAccount: "0x6469643a656273693a7a625a4e464d5863454e664161523137376e394d596738"
                    - permission: "0x01"
                  id: 474
              Build tx to writeEvent (using block timestamp):
                value:
                  jsonrpc: "2.0"
                  method: writeEvent
                  params:
                    - from: "0xc9765eC58E49e6E386549CEAA34FB0d8bB69C320"
                    - eventParams:
                        - documentHash: "cd299cdabd6299907c31f7cdf112830bda9e2d9f5d33c9fc75dd62caa6b9bd67"
                        - eventHash: "0x2c406e706b5a365d99fc52072edec3abac8a3e19a57e343df9033851c71631d2"
                        - externalHash: "external hash"
                        - sender: did:ebsi:z23eve8qDNzYuNVqfSaErpuJ
                        - origin: origin
                        - metadata: "test metadata"
                    - writer: "0x6469643a656273693a7a32336576653871444e7a59754e5671665361457270754a"
                  id: 474
              Build tx to writeEvent (using external timestamp):
                value:
                  jsonrpc: "2.0"
                  method: writeEvent
                  params:
                    - from: "0xc9765eC58E49e6E386549CEAA34FB0d8bB69C320"
                    - eventParams:
                        - documentHash: "cd299cdabd6299907c31f7cdf112830bda9e2d9f5d33c9fc75dd62caa6b9bd67"
                        - eventHash: "0x2c406e706b5a365d99fc52072edec3abac8a3e19a57e343df9033851c71631d2"
                        - externalHash: "external hash"
                        - sender: did:ebsi:z23eve8qDNzYuNVqfSaErpuJ
                        - origin: origin
                        - metadata: "test metadata"
                    - writer: "0x6469643a656273693a7a32336576653871444e7a59754e5671665361457270754a"
                    - timestamp: "0x65b776cb"
                    - timestampProof: "0x4d9f29fa5c0676e0888a3be59223609962c93b61c5c022d46812348aaae1b528"
                    - timestampSource: "0x01"
                  id: 474
              Send Transaction:
                value:
                  jsonrpc: "2.0"
                  method: sendSignedTransaction
                  id: 1
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x89205A3A3b2A69De6Dbf7f01ED13B2108B2c43e7"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
                      s: "0x..."
                      v: "0x..."
                      signedRawTransaction: "--- signed raw transaction ---"
      responses:
        "200":
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
              examples:
                Build tx:
                  value:
                    jsonrpc: "2.0"
                    id: 482
                    result:
                      from: "0x8445fC96e27ceB0d1794be16a1Ac8BF5D765AACB"
                      to: "0x823BBc0ceE3dE3B61AcfA0CEedb951AB9a013F05"
                      data: ""
                      value: "0x0"
                      nonce: "0xb1d3"
                      chainId: "0x181f"
                      gasLimit: "0x1000000"
                      gasPrice: "0x0"
                Send a transaction:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: "0xe670ec64341771606e55d6b4ca35a1a6b75ee3d5145a99d05921026d1527331"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
components:
  schemas:
    ProblemDetails:
      title: Problem Details
      description: A [Problem Details](https://datatracker.ietf.org/doc/html/rfc7807) object.
      type: object
      x-examples:
        Not Enough Credit:
          type: https://example.com/probs/out-of-credit
          title: You do not have enough credit.
          detail: Your current balance is 30, but that costs 50.
          instance: /account/12345/msgs/abc
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide
            human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem. It may or may
            not yield further information if dereferenced.
    Links:
      title: Links
      description: Links model used for pagination
      type: object
      properties:
        last:
          type: string
          description: URI of the last page
        prev:
          type: string
          description: URI of the previous page
        next:
          type: string
          description: URI of the next page
        first:
          type: string
          description: URI of the first page
    Document:
      title: Document
      description: Track and Trace Document
      type: object
      properties:
        metadata:
          description: Document's metadata
          type: string
        timestamp:
          description: Timestamp object
          type: object
          properties:
            datetime:
              type: string
              description: |
                The date and time, optionally from transaction input
            source:
              type: string
              description: |
                Defines how the datetime was resolved, enumerated options are "block" and "external"
            proof:
              type: string
              description: |
                Proof of the source. Either a block number or a hash of timestamp certificate
        events:
          type: array
          description: List of event hashes
          items:
            type: string
            description: Event hash
        creator:
          type: string
          description: The `did:key` or `did:ebsi` that created the document
    Event:
      title: Event
      description: Track and Trace Event
      type: object
      properties:
        metadata:
          description: Event's metadata
          type: string
        timestamp:
          description: Timestamp object
          type: object
          properties:
            datetime:
              type: string
              description: |
                The date and time, optionally from transaction input
            source:
              type: string
              description: |
                Defines how the datetime was resolved, enumerated options are "block" and "external"
            proof:
              type: string
              description: |
                Proof of the source. Either a block number or a hash of timestamp certificate
        sender:
          type: string
          description: |
            The `did:key` or `did:ebsi` that had permission with "write" for the given Document
        origin:
          type: string
          description: |
            Most of the times empty field, while it may be a string containing company name, while
            it can also point into an Event. All assumed relations are external to the SC.
        hash:
          type: string
          description: Event hash
        externalHash:
          type: string
          description: Externally generated hash
    JsonRpcResponse:
      title: JSON-RPC Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly "2.0"
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: object
            - type: string
  examples:
    BadRequest:
      value:
        title: Bad request
        status: 400
        detail: Bad request
    InvalidToken:
      value:
        title: Invalid token
        status: 400
        detail: Invalid token
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
  securitySchemes:
    bearerAuth:
      description: >

      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: http://localhost
    description: Local Computer Environment
  - url: https://api-test.ebsi.eu
    description: EBSI Test Environment
  - url: https://api-pilot.ebsi.eu
    description: EBSI Pilot Environment
  - url: https://api-conformance.ebsi.eu
    description: EBSI Conformance Environment
