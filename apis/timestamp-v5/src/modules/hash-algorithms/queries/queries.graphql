query GetHashAlgorithms($skip: Int!, $pagesize: Int!, $where: HashAlgo_filter) {
  hashAlgos(first: $pagesize, skip: $skip, where: $where) {
    id
  }
}

query GetHashAlgorithm($hashAlgorithmId: String!) {
  hashAlgo(id: $hashAlgorithmId) {
    ianaName
    multiHash
    oid
    outputLength
    status
  }
}

query GetBlockTimestamp {
  _meta {
    block {
      timestamp
    }
  }
}
