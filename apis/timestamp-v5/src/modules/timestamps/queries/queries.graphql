query GetTimestamps($skip: Int!, $pagesize: Int!, $where: TimestampSet_filter) {
  timestampSets(first: $pagesize, skip: $skip, where: $where) {
    id
  }
}

query GetTimestamp($timestampId: String!) {
  timestampSet(id: $timestampId) {
    creator
    blockNumber
    transactionHash
    timestamp
    hashAlgorithmId
    timestampData
    hashValue
  }
}
