openapi: 3.0.3
info:
  title: Authorisation API v3
  version: 3.0.0
  description: |
    The Authorisation API is a core EBSI service responsible to issue Short Living
    Access Tokens (JWT) to the EBSI Platform for Legal Entities and trusted Applications (EBSI or third-party applications)
    in exchange of their presentation of a EBSI Verifiable Credential.
    Access tokens are required by entities and applications to access the protected
    resources of EBSI.

    Users receive access tokens after they present a valid EBSI Verifiable
    Credential and prove ownership over their DID.

    Trusted Applications receive access tokens if they are well registered in
    the Trusted Apps Registry (application public keys are listed), are
    authorised there to access the requested protected resources, and
    successfully prove their private key ownership. We implement the
    Authenticated Key Exchange cryptographic identification protocol.
  termsOfService: https://api-pilot.ebsi.eu/docs/terms
  contact:
    name: EBSI Support - Service Desk
    url: https://ec.europa.eu/digital-building-blocks/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
servers:
  - url: http://localhost
    description: Local Computer Environment
  - url: https://api-test.ebsi.eu
    description: EBSI Test Environment
  - url: https://api-pilot.ebsi.eu
    description: EBSI Pilot Environment
  - url: "https://api-conformance.ebsi.eu"
    description: EBSI Conformance Environment
tags:
  - name: OpenID Provider
    description: Groups OIDC related endpoints
paths:
  /authorisation/v3/.well-known/openid-configuration:
    get:
      operationId: get-v3-well-known-openid-config
      tags:
        - OpenID Provider
      summary: OpenID Provider Metadata
      description: Exposes the configuration of the OpenID Provider
      responses:
        "200":
          description: OpenID Provider Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/openid-configuration"
  /authorisation/v3/jwks:
    get:
      operationId: get-v3-jwks
      description: Exposes the public keys used by this authorisation server
      tags:
        - OpenID Provider
      summary: OpenID Provider's public keys
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/jwks"
  /authorisation/v3/authorize:
    get:
      tags:
        - OpenID Provider
      operationId: get-v3-authorize
      summary: Authorize the requestor from PAR handler
      description: |
        `request_uri` can only be paired with `client_id`

        `response_type` as `code` will cause redirection towards wallet. Redirection is a Dynamic Credential Request,
        which cointains information on how to sign the vp_token.
        Redirection can be populated with other parameters to carry information like `code_challenge` and `redirect_uri`.

        `scope` parameter is used to build `presentation_definition`, which will guide the wallet to choose
        Verifiable Credentials accepted by the Authorisation Server.
      parameters:
        - $ref: "#/components/parameters/scope"
        - $ref: "#/components/parameters/response_type"
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/request_uri"
        - $ref: "#/components/parameters/redirect_uri"
        - $ref: "#/components/parameters/code_challenge"
        - $ref: "#/components/parameters/code_challenge_method"
      responses:
        "302":
          description: |
            redirect_uri?<x-www-form-urlencoded OIDC Authentication Response>
            or redirect_uri?<x-www-form-urlencoded Dynamic Credential Request>
            or <x-www-form-urlencoded OIDC Error response>
          content:
            application/x-www-form-urlencoded:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/auth_resp"
                  - $ref: "#/components/schemas/dyn_cred_req"
        "4XX":
          $ref: "#/components/responses/oidc_error"
  /authorisation/v3/par:
    post:
      tags:
        - OpenID Provider
      operationId: par-v3-request
      summary: Provide authentication proofs with PAR
      description: |
        PAR - https://datatracker.ietf.org/doc/html/rfc9126
        Only Authorization Code flow is supported.

        Accepts same parameters as /authorize endpoint, with exclusion of `request_uri`.
        `vp_token` and `presentation_submission` must be provided as an extra.
      parameters:
        - $ref: "#/components/parameters/response_type"
        - $ref: "#/components/parameters/scope"
        - $ref: "#/components/parameters/vp_token"
        - $ref: "#/components/parameters/presentation_submission"
        - $ref: "#/components/parameters/redirect_uri"
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/code_challenge"
        - $ref: "#/components/parameters/code_challenge_method"
      responses:
        "302":
          description: |
            redirect_uri?<x-www-form-urlencoded OIDC Authentication Response>
            or <x-www-form-urlencoded OIDC Error response>
          content:
            application/x-www-form-urlencoded:
              schema:
                $ref: "#/components/schemas/par_response"
        "4XX":
          $ref: "#/components/responses/oidc_error"
  /authorisation/v3/presentation-definitions:
    get:
      operationId: get-v3-presentation-definitions
      tags:
        - OpenID Provider
      summary: Get presentation definition requirements
      description: Get presentation definition requirements
      parameters:
        - $ref: "#/components/parameters/scope"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/presentation_definitions_response"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Bad Request:
                  value:
                    title: "Bad Request"
                    status: 400
                    detail: '["scope must be one of the following values: openid, did_write, tir_write, generic_write"]'
                    type: about:blank
  /authorisation/v3/token:
    get:
      operationId: get-v3-token
      tags:
        - OpenID Provider
      summary: Exchange code into an access token
      description: Exchange code into an access token
      parameters:
        - $ref: "#/components/parameters/code"
        - $ref: "#/components/parameters/code_verifier"
        - $ref: "#/components/parameters/redirect_uri"
      responses:
        "200":
          description: Success
          headers:
            Cache-Control:
              description: no-store.
              schema:
                type: string
              example: no-store
            Pragma:
              description: no-cache.
              schema:
                type: string
              example: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/token_response"
        "4XX":
          $ref: "#/components/responses/oidc_error"
components:
  schemas:
    request_uri:
      title: PAR Request URI
      type: string
      format: URI
      example: "urn:ietf:params:oauth:request_uri:6esc_11ACC5bwc014ltc14eY22c"
    par_response:
      title: PAR Authentication Response
      type: object
      properties:
        request_uri:
          $ref: "#/components/schemas/request_uri"
        expires_in:
          type: integer
          example: 60
    token_response:
      title: OIDC - Access Token Response
      type: object
      properties:
        access_token:
          type: string
          description: The access token issued by the authorization server
        token_type:
          type: string
          description: Only Bearer supported
          example: bearer
        expires_in:
          minimum: 1
          type: integer
          description: The lifetime in seconds of the access token
          example: 60
        scope:
          type: string
          description: The scope of the access token
        id_token:
          type: string
          description: ID Token value associated with the authenticated session. Presents client's identity
        c_nonce:
          description: A string containing a random challenge that needs to be signed to create proof of possession of key material. This value MUST be random and used only once.
          type: string
          example: 6eed1c940f5b
        c_nonce_expires_in:
          description: |
            Value denoting the lifetime in seconds of the c_nonce
          type: integer
          example: 86400
      required:
        - access_token
        - id_token
        - token_type
        - scope
        - c_nonce
        - c_nonce_expires_in
    dyn_cred_req:
      title: Dynamic Credential Request
      description: Contains information on what to send into PAR
      type: object
      properties:
        response_type:
          type: string
          description: The OIDC flow to be used
          example: code
        scope:
          type: string
          description: Request Type
          example: openid code
        presentation_definition:
          type: string
          description: Instructions for presentation_submission and vp_token
          example: https://openid.net/specs/openid-4-verifiable-presentations-1_0.html#name-presentation_definition
        redirect_uri:
          type: string
        client_id:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
        nonce:
          type: string
          description: Required nonce for replay attacks
    auth_resp:
      title: OIDC - Authentication Response Object
      description: OpenID Connect Authorisation Response object.
      type: object
      required:
        - code
        - redirect_uri
      properties:
        code:
          type: string
          description: The authorization code generated by the authorization server
        redirect_uri:
          type: string
          description: target for redirection
    jwk:
      title: JSON Web Key
      type: object
      properties:
        kty:
          type: string
          example: EC
        crv:
          type: string
          example: P-256
        alg:
          type: string
          example: ES256
        x:
          type: string
          example: "ZYE6uX3XvQ9rLc6s0eeo2YiOM2VfwrEZOZXzTOthcHE"
        y:
          type: string
          example: "k-t1bfe-MmmXWQ0QaxK3uJMYlMNkJHYGUSLpxP9RQak"
    jwks:
      title: JSON Web Key Set
      type: array
      items:
        $ref: "#/components/schemas/jwk"
    openid-configuration:
      title: OpenID Provider Discovery Metadata
      type: object
      properties:
        issuer:
          type: string
          description: |
            URL using the https scheme with no query or fragment component
            that the OP asserts as its Issuer Identifier
        authorization_endpoint:
          type: string
          description: |
            URL of the OP's OAuth 2.0 Authorization Endpoint
        token_endpoint:
          type: string
          description: |
            URL of the OP's OAuth 2.0 Token Endpoint. This is REQUIRED unless only the
            Implicit Flow is used.
        userinfo_endpoint:
          type: string
          description: |
            URL of the OP's UserInfo Endpoint. This URL MUST use the
            https scheme and MAY contain port, path, and query parameter components.
        pushed_authorization_request_endpoint:
          type: string
          description: |
            The URL of the pushed authorization request endpoint at which a client can
            post an authorization request to exchange for a request_uri value usable at the authorization server.
        jwks_uri:
          type: string
          description: |
            URL of the OP's JSON Web Key Set [JWK] document. This contains
            the signing key(s) the RP uses to validate signatures from the OP. The JWK
            Set MAY also contain the Server's encryption key(s), which are used by RPs
            to encrypt requests to the Server. When both signing and encryption keys
            are made available, a use (Key Use) parameter value is REQUIRED for all
            keys in the referenced JWK Set to indicate each key's intended usage.
            Although some algorithms allow the same key to be used for both signatures
            and encryption, doing so is NOT RECOMMENDED, as it is less secure. The JWK
            x5c parameter MAY be used to provide X.509 representations of keys
            provided. When used, the bare key values MUST still be present and MUST
            match those in the certificate.
        scopes_supported:
          type: array
          items:
            type: string
          description: |
            JSON array containing a list of the OAuth 2.0 [RFC6749] scope
            values that this server supports
        response_types_supported:
          type: array
          items:
            type: string
          description: |
            JSON array containing a list of the OAuth 2.0 response_type
            values that this OP supports
        response_modes_supported:
          type: array
          items:
            type: string
          description: |
            JSON array containing a list of the OAuth 2.0 response_mode
            values that this OP supports
        grant_types_supported:
          type: array
          items:
            type: string
          description: |
            JSON array containing a list of the OAuth 2.0 Grant Type values
            that this OP supports
        subject_types_supported:
          type: array
          items:
            type: string
          description: |
            JSON array containing a list of the Subject Identifier types
            that this OP supports
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: |
            JSON array containing a list of the JWS signing algorithms (alg
            values) supported by the OP for the ID Token to encode the Claims in a JWT
        userinfo_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: |
            JSON array containing a list of the JWS signing algorithms (alg
            values) [JWA] supported by the UserInfo Endpoint to encode the Claims in a
            JWT
        request_object_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: |
            JSON array containing a list of the JWS signing algorithms (alg
            values) supported by the OP for Request Objects
        request_parameter_supported:
          type: boolean
          description: |
            Boolean value specifying whether the OP supports use of the
            request parameter, with true indicating support. If omitted, the default
            value is false
        request_uri_parameter_supported:
          type: boolean
          description: |
            Boolean value specifying whether the OP supports use of the
            request_uri parameter, with true indicating support. If omitted, the
            default value is true
        vp_formats_supported:
          type: object
          properties:
            jwt_vc:
              type: object
              properties:
                alg_values_supported:
                  type: array
                  items:
                    type: string
                  example: ["ES256"]
        subject_syntax_types_supported:
          type: array
          items:
            type: string
          description: |
            A JSON array of strings representing URI scheme identifiers and optionally method names
            of supported Subject Syntax Types.
      required:
        - issuer
        - authorization_endpoint
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
        - subject_syntax_types_supported
    presentation_definitions_response:
      title: Presentation Definitions Response
      type: object
      description: Must be a valid Presentation Definition, as defined in https://identity.foundation/presentation-exchange/spec/v2.0.0/#presentation-definition
    ProblemDetails:
      title: Problem Details
      description: A [Problem Details](https://datatracker.ietf.org/doc/html/rfc7807) object.
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide
            human-readable documentation for the problem type.
          default: "about:blank"
        title:
          type: string
          description: A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem. It may or may
            not yield further information if dereferenced.
  responses:
    oidc_error:
      description: OIDC Error Response
      content:
        application/x-www-form-urlencoded:
          schema:
            title: OIDC Error Response
            type: object
            properties:
              error:
                type: string
                example: some_explicit_error
              error_description:
                type: string
                example: Something more descriptive
              c_nonce:
                description: JSON string containing a nonce to be used to create a proof of possession of key material when requesting a credential
                type: string
                example: 6eed1c940f5b
              c_nonce_expires_in:
                description: JSON integer denoting the lifetime in seconds of the c_nonce.
                type: integer
                example: 300
  parameters:
    vp_token:
      in: query
      name: vp_token
      description: Signed Verifiable Presentation
      schema:
        type: string
        example: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NiIsImtpZCI6ImRpZDplYnNpOnp2SFdYMzU5QTNDdmZKbkNZYUFpQWRlI0YwcjVPeXRfbGFodnZ6Nk1XbFlzM21jWU5LWmlpUWRVZnF2OHRzaEhOOXcifQ..CfwWBrkwOYyrm93A4QEaCCKvG14G0iqr-smrUyrUyC7YBOxhSkYPZgvOy6YCsjFT59Gczd_C0K8Pbni-AH7NRQ
    presentation_submission:
      in: query
      name: presentation_submission
      description: Descriptor for the vp_token, linked by presentation_definition
      schema:
        type: string
        example: |
          non-normative example
          {
            "id": "jwt_vp with one jwt_vc",
            "definition_id": "Selecting JWT from credentials",
            "descriptor_map": [
              {
                "id": "requested credential id",
                "format": "jwt_vp",
                "path": "$",
                "path_nested": {
                  "format": "jwt_vc",
                  "path": "$.vp.verifiableCredential[0]"
                }
              }
            ]
          }
    response_type:
      in: query
      name: response_type
      description: OIDC Response Type
      schema:
        type: string
        example: code
    scope:
      in: query
      name: scope
      description: OIDC scope
      schema:
        type: string
        example: openid did_write tir_write generic_write
    code:
      in: query
      name: code
      description: Authorization code
      schema:
        type: string
        example: SplxlOBeZQQYbYS6WxSbIA
      required: true
      allowEmptyValue: false
    code_verifier:
      in: query
      name: code_verifier
      required: true
      schema:
        maxLength: 128
        minLength: 43
        type: string
      description: high-entropy cryptographic random STRING
      example: EbWPr9dknKvBDg8r8zRroG82bFZaSqSWeCKjvj_AI1w
    request_uri:
      in: query
      name: request_uri
      required: false
      schema:
        $ref: "#/components/schemas/request_uri"
    redirect_uri:
      in: query
      name: redirect_uri
      required: false
      description: Callback location where the authorization code or tokens should be redirected.
      schema:
        type: string
        format: URI
      allowEmptyValue: false
      example: "https://client.example.org/cb"
    client_id:
      name: client_id
      in: query
      description: |
        The client identifier - MUST be URL
      schema:
        type: string
        format: URL
      required: true
      allowEmptyValue: false
      example: "https://root-tao.example.com/auth/zxvf4982z"
    code_challenge:
      in: query
      name: code_challenge
      schema:
        type: string
    code_challenge_method:
      in: query
      name: code_challenge_method
      schema:
        type: string
