openapi: 3.1.0
info:
  title: Timestamp API v3
  version: 3.0.0
  description: |
    Timestamp API is an EBSI core service. It enables us to interact with the TimeStamp SC to
    * timestamp hashes,
    * supports timestamping records/versions (and linking the timestamps)
    * verify timestamps.
  contact:
    name: EBSI Support - Service Desk
    url: https://ec.europa.eu/digital-building-blocks/tracker/plugins/servlet/desk/portal/11
  license:
    name: "EUPL-1.2"
    url: "https://joinup.ec.europa.eu/page/eupl-text-11-12"
paths:
  /timestamp/v3/hash-algorithms:
    get:
      operationId: get-hash-algorithms
      summary: List hash algorithms
      description: Returns a list of hash algorithms.
      tags:
        - Hash algorithms
      parameters:
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to hash algorithms
                  items:
                    type: array
                    description: List of hash algorithms
                    items:
                      type: object
                      properties:
                        hashAlgorithmId:
                          type: number
                          description: ID of the hash algorithm
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                Success:
                  value:
                    self: https://api-pilot.ebsi.eu/timestamp/v3/hash-algorithms?page[after]=3&page[size]=2
                    items:
                      - hashAlgorithmId: 4
                        href: https://api-pilot.ebsi.eu/timestamp/v3/hash-algorithms/4
                      - hashAlgorithmId: 5
                        href: https://api-pilot.ebsi.eu/timestamp/v3/hash-algorithms/5
                    total: 8
                    pageSize: 2
                    links:
                      first: https://api-pilot.ebsi.eu/timestamp/v3/hash-algorithms?page[after]=1&page[size]=2
                      prev: https://api-pilot.ebsi.eu/timestamp/v3/hash-algorithms?page[after]=2&page[size]=2
                      next: https://api-pilot.ebsi.eu/timestamp/v3/hash-algorithms?page[after]=4&page[size]=2
                      last: https://api-pilot.ebsi.eu/timestamp/v3/hash-algorithms?page[after]=42&page[size]=2
        "400":
          description: Bad Request Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Bad Paging Request:
                  value:
                    title: Bad Paging Request
                    status: 400
                    detail: PageSize should not be greater than 50
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /timestamp/v3/hash-algorithms/{hashAlgorithmId}:
    get:
      operationId: get-hash-algorithm
      summary: Get a hash algorithm
      description: Returns a hash algorithm identified by its ID.
      tags:
        - Hash algorithms
      parameters:
        - name: hashAlgorithmId
          in: path
          schema:
            type: string
          example: "0"
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HashAlgorithm"
              examples:
                Success:
                  value:
                    outputLengthBits: 256
                    ianaName: sha-256
                    oid: "2.16.840.1.101.3.4.2.1"
                    status: active
                    multihash: sha2-256
        "400":
          description: Bad Request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Invalid {hashAlgorithmId} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {hashAlgorithmId} parameter is not valid
        "404":
          description: Not found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Hash algorithm Not Found:
                  $ref: "#/components/examples/NotFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /timestamp/v3/timestamps:
    get:
      operationId: get-timestamps
      summary: List timestamps
      description: Returns a list of timestamps.
      tags:
        - Timestamps
      parameters:
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to timestamps
                  items:
                    type: array
                    description: List of timestamps
                    items:
                      type: object
                      properties:
                        timestampId:
                          type: string
                          description: |
                            Multihash of the sha256 of the original hash, encoded in multibase
                            base64url.
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                Success:
                  value:
                    self: https://api-pilot.ebsi.eu/timestamp/v3/timestamps?page[after]=3&page[size]=2
                    items:
                      - timestampId: uEiCuezPKD4AhaK0LCCH85rrMSK-G-0M4Merd2ASZO-59HQ
                        href: https://api-pilot.ebsi.eu/timestamp/v3/timestamps/uEiCuezPKD4AhaK0LCCH85rrMSK-G-0M4Merd2ASZO-59HQ
                      - timestampId: uEiCw27hwe5frnhyPo_NDlptLth1oWZ_UdpcuVHYiA2vavg
                        href: https://api-pilot.ebsi.eu/timestamp/v3/timestamps/uEiCuezPKD4AhaK0LCCH85rrMSK-G-0M4Merd2ASZO-59HQ
                    total: 415
                    pageSize: 2
                    links:
                      first: https://api-pilot.ebsi.eu/timestamp/v3/timestamps?page[after]=1&page[size]=2
                      prev: https://api-pilot.ebsi.eu/timestamp/v3/timestamps?page[after]=2&page[size]=2
                      next: https://api-pilot.ebsi.eu/timestamp/v3/timestamps?page[after]=4&page[size]=2
                      last: https://api-pilot.ebsi.eu/timestamp/v3/timestamps?page[after]=208&page[size]=2
        "400":
          description: Bad Request Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Bad Paging Request:
                  value:
                    title: Bad Paging Request
                    status: 400
                    detail: PageSize should not be greater than 50
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /timestamp/v3/timestamps/{timestampId}:
    get:
      operationId: get-timestamp
      summary: Get a timestamp
      description: Returns a timestamp identified by its ID.
      tags:
        - Timestamps
      parameters:
        - name: timestampId
          description: |
            Multihash of the sha256 of the original hash, encoded in multibase base64url.

            ```
            timestampId = multibase_base64url(multihash(sha256(original_hash)))
            ```

            Example: let's assume the original hash is a sha3-224 with the value
            `0xb2a8e000d1f25778cecf6b29fc0e7f811fb5f4a3a8230585e9056921`.

            It is stored in the smart contract with the timestamp ID
            `0xb2a8e000d1f25778cecf6b29fc0e7f811fb5f4a3a8230585e9056921`, which corresponds to the
            sha256 of the original hash.

            The multihash representation of
            `0xb2a8e000d1f25778cecf6b29fc0e7f811fb5f4a3a8230585e9056921` is
            `EiCPQS4deZG8y1FXlG9sW1vDfMbpulXYTkn0HWj2OWd61A` (encoded in base64url).

            At the API-level, the timestamp ID is then
            `uEiCPQS4deZG8y1FXlG9sW1vDfMbpulXYTkn0HWj2OWd61A`, i.e. it's the multibase base64url
            (prefix "u") encoded multihash.
          in: path
          schema:
            type: string
          examples:
            "timestampId":
              description: Valid pilot timestampId
              value: uEiBrUuxV-ybYtSQ4oiczDhFkmUR7Wk6QtF26SXaD9h9RTg
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timestamp"
              examples:
                Success:
                  value:
                    hash: mE0BoK9lFXyC8pGx0XW6O/VuO8WBLMlS7KLx2bah55YH/VhaorawVrWFr/hMnbgBpR3vNSx8tA0A6MxtNmqNwjHaR
                    timestampedBy: "0xb8d511d80D9Cc1cFAfa79973edE37278d8B1ebd7"
                    blockNumber: 1880267
                    timestamp: "2021-08-30T15:20:16.000Z"
                    data: "0x7b2274657374223a3734327d"
                    transactionHash: "0x125988a9a6a9a02da35981dee230e1900088ef7fc5064c1f1d2225ef2d2c53e6"
        "400":
          description: Bad Request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Invalid {timestampId} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {timestampId} parameter is not valid
        "404":
          description: Not found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Hash algorithm Not Found:
                  $ref: "#/components/examples/NotFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /timestamp/v3/records:
    get:
      operationId: get-records
      summary: List records
      description: Returns a list of records.
      tags:
        - Records
      parameters:
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
        - in: query
          name: first-version
          schema:
            type: string
          description: Filter records by first version hash
          example: "0xd301a3ed77f70f18511ce5e4cf1895b1a38622c8d177b6b06a66c593a836a000"
        - in: query
          name: owner
          schema:
            type: string
          description: Filter records by owner address
          example: "0x94e88a60f272309fdedef19498d8e05b3f632f9f"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to records
                  items:
                    type: array
                    description: List of records
                    items:
                      type: object
                      properties:
                        recordId:
                          type: string
                          description: ID of the record (multibase base64url encoded)
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                Success:
                  value:
                    self: https://api-pilot.ebsi.eu/timestamp/v3/records?page[after]=1&page[size]=2
                    items:
                      - recordId: uayjbVvTT2SAAKvbiNg76PeSt1BLpHX4ah-xoGM4QqCE
                        href: https://api-pilot.ebsi.eu/timestamp/v3/records/uayjbVvTT2SAAKvbiNg76PeSt1BLpHX4ah-xoGM4QqCE
                    total: 1
                    pageSize: 1
                    links:
                      first: https://api-pilot.ebsi.eu/timestamp/v3/records?page[after]=1&page[size]=2
                      prev: https://api-pilot.ebsi.eu/timestamp/v3/records?page[after]=1&page[size]=2
                      next: https://api-pilot.ebsi.eu/timestamp/v3/records?page[after]=1&page[size]=2
                      last: https://api-pilot.ebsi.eu/timestamp/v3/records?page[after]=1&page[size]=2
        "400":
          description: Bad Request Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Bad Paging Request:
                  value:
                    title: Bad Paging Request
                    status: 400
                    detail: PageSize should not be greater than 50
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /timestamp/v3/records/{recordId}:
    get:
      operationId: get-record
      summary: Get a record
      description: Returns a record identified by its ID.
      tags:
        - Records
      parameters:
        - in: path
          name: recordId
          schema:
            type: string
          description: Record ID (multibase base64url encoded)
          examples:
            "recordId":
              description: Valid Pilot multibase base64url encoded recordId
              value: uayjbVvTT2SAAKvbiNg76PeSt1BLpHX4ah-xoGM4QqCE
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
              examples:
                Success:
                  value:
                    ownerIds:
                      - "0x62165ec5d61..."
                      - "0x654dv561165..."
                      - "0x56e87f15a16..."
                    revokedOwnerIds:
                      - "0xa1565165ef1..."
                    firstVersionTimestamps:
                      - "0x1659411f..."
                    lastVersionTimestamps:
                      - "0x984651fa..."
                    totalVersions: 4
        "400":
          description: Bad Request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Invalid {versionId} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {versionId} parameter is not valid
        "404":
          description: Not found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Hash algorithm Not Found:
                  $ref: "#/components/examples/NotFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /timestamp/v3/records/{recordId}/versions:
    get:
      operationId: get-record-versions
      summary: List a record's versions
      description: Returns a list of versions of a given record.
      tags:
        - Records
      parameters:
        - in: path
          name: recordId
          schema:
            type: string
          examples:
            "recordId":
              description: Valid Pilot multibase base64url encoded recordId
              value: uayjbVvTT2SAAKvbiNg76PeSt1BLpHX4ah-xoGM4QqCE
          description: Record ID (multibase base64url encoded)
          required: true
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to versions
                  items:
                    type: array
                    description: List of versions
                    items:
                      type: object
                      properties:
                        versionId:
                          type: number
                          description: ID of the version
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                Success:
                  value:
                    self: https://api-pilot.ebsi.eu/timestamp/v3/records/uayjbVvTT2SAAKvbiNg76PeSt1BLpHX4ah-xoGM4QqCE/versions?page[after]=1&page[size]=2
                    items:
                      - versionId: 0
                        href: https://api-pilot.ebsi.eu/timestamp/v3/records/uayjbVvTT2SAAKvbiNg76PeSt1BLpHX4ah-xoGM4QqCE/versions/0
                    total: 1
                    pageSize: 2
                    links:
                      first: https://api-pilot.ebsi.eu/timestamp/v3/records/uayjbVvTT2SAAKvbiNg76PeSt1BLpHX4ah-xoGM4QqCE/versions?page[after]=1&page[size]=2
                      prev: https://api-pilot.ebsi.eu/timestamp/v3/records/uayjbVvTT2SAAKvbiNg76PeSt1BLpHX4ah-xoGM4QqCE/versions?page[after]=1&page[size]=2
                      next: https://api-pilot.ebsi.eu/timestamp/v3/records/uayjbVvTT2SAAKvbiNg76PeSt1BLpHX4ah-xoGM4QqCE/versions?page[after]=1&page[size]=2
                      last: https://api-pilot.ebsi.eu/timestamp/v3/records/uayjbVvTT2SAAKvbiNg76PeSt1BLpHX4ah-xoGM4QqCE/versions?page[after]=1&page[size]=2
        "400":
          description: Bad Request Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Bad Paging Request:
                  value:
                    title: Bad Paging Request
                    status: 400
                    detail: PageSize should not be greater than 50
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /timestamp/v3/records/{recordId}/versions/{versionId}:
    get:
      operationId: get-record-version
      summary: Get a version
      description: Returns a record version identified by its version ID.
      tags:
        - Records
      parameters:
        - in: path
          name: recordId
          schema:
            type: string
          examples:
            "recordId":
              description: Valid Pilot multibase base64url encoded recordId
              value: uayjbVvTT2SAAKvbiNg76PeSt1BLpHX4ah-xoGM4QqCE
          description: Record ID (multibase base64url encoded)
          required: true
        - in: path
          name: versionId
          schema:
            type: string
          example: "0"
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
              examples:
                Success:
                  value:
                    hashes:
                      - "0x62165ec5d61..."
                      - "0x654dv561165..."
                      - "0x56e87f15a16..."
                    info:
                      - {
                          "@context": "https://json-ld.org/contexts/person.jsonld",
                          "@id": "http://dbpedia.org/resource/John_Lennon",
                          "name": "John Lennon",
                          "born": "1940-10-09",
                          "spouse": "http://dbpedia.org/resource/Cynthia_Lennon",
                        }
                      - {
                          "@context": "https://json-ld.org/contexts/person.jsonld",
                          "@id": "http://dbpedia.org/resource/John_Lennon",
                          "name": "John Lennon",
                          "born": "1940-10-09",
                          "spouse": "http://dbpedia.org/resource/Cynthia_Lennon",
                        }
        "400":
          description: Bad Request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Invalid {versionId} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {versionId} parameter is not valid
        "404":
          description: Not found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Hash algorithm Not Found:
                  $ref: "#/components/examples/NotFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
components:
  schemas:
    ProblemDetails:
      title: Problem Details
      description: A [Problem Details](https://datatracker.ietf.org/doc/html/rfc7807) object.
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: "about:blank"
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    HashAlgorithm:
      title: Hash algorithm
      type: object
      properties:
        outputLengthBits:
          type: number
          description: Hash algorithm output length in bits. 0 if the output length if variable.
        ianaName:
          type: string
          description: Hash algorithm IANA name.
        oid:
          type: string
          description: Object identifier.
        status:
          type: string
          description: Status of the algorithm (active, revoked).
        multihash:
          type: string
          description: Multihash name
    Record:
      title: Record
      type: object
      properties:
        ownerIds:
          description: A list of record owners/controllers
          type: array
          items:
            type: string
        revokedOwnerIds:
          description: A list of revoked owners/controllers
          type: array
          items:
            type: string
        firstVersionTimestamps:
          description: A list of the first version timestamps
          type: array
          items:
            type: string
        lastVersionTimestamps:
          description: A list of the last version timestamps
          type: array
          items:
            type: string
        totalVersions:
          description: A total number of versions
          type: number
    Version:
      title: Version
      type: object
      properties:
        hashes:
          type: array
          items:
            type: string
          description: A list of timestamped version hashes
        info:
          type: array
          items:
            type: object
          description: A list of info objects (should be JSON-LD)
    Timestamp:
      title: Timestamp information
      type: object
      properties:
        hash:
          description: Timestamped hash (multi-hash, base64 multi-encoded)
          type: string
        timestampedBy:
          description: Address of the transaction signer that timestamped the information.
          type: string
        blockNumber:
          description: Number of the block in which the hash has been timestamped.
          type: integer
        timestamp:
          description: Timestamp in ISO 8601 format
          type: string
        transactionHash:
          description: Hash of the transaction/transaction id.
          type: string
        data:
          description: Additional timestamp data (bytes, serialized JSON-LD)
          type: string
    Links:
      title: Links
      description: Links model used for pagination.
      type: object
      properties:
        last:
          type: string
          description: URI of the last page
        prev:
          type: string
          description: URI of the previous page
        next:
          type: string
          description: URI of the next page
