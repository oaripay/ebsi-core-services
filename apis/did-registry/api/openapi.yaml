components:
  schemas:
    ProblemDetails:
      title: Problem Details
      description: A [Problem Details](https://datatracker.ietf.org/doc/html/rfc7807) object.
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    Links:
      title: Links
      description: Links model used for pagination
      type: object
      properties:
        last:
          type: string
          description: URI of the last page
        prev:
          type: string
          description: URI of the previous page
        next:
          type: string
          description: URI of the next page
        first:
          type: string
          description: URI of the first page
    Attribute:
      title: Attribute
      description: Generic attribute model
      type: object
      properties:
        hash:
          type: string
          description: sha256 hash of the payload
        body:
          description: Base64 encoded content
    DIDDocument:
      title: DID Document
      description: DID Document as a JSON-LD document
      type: object
      additionalProperties: true
      properties:
        "@context":
          description: DID Document @context
          oneOf:
            - type: string
              format: uri
            - type: array
              items:
                type: string
                format: uri
    DIDDocumentMetadata:
      title: DID Document metadata
      description: DID Document metadata as a JSON document
      type: object
    DIDTimestamp:
      title: DID Timestamp
      description: DID Timestamp
      type: object
      additionalProperties: true
      properties:
        hash:
          type: string
          description: Multihash encoded in multibase base64
        timestampedBy:
          type: string
          description: Address of the transaction signer that timestamped the information.
        blockNumber:
          type: number
          description: Number of the block in which the hash has been timestamped.
        data:
          type: string
          description: Additional timestamp data.
    HashAlgorithm:
      title: Hash algorithm
      type: object
      properties:
        outputLengthBits:
          type: number
          description: Hash algorithm output length in bits. 0 if the output length if variable.
        ianaName:
          type: string
          description: Hash algorithm IANA name.
        oid:
          type: string
          description: Object identifier.
        status:
          type: string
          description: Status of the algorithm (active, revoked).
        multihash:
          type: string
          description: Multihash name
    Policy:
      title: Policy
      description: Policy data model
      type: object
      properties:
        policyId:
          type: string
          description: Unique policy ID
        policy:
          type: string
          description: Base64 encoded policy
        hash:
          type: string
          description: Multihash of the policy, encoded in multibase base16
    JsonRpcResponse:
      title: JSON-RPC Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly "2.0"
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: object
            - type: string
  examples:
    BadRequest:
      value:
        title: Bad request
        status: 400
        detail: Bad request
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
  securitySchemes:
    bearerAuth:
      description: >

      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: http://localhost
    description: Local Computer Environment
  - url: https://api-test.ebsi.eu
    description: EBSI Test Environment
  - url: https://api-pilot.ebsi.eu
    description: EBSI Pilot Environment
  - url: "https://api-conformance.ebsi.eu"
    description: EBSI Conformance Environment
