        - DID Documents
      summary: List identifiers
      description: Returns a list of identifiers.
      operationId: get-did-registry-v3-identifiers
      parameters:
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
          schema:
            type: integer
        - in: query
          name: controller
          description: Filter by controller ID (Ethereum address).
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: Absolute path to the collection (consult)
                  items:
                    type: array
                    description: List of identifiers
                    items:
                      type: object
                      properties:
                        did:
                          type: string
                          description: A unique record id = DID User
                        href:
                          type: string
                          description: Link to the resource
