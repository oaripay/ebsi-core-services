schema {
  query: Query
}

input Schema_filter {
  id: String
  id_not: String
  id_gt: String
  id_lt: String
  id_gte: String
  id_lte: String
  id_in: [String!]
  id_not_in: [String!]
  id_contains: String
  id_not_contains: String
  revisions: [String!]
  revisions_not: [String!]
  revisions_contains: [String!]
  revisions_contains_nocase: [String!]
  revisions_not_contains: [String!]
  revisions_not_contains_nocase: [String!]
  revisions_: Revision_filter
  lastRevision: String
  lastRevision_not: String
  lastRevision_gt: String
  lastRevision_lt: String
  lastRevision_gte: String
  lastRevision_lte: String
  lastRevision_in: [String!]
  lastRevision_not_in: [String!]
  lastRevision_contains: String
  lastRevision_contains_nocase: String
  lastRevision_not_contains: String
  lastRevision_not_contains_nocase: String
  lastRevision_starts_with: String
  lastRevision_starts_with_nocase: String
  lastRevision_not_starts_with: String
  lastRevision_not_starts_with_nocase: String
  lastRevision_ends_with: String
  lastRevision_ends_with_nocase: String
  lastRevision_not_ends_with: String
  lastRevision_not_ends_with_nocase: String
  lastRevision_: Revision_filter
  and: [Schema_filter]
  or: [Schema_filter]
}

input Revision_filter {
  id: String
  id_not: String
  id_gt: String
  id_lt: String
  id_gte: String
  id_lte: String
  id_in: [String!]
  id_not_in: [String!]
  id_contains: String
  id_not_contains: String
  content: String
  content_not: String
  content_gt: String
  content_lt: String
  content_gte: String
  content_lte: String
  content_in: [String!]
  content_not_in: [String!]
  content_contains: String
  content_contains_nocase: String
  content_not_contains: String
  content_not_contains_nocase: String
  content_starts_with: String
  content_starts_with_nocase: String
  content_not_starts_with: String
  content_not_starts_with_nocase: String
  content_ends_with: String
  content_ends_with_nocase: String
  content_not_ends_with: String
  content_not_ends_with_nocase: String
  metadata: [String!]
  metadata_not: [String!]
  metadata_contains: [String!]
  metadata_contains_nocase: [String!]
  metadata_not_contains: [String!]
  metadata_not_contains_nocase: [String!]
  metadata_: Metadata_filter
  and: [Revision_filter]
  or: [Revision_filter]
}

input Metadata_filter {
  id: String
  id_not: String
  id_gt: String
  id_lt: String
  id_gte: String
  id_lte: String
  id_in: [String!]
  id_not_in: [String!]
  id_contains: String
  id_not_contains: String
  content: String
  content_not: String
  content_gt: String
  content_lt: String
  content_gte: String
  content_lte: String
  content_in: [String!]
  content_not_in: [String!]
  content_contains: String
  content_contains_nocase: String
  content_not_contains: String
  content_not_contains_nocase: String
  content_starts_with: String
  content_starts_with_nocase: String
  content_not_starts_with: String
  content_not_starts_with_nocase: String
  content_ends_with: String
  content_ends_with_nocase: String
  content_not_ends_with: String
  content_not_ends_with_nocase: String
  and: [Metadata_filter]
  or: [Metadata_filter]
}

type Schema {
  id: String!
  revisions(
    first: Int = 100
    skip: Int = 0
    where: Revision_filter
  ): [Revision!]!
  lastRevision: Revision!
}

type Revision {
  id: String!
  content: String!
  metadata(
    first: Int = 100
    skip: Int = 0
    where: Metadata_filter
  ): [Metadata!]!
}

type Metadata {
  id: String!
  content: String!
}

type Query {
  schemas(skip: Int = 0, first: Int = 100, where: Schema_filter): [Schema!]!
  schema(id: String!): Schema!
  revisions(
    skip: Int = 0
    first: Int = 100
    where: Revision_filter
  ): [Revision!]!
  revision(id: String!): Revision!
  metadata(id: String!): Metadata!
}
