services:
  besu:
    image: hyperledger/besu:24.7.1
    ports:
      - "48733:48733"
      - "8545:8545"
      - "8546:8546"
      - "9545:9545"
    environment:
      - BESU_P2P_ENABLED=false
      - BESU_REVERT_REASON_ENABLED=true
      - BESU_LOGGING=WARN
      - BESU_METRICS_ENABLED=false
      - BESU_BONSAI_LIMIT_TRIE_LOGS_ENABLED=false
      - BESU_DATA_STORAGE_FORMAT=FOREST
      - BESU_OPTS=-Xmx8g
      - BESU_RPC_HTTP_MAX_ACTIVE_CONNECTIONS=500
      - BESU_RPC_WS_MAX_ACTIVE_CONNECTIONS=500
      - BESU_TARGET_GAS_LIMIT=10000000000
      - BESU_TX_POOL=sequenced
      - BESU_TX_POOL_LIMIT_BY_ACCOUNT_PERCENTAGE=1
      - BESU_TX_POOL_NO_LOCAL_PRIORITY=true
      - BESU_TX_POOL_MAX_SIZE=10000
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/besu/bin/besu \
        --miner-enabled \
        --miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73 \
        --rpc-http-cors-origins="all" \
        --host-allowlist="*" \
        --rpc-ws-enabled \
        --rpc-http-enabled \
        --network=dev ;
    healthcheck:
      test: "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/8545; exit $?;'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Deploy contracts (TODO) at specific addresses
  # contracts-deployer:

  # Start The Graph
  graph-node:
    image: graphprotocol/graph-node:v0.35.0
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8020:8020"
      - "8030:8030"
      - "8040:8040"
    depends_on:
      ipfs:
        condition: service_started
      postgres:
        condition: service_started
      besu:
        condition: service_healthy
      # - contracts-deployer (rather than "besu")
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      ethereum: "besu:http://besu:8545"
      GRAPH_LOG: info
    healthcheck:
      test: "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/8020; exit $?;'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  ipfs:
    image: ipfs/kubo:v0.17.0
    ports:
      - "5001:5001"
    volumes:
      - ./data/ipfs:/data/ipfs:Z
  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    command:
      [
        "postgres",
        "-cshared_preload_libraries=pg_stat_statements",
        "-cmax_connections=200",
      ]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:Z

  # Deploy subgraphs
  subgraphs-deployer:
    image: ebsi/subgraphs-deployer:${GIT_COMMIT}
    depends_on:
      graph-node:
        condition: service_healthy
    environment:
      - IPFS_URL=http://ipfs:5001
      - NODE_URL=http://graph-node:8020
      - DIDR_SC_V3_ADDRESS=0x26E603f6FdCfC007c7bdC5be5f2c91D2a64a32E7
      - DIDR_SC_V3_START_BLOCK=8283108
      - DIDR_SC_V4_ADDRESS=0xb44e3f0e2A049EBEd8fB5a28524D2164796a9963
      - DIDR_SC_V4_START_BLOCK=10500079
      - TPR_SC_V2_ADDRESS=0x3d5edA0b5183e245bA9713B58834525EDfE46E90
      - TPR_SC_V2_START_BLOCK=8282062
      - TPR_SC_V3_ADDRESS=0x61b6AD18C74C2158445F524E9f868Da13Aba8E2F
      - TPR_SC_V3_START_BLOCK=11498790
      - TSR_SC_V2_ADDRESS=0x3B3B6Faa80f88aD7Da4ff1451aE716Bf6f741700
      - TSR_SC_V2_START_BLOCK=8290972
      - TSR_SC_V3_ADDRESS=0xD4fB4CE89FaD3F3576A432Db7b90106E3fAc7b99
      - TSR_SC_V3_START_BLOCK=11641312
      - TIR_SC_V4_ADDRESS=0x4962b4Dbe26EfC3c313677C47a756205C7464C5b
      - TIR_SC_V4_START_BLOCK=11731044
      - TIMESTAMP_SC_V2_ADDRESS=0xCb9e9F0229f1492A22801B176196eCb158eb24B0
      - TIMESTAMP_SC_V2_START_BLOCK=8291049
      - TIMESTAMP_SC_V3_ADDRESS=0x2bE4E55C24Cdd8FcDe002163f5E681AC9B610af5
      - TIMESTAMP_SC_V3_START_BLOCK=12045488
      - TNT_SC_V1_ADDRESS=0x5D4ee65803447c3E5A79BCd045FE4b6Bd068dFF7
      - TNT_SC_V1_START_BLOCK=10433488
      - TNT_SC_V2_ADDRESS=0x7F6B0a09196Af25703e05D62A92423D46Fdd8a01
      - TNT_SC_V2_START_BLOCK=12239434

  # Start APIs
  authorisation-api-v5:
    image: ebsi/authorisation-api-v5:${GIT_COMMIT}
    environment:
      NETWORK: test
      DOMAIN: https://api-test.ebsi.eu
      API_ES256_PRIVATE_KEY: "736f625c9dda78a94bb16840c82779bb7bc18014b8ede52f0f03429902fc4ba8"
      AUTHORISATION_CREDENTIAL_SCHEMA: z3MgUFUkb722uq4x3dv5yAJmnNmzDFeK5UC8x83QoeLJM
  ledger-api-v4:
    image: ebsi/ledger-api-v4:${GIT_COMMIT}
    # ports:
    #  - "3000:3000"
    environment:
      BESU_RPC_NODE: http://besu:8545
      BESU_READINESS_ENDPOINT: http://besu:8545/readiness
      DOMAIN: https://api-test.ebsi.eu
    depends_on:
      besu:
        condition: service_healthy
  did-registry-api-v6:
    image: ebsi/did-registry-api-v6:${GIT_COMMIT}
    ports:
      - "3000:3000"
    environment:
      NETWORK: test
      DOMAIN: https://api-test.ebsi.eu
      GRAPHQL_ENDPOINT: http://graph-node:8000/subgraphs/name/ebsi/did-registry-v4
      CONTRACT_ADDR: "0xb44e3f0e2A049EBEd8fB5a28524D2164796a9963"
      BESU_RPC_NODE: http://besu:8545
      BESU_READINESS_ENDPOINT: http://besu:8545/readiness
    depends_on:
      besu:
        condition: service_healthy
      graph-node:
        condition: service_healthy
      subgraphs-deployer:
        condition: service_completed_successfully
  did-registry-api-v6-jsonrpc:
    image: ebsi/did-registry-api-v6-jsonrpc:${GIT_COMMIT}
    ports:
      - "3000:3000"
    environment:
      NETWORK: test
      DOMAIN: https://api-test.ebsi.eu
      GRAPHQL_ENDPOINT: http://graph-node:8000/subgraphs/name/ebsi/did-registry-v4
      CONTRACT_ADDR: "0xb44e3f0e2A049EBEd8fB5a28524D2164796a9963"
      BESU_RPC_NODE: http://besu:8545
      BESU_READINESS_ENDPOINT: http://besu:8545/readiness
    depends_on:
      besu:
        condition: service_healthy
      graph-node:
        condition: service_healthy
      subgraphs-deployer:
        condition: service_completed_successfully
  timestamp-api-v5:
    image: ebsi/timestamp-api-v5:${GIT_COMMIT}
    # ports:
    #   - "3000:3000"
    environment:
      NETWORK: test
      DOMAIN: https://api-test.ebsi.eu
      GRAPHQL_ENDPOINT: http://graph-node:8000/subgraphs/name/ebsi/timestamp-v3
      CONTRACT_ADDR: "0x2bE4E55C24Cdd8FcDe002163f5E681AC9B610af5"
      BESU_RPC_NODE: http://besu:8545
      BESU_READINESS_ENDPOINT: http://besu:8545/readiness
    depends_on:
      besu:
        condition: service_healthy
      graph-node:
        condition: service_healthy
      subgraphs-deployer:
        condition: service_completed_successfully

  # Reverse proxy to expose all the services
