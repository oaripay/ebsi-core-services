  /did-registry/v2/jsonrpc:
    post:
      operationId: post-did-registry-v2-jsonrpc
      tags:
        - DID Registry
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions and interaction with
        the ledger (Write operation on ledger).
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method to be invoked. Possible values: 'insertAdministrator',
            'updateAdministrator', 'insertPolicy', 'updatePolicy', 'insertHashAlgorithm',
            'updateHashAlgorithm', 'insertDidDocument', 'updateDidDocument', 'insertDidController',
            'updateDidController', 'revokeDidController', 'insertDidMethod'
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              Build tx to insertAdministrator:
                value:
                  jsonrpc: "2.0"
                  method: insertAdministrator
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: "did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4"
                      attributeData: "0x68946e6565d6516..."
              Build tx to updateAdministrator (new attribute):
                value:
                  jsonrpc: "2.0"
                  method: updateAdministrator
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4
                      attributeData: "0x68946e6565d6516..."
                  id: 1
              Build tx to updateAdministrator (update attribute):
                value:
                  jsonrpc: "2.0"
                  method: updateAdministrator
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4
                      attributeData: "0x68946e6565d6516..."
                      prevAttributeHash: "0x9045517cc555c75cd7085900a900e6693439086f9eddeee513271fba278964fe"
                  id: 1
              Build tx to insertPolicy:
                value:
                  jsonrpc: "2.0"
                  method: insertPolicy
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: test-policy-1
                      policyData: "0x1234567890..."
                  id: 1
              Build tx to updatePolicy:
                value:
                  jsonrpc: "2.0"
                  method: updatePolicy
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: test-policy-1
                      policyData: "0x1234567890..."
                  id: 1
              Build tx to insertHashAlgorithm:
                value:
                  jsonrpc: "2.0"
                  method: insertHashAlgorithm
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      outputLength: 256
                      ianaName: sha-256
                      oid: "2.16.840.1.101.3.4.2.1"
                      status: 1
                  id: 1
              Build tx to updateHashAlgorithm:
                value:
                  jsonrpc: "2.0"
                  method: updateHashAlgorithm
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      hashAlgorithmId: 3
                      outputLength: 256
                      ianaName: sha-256
                      oid: "2.16.840.1.101.3.4.2.1"
                      status: 2
                  id: 1
              Build tx to insertDidDocument:
                value:
                  jsonrpc: "2.0"
                  method: insertDidDocument
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      identifier: "0x6469643a656273693a4561546b484846564836376e4e7a356835446f715a793979707473674873797968676d6461446a676639696f"
                      hashAlgorithmId: 0
                      hashValue: "0x7d0c51062b554b5c7e2f1fc087cc657d28b7164065813b0ae5ffc1e231e85949"
                      didVersionInfo: ""
                      timestampData: "0x7b2264617461223a2274657374227d"
                      didVersionMetadata: "0x7b226d65746164617461223a2276616c7565227d"
                  id: 1
              Build tx to updateDidDocument:
                value:
                  jsonrpc: "2.0"
                  method: updateDidDocument
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      identifier: "0x6469643a656273693a4561546b484846564836376e4e7a356835446f715a793979707473674873797968676d6461446a676639696f"
                      hashAlgorithmId: 0
                      hashValue: "0x7d0c51062b554b5c7e2f1fc087cc657d28b7164065813b0ae5ffc1e231e85949"
                      didVersionInfo: ""
                      timestampData: "0x7b2264617461223a2274657374227d"
                      didVersionMetadata: "0x7b226d65746164617461223a2276616c7565227d"
                  id: 1
              Build tx to insertDidController:
                value:
                  jsonrpc: "2.0"
                  method: insertDidController
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      identifier: "0x6469643a656273693a3577393450627848715376537270387658716e78675847356b71503776483757567374417841535163674e74"
                      newControllerId: "0x039323cb774B8E12Dfa685BAf82aa50394E074e5"
