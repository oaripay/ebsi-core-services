              value: "0x7623198d13d51cc485e4ec6bd52af05f6b691c1d9dd06a4b3f609d9c19efb985"
          required: true
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    description: Unique app ID
                  publicKey:
                    type: string
