components:
  schemas:
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      x-examples:
        Not Enough Credit:
          type: "https://example.com/probs/out-of-credit"
          title: You do not have enough credit.
          detail: "Your current balance is 30, but that costs 50."
          instance: /account/12345/msgs/abc
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: "about:blank"
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    JsonRpcResponse:
      title: Json Rpc Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly '2.0'
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: object
            - type: string
    HashAlgorithm:
      title: Hash algorithm
      type: object
      properties:
        outputLengthBits:
          type: number
          description: Hash algorithm output length in bits. 0 if the output length if variable.
        ianaName:
          type: string
          description: Hash algorithm IANA name.
        oid:
          type: string
          description: Object identifier.
        status:
          type: string
          description: Status of the algorithm (active, revoked).
    Record:
      title: Record
      type: object
      properties:
        ownerIds:
          description: A list of record owners/controllers
          type: array
          items:
            type: string
        revokedOnwerIds:
          description: A list of revoked owners/controllers
          type: array
          items:
            type: string
        firstVersionTimestamps:
          description: A list of the first version timestamps
          type: array
          items:
            type: string
        lastVersionTimestamps:
          description: A list of the last version timestamps
          type: array
          items:
            type: string
        totalVersions:
          description: A total number of versions
          type: number
    Version:
      title: Version
      type: object
      properties:
        hashes:
          type: array
          items:
            type: string
          description: A list of timestamped version hashes
        info:
          type: array
          items:
            type: object
          description: A list of info objects (should be JSON-LD)
    Timestamp:
      title: Timestamp information
      type: object
      properties:
        hash:
          description: Timestamped hash (multi-hash, base64 multi-encoded)
          type: string
        timestampedBy:
          description: Address of the transaction signer that timestamped the information.
          type: string
        blockNumber:
          description: Number of the block in which the hash has been timestamped.
          type: integer
        transactionHash:
          description: Hash of the transaction/transaction id.
          type: string
        data:
          description: Additional timestamp data (bytes, serialized JSON-LD)
          type: string
    Links:
      title: Links
      type: object
      properties:
        last:
          type: string
          description: URI of the last page
        prev:
          type: string
          description: URI of the previous page
        next:
          type: string
          description: URI of the next page
        first:
          type: string
          description: URI of the first page
      description: links model used for pagination
      x-examples:
        Links:
          first: https://api.test.ebsi.xyz/timestamp/v2/hash-algorithms?page[after]=1&page[size]=2
          prev: https://api.test.ebsi.xyz/timestamp/v2/hash-algorithms?page[after]=2&page[size]=2
          next: https://api.test.ebsi.xyz/timestamp/v2/hash-algorithms?page[after]=4&page[size]=2
          last: https://api.test.ebsi.xyz/timestamp/v2/hash-algorithms?page[after]=13&page[size]=2
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
tags:
  - name: Timestamp API
    description: Validate timestamped records
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.test.ebsi.xyz"
    description: EBSI Testing Environment
