openapi: 3.0.3
info:
  title: Users Onboarding API
  version: 1.0.0
  description: |
    Users Onboarding API is an EBSI core service to enable users (Natural
    Persons and Legal Entities) to obtain long-term access to the EBSI
    pre-production network.

    For more information see:

    * [Technical Specifications](https://ec.europa.eu/cefdigital/wiki/display/EBSIDOC/Users+Onboarding+API)
    * [Code repository](https://ec.europa.eu/cefdigital/code/projects/EBSI/repos/users-onboarding-api/browse?at=refs%2Fheads%2Fdevelop)
  termsOfService: /docs/terms
  contact:
    name: EBSI Support – Service Desk
    url: https://ec.europa.eu/cefdigital/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
paths:
  /users-onboarding/v1/sessions:
    post:
      tags:
        - Users Onboarding API
      summary: Sessions
      description: The endpoint validates the EU Login/reCAPTCHA response and returns a session token.
      operationId: post-users-onboarding-api-sessions
      requestBody:
        required: true
        description: |
          It requires to provide either the EULogin or reCAPTCHA response.
        content:
          application/json:
            schema:
              type: object
              properties:
                onboarding:
                  description: Either eu-login or reCAPTCHA.
                  type: string
                info:
                  description: Additional onboarding information
                  type: object
            examples:
              EULogin:
                value:
                  onboarding: eu-login
                  info:
                    eul-ticket: EU Login ticket number
              reCAPTCHA:
                value:
                  onboarding: recaptcha
                  info:
                    token: 03AGdBq24EL3Pvtf6wNbAoBHFbrgYCbFQrAtOUTN80C_OTgo5UmdYXXbQwEBzWXpZdHvV18kqy2X3ZO5MjYI7-48aEuzaUSi0d4cyssNOrEDhnQ6Fwkw_nPCsOvqn66_8KSjWAFJWcVSDZYiEa3N8cAuPtisha65ypOSQZGTQO8OtvmX3ots3_3Lg0RYE0FR8nmSHvprBzepB_bNRgIkzFyMQLrWCwT1DIxNlG26fbsYqgHTlqc5_XmLovWoUldx_gptqfsqVw5OhCsf4T_sMSESS6FmNYf_5wW_LLdvtTNcTuENfKFzpJWgTNCrUo7jyBKLJQiuo6d6D0mwO3oWx9JJ2h6cGSRqtMukW5kdO_0kuZ2O7mFKkMo_Godnhf3iHTcNqfIHKvd7hoUbb21SOiLNv4gdQ2v0WyhnZGbPPgGaltpTV5UgboUrCAxhwCsQecjKhW10WAzBaw
      responses:
        201:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  Bearer:
                    type: string
                    description: Session token
              examples:
                Success:
                  value:
                    Bearer: eyJhbGciOiJFUzI1NiIsImN0eSI6IkpXVCIsImtpZCI6IiIsInR5cCI6IkpXVCJ9.eyJhdEhhc2giOiI4Rlo1YzdROTlWaldETU14Nis4WUt2dTVVTVNuQWpwdWFzSDg1L1JUb3M0PSIsImV4cCI6MTYxNjU3NjEyMCwiaWF0IjoxNjE2NTc2MDAwLCJpc3MiOiJVc2VycyBPbmJvYXJkaW5nIEFQSSIsIm5vbmNlIjoiMDRhYjEzNzUtMGU1MS00YjUyLWE4NTUtM2UxYmY3NWJkOTViIiwic3ViIjoiVXNlcnMgT25ib2FyZGluZyBBUEkifQ.BWfmeyyyN-4CruvkBYOQahsWH5TZEpFn8FU1BY6iazVuxpz2QccN6KEOhIzTDV_cy-lKb64vDO2YjAzcMfJfaw
        400:
          $ref: "#/components/responses/400"
        404:
          $ref: "#/components/responses/404"
        500:
          $ref: "#/components/responses/500"
  /users-onboarding/v1/authentication-requests:
    post:
      tags:
        - Users Onboarding API
      summary: Authentication requests
      description: The user performs a request to this endpoint to start did siop by requesting the creation of the request. The endpoint returns a SIOP DID authentication request.
      operationId: post-users-onboarding-api-authentication-requests
      parameters:
        - $ref: "#/components/parameters/headerConformance"
      requestBody:
        required: true
        description: |
          It requires the following field to be set as:
          - **scope**: ebsi users onboarding
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  description: scope of did siop
                  type: string
            examples:
              "[conformance] ct_v1_onboard_01a":
                summary: Request Verifiable Authorisation (CT v1 - ONBOARD_01a)
                description: |
                  This is test data for the [EBSI Conformance Test V1](https://ec.europa.eu/cefdigital/wiki/x/5YDwG) [ONBOARD_01a](https://ec.europa.eu/cefdigital/wiki/display/BLOCKCHAININT/RFC+-+Conformance+testing#RFCConformancetesting-Scenario:ONBOARD).
                  Successful response (HTTP 201) means that the service (wallet) can request a Verifiable Authorisation according to the [specifications]().
                value:
                  scope: ebsi users onboarding
              request:
                summary: Request Verifiable Authorisation
                value:
                  scope: ebsi users onboarding
      responses:
        201:
          description: Success - The service (wallet) can request a Verifiable Authorisation
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token:
                    type: string
                    description: authentication request result
              examples:
                Success:
                  value:
                    session_token: "openid://?response_type=id_token&client_id=https%3A%2F%2Fapi.ebsi.zyz%2Faccess-tokens&scope=openid%20did_authn&request=eyJhbGciOiJIUzI1Ni..."
        400:
          $ref: "#/components/responses/400"
        404:
          $ref: "#/components/responses/404"
        500:
          $ref: "#/components/responses/500"
  /users-onboarding/v1/authentication-responses:
    post:
      tags:
        - Users Onboarding API
      summary: Authentication responses
      description: The user performs a request to this endpoint so as the user onboarding api accept his/her authentication response, validates it and returns a Verifiable Authorisation.
      operationId: post-users-onboarding-api-authentication-responses
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/headerConformance"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: DID Authentication ID Token
              type: object
              required:
                - id_token
              properties:
                id_token:
                  description: did auth id token created by the user candidate to be validated. Notice that this value holds more than the JWT but also parameters like state.
                  type: string
            examples:
              "[conformance] ct_v1_onboard_02":
                summary: Request Verifiable Authorisation (CT v1 - ONBOARD_02)
                description: |
                  This is test data for the [EBSI Conformance Test
                  V1](https://ec.europa.eu/cefdigital/wiki/x/5YDwG)
                  [ONBOARD_02](https://ec.europa.eu/cefdigital/wiki/display/BLOCKCHAININT/RFC+-+Conformance+testing#RFCConformancetesting-Scenario:ONBOARD).
                  Successful response (HTTP 201) means that the service (wallet)
                  can:
                  - Create an [EBSI-compliant DID]()
                  - Can create a DID controlling key supported by EBSI
                  - Can prove a posession of a DID controlling key as defined in the [specifications]()
                value:
                  id_token: eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QiLCJraWQiOiJodHRwczovL2FwaS50ZXN0LmludGVic2kueHl6L3RydXN0ZWQtYXBwcy1yZWdpc3RyeS92Mi9hcHBzLzB4MTlkMDA0ZTdmNmVjZjI2NDUyM2UxMzY5MjRjYjY4Nzk2Y2E5ZGJmYTI1YmNhMDUzYjJmNmFmMGZjNmZkZDg4YyJ9..63o7hoAL-5CeXIXAZBrt0HE0Qc_Yi8WNwSkZAovOOJO-tVTrTFYKCtDdtQZEy7rnCA9g2P5wrq013P_KO8Jpmg&state=af0ifjsldkj
              request:
                summary: Request Verifiable Authorisation
                value:
                  id_token: eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QiLCJraWQiOiJodHRwczovL2FwaS50ZXN0LmludGVic2kueHl6L3RydXN0ZWQtYXBwcy1yZWdpc3RyeS92Mi9hcHBzLzB4MTlkMDA0ZTdmNmVjZjI2NDUyM2UxMzY5MjRjYjY4Nzk2Y2E5ZGJmYTI1YmNhMDUzYjJmNmFmMGZjNmZkZDg4YyJ9..63o7hoAL-5CeXIXAZBrt0HE0Qc_Yi8WNwSkZAovOOJO-tVTrTFYKCtDdtQZEy7rnCA9g2P5wrq013P_KO8Jpmg&state=af0ifjsldkj
          application/x-www-form-urlencoded:
            schema:
              title: DID Auth id_token
              type: object
              required:
                - id_token
              properties:
                id_token:
                  description: DID authentication ID Token.
                  type: string
            example:
              id_token: eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QiLCJraWQiOiJodHRwczovL2FwaS50ZXN0LmludGVic2kueHl6L3RydXN0ZWQtYXBwcy1yZWdpc3RyeS92Mi9hcHBzLzB4MTlkMDA0ZTdmNmVjZjI2NDUyM2UxMzY5MjRjYjY4Nzk2Y2E5ZGJmYTI1YmNhMDUzYjJmNmFmMGZjNmZkZDg4YyJ9..63o7hoAL-5CeXIXAZBrt0HE0Qc_Yi8WNwSkZAovOOJO-tVTrTFYKCtDdtQZEy7rnCA9g2P5wrq013P_KO8Jpmg&state=af0ifjsldkj
      responses:
        201:
          description: Success - The service (wallet) can prove DID key possession.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verifiableCredential:
                    type: object
                    description: This field contains the Verifiable Credential requested, i.e. the Verifiable Authorisation
              examples:
                Success:
                  value:
                    verifiableCredential:
                      credentialSubject:
                        id: "did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ"
                        issuer:
                          id: "did:ebsi:zwC56DZdiJh8kSxbgg4fMCu"
                        issuanceDate: "2021-04-26T15:55:02Z"
                        "@context":
                          - "https://www.w3.org/2018/credentials/v1"
                        type: VerifiableCredential
                        proof:
                          type: EcdsaSecp256k1Signature2019
                          created: "2021-04-26T15:55:02Z"
                          proofPurpose: assertionMethod
                          verificationMethod: "did:ebsi:zwC56DZdiJh8kSxbgg4fMCu#keys-1"
                          jws: 351Oed421iLbLLJjINWF_EAXN6EaBk1AJUqbpHqpv7TZOA7PnCmgyurvPVvjjmw
        400:
          $ref: "#/components/responses/400"
        404:
          $ref: "#/components/responses/404"
        500:
          $ref: "#/components/responses/500"
components:
  schemas:
    problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem. It may or may
            not yield further information if dereferenced.
  responses:
    400:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/problem"
          examples:
            Bad Request:
              $ref: "#/components/examples/BadRequest"
    404:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/problem"
          examples:
            Not Found:
              $ref: "#/components/examples/NotFound"
    500:
      description: Internal Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/problem"
          examples:
            Internal Server Error:
              $ref: "#/components/examples/InternalError"
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
    NotFound:
      value:
        title: Not Found
        status: 404
        detail: Not found
    InternalError:
      value:
        title: Internal Server Error
        status: 500
        detail: The server encountered an internal error and was unable to process your request.
  parameters:
    headerConformance:
      in: header
      name: Conformance
      description: |
        Conformance test UUID. UUID V4 should be used. The header is
        required when running the conformance tests to log the activities.
      required: false
      schema:
        type: string
        format: uuid
      example: edb60e02-398d-4b62-8028-85710b2476a5
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.preprod.ebsi.eu"
    description: EBSI Pre-production Environment
  - url: "https://api.ebsi.eu"
    description: EBSI Production Environment
