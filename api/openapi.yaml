  /trusted-ledgers-smart-contracts-registry/v1/jsonrpc:
    post:
      operationId: post-trusted-ledgers-smart-contracts-registry-v2-jsonrpc
      tags:
        - Trusted Ledgers & Smart Contracts Registry API
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions and interaction with
        the ledger (Write operation on ledger).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method to be invoked. Possible values: 'insertLedgerInfo',
          'updateLedgerInfoById', 'insertSmartContractInfo', 'updateSmartContractInfoById',
          'updateSmartContractInfoByName', 'updateSmartContractName', 'sendSignedTransaction'
          - **params**: Array of parameters
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              Build tx to insertLedgerInfo:
                description: |
                  Call to build an unsigned transaction to insert ledger info in the registry. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **name**: Name for the new ledger
                  - **info**: Data information. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: insertLedgerInfo
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      name: EBSI Ethereum
                      info: "0x7b226e616d65223a224542534920657468657265756d227d"
              Build tx to updateLedgerInfoById:
                description: |
                  Call to build an unsigned transaction to update a ledger info in the registry given its ID. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **ledgerInfoId**: Ledger Info ID
                  - **info**: Data information. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateLedgerInfoById
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      ledgerInfoId: "0x94df19c1c654f4bca27545c2ab06647bb96356c4b771a6af0aa54b7bb8f6ffb7"
                      info: "0x7b226e616d65223a224542534920657468657265756d227d"
              Build tx to updateLedgerInfoByName:
                description: |
                  Call to build an unsigned transaction to update a ledger info in the registry given its name. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **name**: Name of the ledger
                  - **info**: Data information. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateLedgerInfoByName
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      name: EBSI Ethereum
                      info: "0x7b226e616d65223a224542534920657468657265756d227d"
              Build tx to updateLedgerName:
                description: |
                  Call to build an unsigned transaction to update the name of a ledger. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **oldName**: Previous name
                  - **newName**: New name
                value:
                  jsonrpc: "2.0"
                  method: updateLedgerName
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      oldName: EBSI Ethereum
                      newName: EBSI Ethereum 2
              Build tx to insertSmartContractInfo:
                description: |
                  Call to build an unsigned transaction to insert smart contract info in the registry. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **name**: Name for the new smart contract
                  - **info**: Data information. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: insertSmartContractInfo
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      name: Trusted Issuers Registry Smart Contract
                      info: "0x7b226e616d65223a226d7920636f6e7472616374227d"
              Build tx to updateSmartContractInfoById:
                description: |
                  Call to build an unsigned transaction to update a smart contract info in the registry given its ID. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **smartContractInfoId**: Smart Contract Info ID
                  - **info**: Data information. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateSmartContractInfoById
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      smartContractInfoId: "0x94df19c1c654f4bca27545c2ab06647bb96356c4b771a6af0aa54b7bb8f6ffb7"
                      info: "0x7b226e616d65223a226d7920636f6e7472616374227d"
              Build tx to updateSmartContractInfoByName:
                description: |
                  Call to build an unsigned transaction to update a smart contract info in the registry given its name. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **name**: Name of the smart contract
                  - **info**: Data information. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateSmartContractInfoByName
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      name: EBSI Ethereum
                      info: "0x7b226e616d65223a226d7920636f6e7472616374227d"
              Build tx to updateSmartContractName:
                description: |
                  Call to build an unsigned transaction to update the name of a smart contract. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **oldName**: Previous name
                  - **newName**: New name
                value:
                  jsonrpc: "2.0"
                  method: updateSmartContractName
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      oldName: timesmp-sc-ethereum
                      newName: timestamp-sc-ethereum
              Send Transaction:
                description: Call to send a signed transaction to the blockchain.
                value:
                  jsonrpc: "2.0"
                  method: sendSignedTransaction
                  id: 1
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
                      s: "0x..."
                      v: "0x..."
                      signedRawTransaction: "--- signed raw transaction ---"
              Send Transaction (DEPRECATED):
                description: |
                  THIS METHOD IS DEPRECATED! Use "sendSignedTransaction" instead.
                  Call to send a signed transaction to the blockchain.
                value:
                  jsonrpc: "2.0"
                  method: signedTransaction
                  id: 1
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
                      s: "0x..."
                      v: "0x..."
                      signedRawTransaction: "--- signed raw transaction ---"
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
              examples:
                Build tx:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                      data: "0x0000..."
                      nonce: "0x00"
                      chainId: "0x1b3b"
                      gasLimit: "0x10000"
                      gasPrice: "0x00"
                      value: "0x00"
                Send Transaction:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: "0xe670ec64341771606e55d6b4ca35a1a6b75ee3d5145a99d05921026d1527331"
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
components:
  schemas:
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      x-examples:
        Not Enough Credit:
          type: https://example.com/probs/out-of-credit
          title: You do not have enough credit.
          detail: Your current balance is 30, but that costs 50.
          instance: /account/12345/msgs/abc
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    Links:
      title: Links
      type: object
      description: Links model used for pagination.
      properties:
        first:
          type: string
          description: Hyperlink to the first page.
        prev:
          type: string
          description: Hyperlink to the previous page.
        next:
          type: string
          description: Hyperlink to the next page.
        last:
          type: string
          description: Hyperlink to the last page.
    JsonRpcResponse:
      title: Json Rpc Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly '2.0'
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: object
            - type: string
    LedgerInfoLinks:
      title: Ledger information links
      description: Links to ledger information as returned by the REST APIs.
      type: object
      properties:
        ledgerInfoId:
          type: string
          description: Hexadecimal Ledger Info ID.
        href:
          type: string
          description: URL to the LedgerInfo resource.
    SmartContractInfoLinks:
      title: Smart contract information links
      description: Links to smart contract information as returned by the REST APIs.
      type: object
      properties:
        smartContractInfoId:
          type: string
          description: Hexadecimal smart contract info ID.
        href:
          type: string
          description: URL to the SmartContractInfo resource.
    RevisionLinks:
      title: Ledger information or smart contract information revision links
      description: Links to revisions as returned by the REST APIs.
