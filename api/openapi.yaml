openapi: 3.0.3
info:
  title: Ledger API
  version: 2.0.0
  description: |
    Ledger API service gives use case applications access to all the
    available blockchain protocol interfaces and capabilities provided by the
    ledger nodes software running on MS hosted nodes.

    The Ledger API is a Core Service of the EBSI platform providing access to
    the EBSI Ledger Protocol(s) and Smart Contracts services running at the
    lower layer Chain & Storage.

    EBSI V2 Ledger API provides capabilities to interact (Read and Write)
    with Hyperledger Besu and (Read-Only) for Fabric ledgers. As a remark,
    for EBSI v2.0, in order to interact with the Fabric node clients,
    consumers must install the Fabric SDK kit because Fabric ledgers has not
    a full feature set natively exposed by a REST API. Only a limited set of
    features are exposed.

    As a general principle, only EBSI Core Service API, acting as JSON-RPC
    proxy for the end-users can have access to the Ledger API JSON RPC Proxy,
    meaning end-users have no direct access to the EBSI Ledgers clients
    software running on MS nodes.

    For more information see:

    - [Technical Specifications](https://ec.europa.eu/cefdigital/wiki/display/EBSIDOC/Ledger+API)
    - [Code Repository](https://ec.europa.eu/cefdigital/code/projects/EBSI/repos/ledger-api/browse)
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
  contact:
    name: EBSI Support – Service Desk
    url: https://ec.europa.eu/cefdigital/tracker/plugins/servlet/desk/portal/11
  termsOfService: /docs/terms
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.preprod.ebsi.eu"
    description: EBSI Pre-production Environment
  - url: "https://api.ebsi.eu"
    description: EBSI Production Environment
tags:
  - name: Hyperledger Besu Ethereum Enterprise Client
    description: Interact with the Ethereum Enterprise Client RPC APIs
  - name: Hyperledger Fabric
    description: Interact with the Hyperledger Fabric REST API
paths:
  /ledger/v2/blockchains/besu:
    post:
      operationId: post-ledger-v2-blockchains-besu
      tags:
        - Hyperledger Besu Ethereum Enterprise Client
      summary: Hyperledger Besu RPC API
      description: |
        Hyperledger Besu Ethereum Enterprise Client JSON-RPC APIs.
        Read methods are public, write methods require authorisation and authentication
        via the Authorisation API. Only authorised Trusted Applications can access the write methods.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).
          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Hyperledger Besu RPC native method that is invoked. The
          list of available methods can be found in the Ledger API technical specifications
          [List of JSON RPC methods](https://ec.europa.eu/cefdigital/wiki/x/V4iWFQ).
          - **params**: Array of parameters.
          - **id**: Identifier established by the client.
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Besu RPC native method to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    oneOf:
                      - type: boolean
                      - type: object
                      - type: string
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              Get Block:
                value:
                  jsonrpc: "2.0"
                  method: eth_getBlockByNumber
                  params:
                    - "123456"
                    - true
                  id: 1
              Get Transaction:
                value:
                  jsonrpc: "2.0"
                  method: eth_getTransactionByHash
                  params:
                    - "0x88df016429689c079f3b2f6ad39fa052532c56795b733da78a91ebe6a713944b"
                  id: 1
              Send Transaction:
                value:
                  jsonrpc: "2.0"
                  method: eth_sendRawTransaction
                  params:
                    - "---signed raw transation---"
                  id: 1
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BesuResponse"
              examples:
                Get Block:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      number: "0x1e240"
                      hash: "0x266bd6a41047c0929ebedd56cae148caab0d20a23aa1895bb95524a300ef9187"
                      parentHash: "0x705094eb8ca67929254bedaff973d254311d72a38dc2b95a8711682f034fd3b4"
                      nonce: "0x0000000000000000"
                      sha3Uncles: "0x1dcc4de8dec75d7aab85b567b6ccd41ad312451b948a7413f0a142fd40d49347"
                      logsBloom: ""
                      transactionsRoot: "0x56e81f171bcc55a6ff8345e692c0f86e5b48e01b996cadc001622fb5e363b421"
                      stateRoot: "0x4b7559720ae8af08782bcadc07c94243ceaf5fe1d7ee0914d76ad37969791dc4"
                      receiptsRoot: "0x56e81f171bcc55a6ff8345e692c0f86e5b48e01b996cadc001622fb5e363b421"
                      miner: "0x7df7b640d9c4c24f563a7d5702499521255fc165"
                      difficulty: "0x1"
                      totalDifficulty: "0x1e241"
                      extraData: ""
                      size: "0x350"
                      gasLimit: "0x1fffffffffffff"
                      gasUsed: "0x0"
                      timestamp: "0x5e7b16f4"
                      uncles: []
                      transactions: []
                Get Transaction:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      blockHash: "0x1d59ff54b1eb26b013ce3cb5fc9dab3705b415a67127a003c3e61eb445bb8df2"
                      blockNumber: "0x5daf3b"
                      from: "0xa7d9ddbe1f17865597fbd27ec712455208b6b76d"
                      gas: "0xc350"
                      gasPrice: "0x0"
                      hash: "0x88df016429689c079f3b2f6ad39fa052532c56795b733da78a91ebe6a713944b"
                      input: "0x68656c6c6f21"
                      nonce: "0x15"
                      to: "0xf02c1c8e6114b1dbe8937a39260b5b0a374432bb"
                      transactionIndex: "0x41"
                      value: "0xf3dbb76162000"
                      v: "0x25"
                      r: "0x1b5e176d927f8e9ab405058b2d2457392da3e20f328b16ddabcebc33eaac5fea"
                      s: "0x4ba69724e8f69de52f0125ad8b3c5c2cef33019bac3249e2c0a2192766d1721c"
                Send Transaction:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: "0xe670ec64341771606e55d6b4ca35a1a6b75ee3d5145a99d05921026d1527331"
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
                Invalid Token:
                  $ref: "#/components/examples/InvalidToken"
                Method Disabled:
                  $ref: "#/components/examples/MethodDisabled"
                Invalid Method:
                  $ref: "#/components/examples/MethodNoExists"
        401:
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/NoAnonymous"
        403:
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Forbidden:
                  $ref: "#/components/examples/BesuPermissions"
                Deployment Forbidden:
                  $ref: "#/components/examples/NoDeploySC"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BesuResponse:
      title: Hyperledger Besu Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly '2.0'
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: array
            - type: boolean
            - type: object
            - type: string
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      x-examples:
        Not Enough Credit:
          type: https://example.com/probs/out-of-credit
          title: You do not have enough credit.
          detail: Your current balance is 30, but that costs 50.
          instance: /account/12345/msgs/abc
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
  examples:
    BesuPermissions:
      value:
        title: Forbidden
        status: 403
        detail: The method 'eth_sendRawTransaction' needs besu permissions
    NoDeploySC:
      value:
        title: Forbidden
        status: 403
        detail: Deployment of new smart contracts is not allowed
    NoAnonymous:
      value:
        title: Unauthorized
        status: 401
        detail: The method 'eth_sendRawTransaction' is not available for anonymous access
    MethodDisabled:
      value:
        title: Bad Request
        status: 400
        detail: The method 'eth_compileSolidity' is currently disabled
    MethodNoExists:
      value:
        title: Bad Request
        status: 400
        detail: The method {method} does not exist
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
    InvalidToken:
      value:
        title: Invalid Token
        status: 400
        detail: Token has expired. Max age of a token is 15 min.
