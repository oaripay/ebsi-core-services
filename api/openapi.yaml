openapi: 3.0.3
info:
  title: Trusted Policies Registry API
  version: 1.0.0
  description: |
    Trusted Policies Registry API provides an interface to interact with policies stored at the ledger administrated by Policies Registry Smart Contract.
  termsOfService: /docs/terms
  contact:
    name: EBSI Support – Service Desk
    url: https://ec.europa.eu/cefdigital/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
tags:
  - name: Trusted Policies Registry API
    description: List trusted policies
paths:
  /trusted-policies-registry/v1/policies:
    get:
      tags:
        - Trusted Policies Registry API
      summary: Get list of policies
      description: Returns list of policies registered in the blockchain.
      operationId: get-policies
      security:
        - bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to policies
                  items:
                    type: array
                    description: List of policies
                    items:
                      type: object
                      properties:
                        policyId:
                          type: string
                          description: ID of the policy
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                "[test] Success":
                  value:
                    self: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies?page[after]=3&page[size]=2
                    items:
                      - policyId: "0"
                        href: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies/0
                      - policyId: "1"
                        href: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies/1
                    total: 124
                    pageSize: 2
                    links:
                      first: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies?page[after]=1&page[size]=2
                      prev: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies?page[after]=2&page[size]=2
                      next: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies?page[after]=4&page[size]=2
                      last: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies?page[after]=62&page[size]=2
                "[pilot] Success":
                  value:
                    self: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies?page[after]=3&page[size]=2
                    items:
                      - policyId: "0"
                        href: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies/0
                      - policyId: "1"
                        href: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies/1
                    total: 124
                    pageSize: 2
                    links:
                      first: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies?page[after]=1&page[size]=2
                      prev: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies?page[after]=2&page[size]=2
                      next: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies?page[after]=4&page[size]=2
                      last: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies?page[after]=62&page[size]=2
        400:
          $ref: "#/components/responses/400"
        500:
          $ref: "#/components/responses/500"
  /trusted-policies-registry/v1/policies/{policyId}:
    get:
      tags:
        - Trusted Policies Registry API
      summary: Get policy by its ID
      description: Returns a trusted policy by its ID
      operationId: get-policy
      parameters:
        - name: policyId
          in: path
          schema:
            type: string
          example: "0"
          required: true
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
              examples:
                Success:
                  value:
                    policyId: "0"
                    registry: registry-test-036ccfd98b88a9c3ad1a23e730bc414f
                    policyName: policy-test-fd0010fa07c2ff3eba04a46547687d17
                    operationType: AND
                    status: true
                    policyConditions:
                      - name: condition-string
                        attributeName: any
                        typeOfValue: STRING
                        value: vxc4gdbfgb
                        attributeOperation: EQUAL
                      - name: condition-bytes
                        attributeName: any
                        typeOfValue: BYTES
                        value: "0x61736461736464"
                        attributeOperation: EQUAL
                      - name: condition-boolean
                        attributeName: any
                        typeOfValue: BOOLEAN
                        value: false
                        attributeOperation: EQUAL
                      - name: condition-address
                        attributeName: any
                        typeOfValue: ADDRESS
                        value: "0x00000000219ab540356cbb839cbe05303d7705fa"
                        attributeOperation: EQUAL
                      - name: condition-uint256
                        attributeName: any
                        typeOfValue: UINT256
                        value: "42"
                        attributeOperation: EQUAL
        400:
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {policyId} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {policyId} parameter is not valid
        404:
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Policy Not Found:
                  $ref: "#/components/examples/NotFound"
        500:
          $ref: "#/components/responses/500"
  /trusted-policies-registry/v1/jsonrpc:
    post:
      operationId: post-jsonrpc
      tags:
        - Trusted Policies Registry API
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions and interaction with
        the ledger (Write operation on ledger).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method to be invoked. Possible values: 'insertPolicy', 'updatePolicy',
          'sendSignedTransaction'
          - **params**: Array of parameters
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              Build tx to insertPolicy:
                description: |
                  Call to build an unsigned transaction to insert a policy in the registry.
                  This method requires OPERATOR ROLE in the Trusted Policies Registry.

                   Parameters:
                   - **from**: Ethereum address of the administrator
                   - **opType**: operation type. 0 = "AND", 1 = "OR"
                   - **policyName**: name of the policy.
                   - **registry**: name of the registry.
                   - **policyConditions**: array of condition objects:
                     - **name**: name of the condition
                     - **attributeName**: name of the attribute on which it applies
                     - **value**: value to compare to
                     - **typeOfValue**: value type. 0 = "UINT256", 1 = "BYTES", 2 = "ADDRESS",
                       3= "BYTES32", 4 = "STRING", 5 = "BOOLEAN"
                     - **attributeOperation**: operation to apply. 0 = "EQUAL"
                value:
                  jsonrpc: "2.0"
                  method: insertPolicy
                  id: 1
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      opType: 0
                      policyName: policy-test-237a346cd80aea1afb21d66ce39f7695
                      registry: registry-test-98efbd91f1c40d254f4fd699a3f7b9fa
                      policyConditions:
                        - name: condition-string
                          attributeName: any
                          value: "0x76786334676462666762"
                          attributeOperation: 0
                          typeOfValue: 4
                        - name: condition-bytes
                          attributeName: any
                          value: "0x61736461736464"
                          attributeOperation: 0
                          typeOfValue: 1
                        - name: condition-boolean-uint8array
                          attributeName: any
                          value: "0x00"
                          attributeOperation: 0
                          typeOfValue: 5
                        - name: condition-address
                          attributeName: any
                          value: "0x00000000219ab540356cbb839cbe05303d7705fa"
                          attributeOperation: 0
                          typeOfValue: 2
                        - name: condition-uint256
                          attributeName: any
                          value: "0x2a"
                          attributeOperation: 0
                          typeOfValue: 0
              Build tx to updatePolicy:
                description: |
                  Call to build an unsigned transaction to update a policy.
                  This method requires OPERATOR ROLE in the Trusted Policies Registry.

                   Parameters:
                   - **from**: Ethereum address of the administrator
                   - **policyId**: Policy Id
                   - **opType**: operation type. 0 = "AND", 1 = "OR"
                   - **policyName**: name of the policy.
                   - **registry**: name of the registry.
                value:
                  jsonrpc: "2.0"
                  method: updatePolicy
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: "1"
                      opType: 0
                      policyName: policy-test-0245fd52e9606e375ffe7d46718d60c8
                      registry: registry-test-867fc5181e2a0df61094cb565cf18d96
              Send Transaction:
                description: Call to send a signed transaction to the blockchain.
                value:
                  jsonrpc: "2.0"
                  method: sendSignedTransaction
                  id: 1
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
                      s: "0x..."
                      v: "0x..."
                      signedRawTransaction: "--- signed raw transaction ---"
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
              examples:
                Build tx:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                      data: "0x0000..."
                      nonce: "0x00"
                      chainId: "0x1b3b"
                      gasLimit: "0x10000"
                      gasPrice: "0x00"
                      value: "0x00"
                Send Transaction:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: "0xe670ec64341771606e55d6b4ca35a1a6b75ee3d5145a99d05921026d1527331"
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
components:
  schemas:
    Links:
      title: Links
      type: object
      description: Links model used for pagination.
      properties:
        first:
          type: string
          description: Hyperlink to the first page.
        prev:
          type: string
          description: Hyperlink to the previous page.
        next:
          type: string
          description: Hyperlink to the next page.
        last:
          type: string
          description: Hyperlink to the last page.
    Policy:
      title: Policy
      type: object
      description: Policy data model
      properties:
        policyId:
          type: string
          description: Unique policy ID
        registry:
          type: string
          description: Registry for which this policy was defined for
        policyName:
          type: string
          description: Name of the policy
        operationType:
          type: string
          enum: [AND, OR]
          description: Type of the operation the policy performs ("AND", "OR")
        status:
          type: boolean
          description: Status of the policy (false = inactive, true = active)
        policyConditions:
          type: array
          description: List of policy conditions
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the condition
              attributeName:
                type: string
                description: Name of the attribute to validate
              typeOfValue:
                type: string
                enum: [UINT256, BYTES, ADDRESS, BYTES32, STRING, BOOLEAN]
                description: |
                  Expected attribute type. Valid types include: "UINT256", "BYTES", "ADDRESS",
                  "BYTES32", "STRING", "BOOLEAN".
              attributeOperation:
                type: string
                enum: [EQUAL]
                description: |
                  Operation to apply ("EQUAL" only)
              value:
                description: Value to compare the attribute to
                oneOf:
                  - type: string
                  - type: boolean
    JsonRpcResponse:
      title: Json Rpc Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly '2.0'
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: object
            - type: string
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem. It may or may
            not yield further information if dereferenced.
  responses:
    400:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            Bad Request:
              $ref: "#/components/examples/BadRequest"
    500:
      description: Internal Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            Internal Server Error:
              $ref: "#/components/examples/InternalError"
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    InternalError:
      value:
        title: Internal Server Error
        status: 500
        detail: The server encountered an internal error and was unable to process your request.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.preprod.ebsi.eu"
    description: EBSI Pre-production Environment
  - url: "https://api.ebsi.eu"
    description: EBSI Production Environment
  - url: "https://conformance.ebsi.eu"
    description: EBSI Conformance Environment
