          description: |
            ID of the notification, sha3-256 hash of the serialized notification schema.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
              examples:
                Success:
                  value:
                    schemaId: notification-001
                    type:
                      - Notification
                      - StoreVerifiableCredential
                    "@context":
                      - https://www.w3.org/2018/credentials/v1
                      - https://essif.europa.eu/schemas/vc/2020/v1
                      - https://essif.europa.eu/schemas/notifications/2020/v1
                    from: did:ebsi:zub5ZZUfHLLptCduwEy8xRj
