                      - schemaId: "0x312e332e362e312e342e312e313730312e372e3130372e322e322e332e3235"
                        href: https://api.test.intebsi.xyz/trusted-schemas-registry/v1/schemas/0x312e332e362e312e342e312e313730312e372e3130372e322e322e332e3235
                      - schemaId: "0x312e332e362e312e342e312e313537362e342e3230352e312e332e332e3530"
                        href: https://api.test.intebsi.xyz/trusted-schemas-registry/v1/schemas/0x312e332e362e312e342e312e313537362e342e3230352e312e332e332e3530
                    total: 4
