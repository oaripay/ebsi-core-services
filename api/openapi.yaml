                      last: https://api.test.intebsi.xyz/trusted-ledgers-smart-contracts-registry/v1/ledgers?page[after]=1&page[size]=10
                "[pilot] Success":
                  value:
                    self: https://api.preprod.ebsi.eu/trusted-ledgers-smart-contracts-registry/v1/ledgers?page[after]=1&page[size]=10
                    items:
                      - ledgerInfoId: "0xc981798c566a266b48cfd0d7684a4a00ce8d9d9d770aa7614ff0f7cc724e0a57"
                        href: https://api.preprod.ebsi.eu/trusted-ledgers-smart-contracts-registry/v1/ledgers/0xc981798c566a266b48cfd0d7684a4a00ce8d9d9d770aa7614ff0f7cc724e0a57
