  /did-registry/v2/did-timestamps:
    get:
      tags:
        - DID Registry
      summary: List of DID Timestamps
      description: Returns a list of DID Timestamps
      operationId: get-did-registry-v2-did-timestamps
      parameters:
        - in: query
          name: page[after]
          description: Cursor that points to the end of the page of data that has been returned.
          schema:
            type: string
        - in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
          schema:
            type: integer
        - in: query
          name: identifier
          description: DID, e.g. "did:ebsi:DK4UNNNqKJqSZpc1E8hmsvkQQJkUxk5UeyzRn6tWo9Ew"
          schema:
            type: string
        - in: query
          name: version-id
          description: Version ID (number)
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to DID Timestamp
                  items:
                    type: array
                    description: List of DID Timestamps
                    items:
                      type: object
                      properties:
                        timestampId:
                          type: string
                          description: Multi-base64url encoded sha256(hash)
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/Links"
