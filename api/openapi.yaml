openapi: 3.0.3
info:
  title: DID Registry API
  description: |
    DID Registry is a generic core service of the EBSI platform providing the capability of
    resolving EBSI Decentralised Identifiers (DIDs).

    It enables consumers to interact with the DID Registry SC to:
    - Insert a DID/DID Document
    - Update a DID Document
    - Revoke a DID/DID Controlling keys
    - Resolve a DID (and obtain a DID Document)
    - Resolve a version of a DID Document at a certain point in time

    For more information see:
    * [DID Registry API Technical Specifications](https://ec.europa.eu/cefdigital/wiki/display/EBSIDOC/DID+Registry+API)
    * [DID Registry Smart Contract Technical Specifications](https://ec.europa.eu/cefdigital/wiki/display/EBSIDOC/DID+Registry+Smart+Contract)
    * [Code Repository](https://ec.europa.eu/cefdigital/code/projects/EBSI/repos/did-registry-api/browse)
  version: 2.0.0
  termsOfService: /docs/terms
  contact:
    name: EBSI Support – Service Desk
    url: https://ec.europa.eu/cefdigital/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
tags:
  - name: DID Registry
    description: List trusted DIDs
paths:
  /did-registry/v2/administrators:
    get:
      tags:
        - DID Registry
      summary: List of trusted administrators
      description: Returns a list of trusted administrators
      operationId: get-did-registry-v2-administrators
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page[after]
          description: Cursor that points to the end of the page of data that has been returned.
          schema:
            type: string
        - in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
          schema:
            type: integer
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to administrators
                  items:
                    type: array
                    description: List of administrators
                    items:
                      type: object
                      properties:
                        did:
                          type: string
                          description: DID of the administrator
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                "[test] Success":
                  value:
                    self: https://api.test.intebsi.xyz/did-registry/v2/administrators?page[after]=1&page[size]=10
                    items:
                      - did: did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
                        href: https://api.test.intebsi.xyz/did-registry/v2/administrators/did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
                    total: 1
