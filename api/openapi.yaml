  /trusted-schemas-registry/v1/jsonrpc:
    post:
      operationId: post-trusted-schemas-registry-v1-jsonrpc
      tags:
        - Trusted Schemas Registry
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions and interaction with
        the ledger (Write operation on ledger).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method to be invoked. Possible values: 'insertAdministrator', 'insertPolicy',
            'insertSchema', 'updateSchema', 'updateAdministrator', 'updatePolicy', 'updateMetadata'
          - **params**: Array of parameters
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              Build tx to insertAdministrator:
                description: |
                  Call to build an unsigned transaction to insert a new administrator in the registry. This method requires admin rights in the Trusted Schemas Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of new administrator
                  - **attributeData**: Attribute data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: insertAdministrator
                  id: 1
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      did: did:ebsi:ztY82rTMVTTQ4QEkNmkbDuv
                      attributeData: "0x7b2261646d696e223a22306139393338616431616538623865323932613961336536227d"
              Build tx to insertPolicy:
                description: |
                  Call to build an unsigned transaction to insert a policy in the registry. This method requires admin rights in the Trusted Schemas Registry.

                   Parameters:
                   - **from**: Ethereum address of the administrator
                   - **policyId**: Policy Id
                   - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: insertPolicy
                  id: 1
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      policyId: my-policy
                      policyData: "0x7b22706f6c696379223a22396361663735323733373936353135656465613631323165227d"
              Build tx to insertSchema:
                description: |
                  Call to build an unsigned transaction to insert a new schema. This method requires admin rights in the Trusted Schemas Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **schemaId**: DOI/OID converted into hex string
                  - **schema**: Content. This field must be a JSON stringified and converted into hex string
                  - **metadata**: Metadata of the first version. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: insertSchema
                  id: 1
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      schemaId: "0x312e332e362e312e342e312e3339312e31302e3132302e322e332e312e3734"
                      schema: "0x7b2240636f6e74657874223a2268747470733a2f2f656273692e6575222c2274797065223a22536368656d61222c226e616d65223a226578616d706c65222c2264617461223a223065346637383664343036613330643339343438633563613232343562316130227d"
                      metadata: "0x7b226d657461223a2276616c7565222c2264617461223a223536323930303863363738383536346164653165353266383635623864366535222c2276616c696446726f6d223a22323032312d30382d30325430393a31323a30342e3230365a222c2276616c6964546f223a22323032312d30382d30325430393a31383a30342e3230365a227d"
              Build tx to updatePolicy:
                description: |
                  Call to build an unsigned transaction to update a policy. This method requires admin rights in the Trusted Schemas Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                   - **policyId**: Policy Id
                   - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updatePolicy
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: test-policy-1
                      policyData: "0x1234567890..."
              Build tx to updateSchema:
                description: |
                  Call to build an unsigned transaction to update an schema. This method requires admin rights in the Trusted Schemas Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **schemaId**: Schema ID
                  - **schema**: Content. This field must be a JSON stringified and converted into hex string
                  - **metadata**: Metadata. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateSchema
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      schemaId: "{ hex-encoded oid or doi }"
                      schema: "0x227b2240636f6e74657874223a2268747470733a2f2f656273692e6575222c2274797065223a22536368656d61222c226e616d65223a226578616d706c65227d22"
                      metadata: "0x227b226d657461223a2276616c7565227d22"
              Build tx to updateAdministrator (new attribute):
                description: |
                  Call to build an unsigned transaction to insert new attribute data to an administrator in the registry. This method requires admin rights in the Trusted Schemas Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of the administrator to update
                  - **attributeData**: Attribute data to add. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateAdministrator
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      did: did:ebsi:ztY82rTMVTTQ4QEkNmkbDuv
                      attributeData: "0x7b2261646d696e223a22306139393338616431616538623865323932613961336536227d"
                  id: 1
              Build tx to updateAdministrator (update attribute):
                description: |
                  Call to build an unsigned transaction to update an attribute of an administrator in the registry. This method requires admin rights in the Trusted Schemas Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of the administrator to update
                  - **prevAttributeHash**: Attribute ID to update
                  - **attributeData**: Attribute data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateAdministrator
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      did: did:ebsi:ztY82rTMVTTQ4QEkNmkbDuv
                      attributeData: "0x7b2261646d696e223a22306139393338616431616538623865323932613961336536227d"
                      prevAttributeHash: "0x9045517cc555c75cd7085900a900e6693439086f9eddeee513271fba278964fe"
                  id: 1
              Build tx to updateMetadata:
                description: |
                  Call to build an unsigned transaction to update the metadata of a schema revision. This method requires admin rights in the Trusted Schemas Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **schemaRevisionId**: Schema revision ID
                  - **metadata**: Metadata. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateMetadata
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      schemaRevisionId: "0x3f571838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0909"
                      metadata: "0x227b226d657461223a2276616c7565227d22"
              Send Transaction:
                description: Call to send a signed transaction to the blockchain.
                value:
                  jsonrpc: "2.0"
                  method: signedTransaction
                  id: 1
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
                      s: "0x..."
                      v: "0x..."
                      signedRawTransaction: "--- signed raw transaction ---"
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
              examples:
                Build tx:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                      data: "0x0000..."
                      nonce: "0x00"
                      chainId: "0x1b3b"
                      gasLimit: "0x10000"
                      gasPrice: "0x00"
                      value: "0x00"
                Send Transaction:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: "0xe670ec64341771606e55d6b4ca35a1a6b75ee3d5145a99d05921026d1527331"
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
components:
  schemas:
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    JsonRpcResponse:
      title: Json Rpc Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly '2.0'
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: object
            - type: string
    Links:
      title: Links
      type: object
      description: Links model used for pagination.
      properties:
        first:
          type: string
          description: Hyperlink to the first page.
        prev:
          type: string
          description: Hyperlink to the previous page.
        next:
          type: string
          description: Hyperlink to the next page.
        last:
          type: string
          description: Hyperlink to the last page.
    SchemaLinks:
      title: Schema links
      description: Links to schemas as returned by the REST APIs.
      type: object
      properties:
        schemaId:
          type: string
          description: Unique schema id (OID or DOI)
        href:
          type: string
          description: Link to the resource.
    Administrator:
      title: Administrator
      type: object
      description: Name of the administrator
      properties:
        did:
          type: string
          description: DID of the administrator
        attributes:
          type: array
          description: Array of attributes
          items:
            $ref: "#/components/schemas/Attribute"
    Attribute:
      title: Attribute
      type: object
      description: Attribute
      properties:
        hash:
          type: string
          description: sha256 hash of the payload
        body:
          description: Base64 encoded content
    AttributeDetails:
      title: AttributeDetails
      type: object
      description: Attribute Details
      properties:
        did:
          type: string
          description: DID of the attribute owner
        attribute:
          $ref: "#/components/schemas/Attribute"
    SchemaRevisionsLinks:
      title: Schema revisions links
      description: Links to schema revisions as returned by the REST APIs.
      type: object
      properties:
        schemaRevisionId:
          type: string
          description: Schema revision id - SHA2-256 hash of the schema revision (hexadecimal)
        href:
          type: string
          description: Link to the resource.
    SchemaRevisionsMetadataLinks:
      title: Schema revisions metadata links
      description: Links to schema revisions metadata as returned by the REST APIs.
      type: object
      properties:
        metadataId:
          type: string
          description: Schema revision metadata id - SHA2-256 hash of the schema revision metadata (hexadecimal)
        href:
          type: string
          description: Link to the resource.
    Policy:
      title: Policy
      type: object
      description: Policy data model
      properties:
        policyId:
          type: string
          description: Unique policy ID
        policy:
          type: string
          description: Base64 encoded policy
        hash:
          type: string
          description: Hash (multihash) of the policy
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.preprod.ebsi.eu"
    description: EBSI Pre-production Environment
  - url: "https://api.ebsi.eu"
    description: EBSI Production Environment
