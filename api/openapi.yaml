  /trusted-apps-registry/v2/jsonrpc:
    post:
      operationId: post-ledger-v2-blockchains-besu
      tags:
        - Trusted Apps Registry
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions for TAR SC operations,
        and interaction with the ledger (Write operation on ledger)
      requestBody:
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method that to be invoked. Possible values: deleteAppAdministrator,
          insertAdministrator, insertApp, insertAppAdministrator, insertAppInfo,
          insertAppPublicKey, insertAuthorization, insertPolicy, insertRevocation,
          signedTransaction, updateAdministrator, updateApp, updateAppPublicKey,
          updateAuthorization, and updatePolicy.
          - **params**: Array of parameters
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier stablished by the client
                  type: integer
                  example: 1
            examples:
              Build tx to deleteAppAdministrator:
                value:
                  jsonrpc: "2.0"
                  method: deleteAppAdministrator
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      applicationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      administratorId: "did:ebsi:0x5afee6162656c2e4c65652e452d412d506f652f"
                  id: 1
              Build tx to insertAdministrator:
                value:
                  jsonrpc: "2.0"
                  method: insertAdministrator
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4
                      attribute:
                        {
                          body: eyJhbnkiOiJBbnkgYXR0cmlidXRlIGhlcmUiLCJ0eXBlIjoiY3JlZGVudGlhbCIsImRhdGEiOiI2ZDdlNWUxZjJlYmExZDU2ZTJmZThlZjdiMTZmNGRlNSJ9,
                          hash: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3",
                        }
                  id: 1
              Build tx to insertApp:
                value:
                  jsonrpc: "2.0"
                  method: insertApp
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      name: "my app"
                      domain: "ebsi"
                      appAdministrator: "did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4"
                      publicKey: |
                        -----BEGIN PUBLIC KEY-----\nMFYwEAYHKoZI...IqA==\n-----END PUBLIC KEY-----
                      status: "active"
                      notBefore: 1609926740
                      notAfter: 1709926740
                  id: 1
              Build tx to insertAppAdministrator:
                value:
                  jsonrpc: "2.0"
                  method: insertAppAdministrator
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      applicationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      administratorId: "did:ebsi:0x5afee6162656c2e4c65652e452d412d506f652f"
                  id: 1
              Build tx to insertAppInfo:
                value:
                  jsonrpc: "2.0"
                  method: insertAppInfo
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      applicationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      info: { anyField: info data }
                  id: 1
              Build tx to insertAppPublicKey:
                value:
                  jsonrpc: "2.0"
                  method: insertAppPublicKey
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      applicationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      publicKey: |
                        -----BEGIN PUBLIC KEY-----\nMFYwEAYHKoZI...IqA==\n-----END PUBLIC KEY-----
                      status: "suspended"
                      notBefore: 1609926740
                      notAfter: 1709926740
                  id: 1
              Build tx to insertAuthorization:
                value:
                  jsonrpc: "2.0"
                  method: insertAuthorization
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      name: "app1"
                      authorizedAppName: "app2"
                      iss: "did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4"
                      status: "active"
                      permissions: "crud"
                      notBefore: 1609926740
                      notAfter: 1709926740
                  id: 1
              Build tx to insertPolicy:
                value:
                  jsonrpc: "2.0"
                  method: insertPolicy
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: test-policiy-1
                      policy: eyJhbnkiOiJBbnkgYXR0cmlidXRlIGhlcmUiLCJ0eXBlIjoiY3JlZGVudGlhbCIsImRhdGEiOiIwZjQ4YmY1MWE3NjU4MGY2NDlhYTEzZDdhMDU4NGRhZSJ9
                  id: 1
              Build tx to insertRevocation:
                value:
                  jsonrpc: "2.0"
                  method: insertRevocation
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      applicationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      revokedBy: "did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4"
                      notBefore: 1609926740
                  id: 1
              Build tx to updateAdministrator (new attribute):
                value:
                  jsonrpc: "2.0"
                  method: updateAdministrator
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4
                      attribute:
                        {
                          body: eyJhbnkiOiJBbnkgYXR0cmlidXRlIGhlcmUiLCJ0eXBlIjoiY3JlZGVudGlhbCIsImRhdGEiOiI2ZDdlNWUxZjJlYmExZDU2ZTJmZThlZjdiMTZmNGRlNSJ9,
                          hash: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3",
                        }
                  id: 1
              Build tx to updateAdministrator (update attribute):
