  /trusted-schemas-registry/v1/schemas/{schemaId}:
    get:
      operationId: get-trusted-schemas-registry-v1-schema
      summary: Get a schema
      description: Returns a trusted schema identified by its ID.
      tags:
        - Schemas
      parameters:
        - name: schemaId
          in: path
          schema:
            type: string
          examples:
            "[test] schemaId":
              description: valid test schemaId
              value: "0x312e332e362e312e342e312e313936372e372e3138312e332e322e332e3735"
            "[pilot] schemaId":
              description: valid preprod schemaId
              value: "0x312e332e362e312e342e312e313537362e342e3230352e312e332e332e3530"
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Success:
                  value:
                    "@context": https://ebsi.eu
                    type: Schema
                    name: example
                    data: 53a8da4c21d411b462bcfd9498cdc842
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Invalid {schemaId} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {schemaId} parameter is not valid
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Schema Not Found:
                  $ref: "#/components/examples/NotFound"
                Revision Not Found:
                  $ref: "#/components/examples/NotFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
