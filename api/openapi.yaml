openapi: 3.0.3
info:
  title: Trusted Apps Registry API
  description: |
    Trusted Apps Registry (TAR) API is an EBSI core service. It enables us to interact with the Trusted Apps Registry Smart Contract to:
    * manage (register/update/revoke) trusted EBSI and trusted external applications,
    * manage application authorizations,
    * manage application administrators,
    * obtain application information,
    * obtain application authorizations.

    For more information see:

    * [TAR API Technical Specifications](https://ec.europa.eu/cefdigital/wiki/x/SoiWFQ)
    * [TAR Smart Contract Technical Specifications](https://ec.europa.eu/cefdigital/wiki/x/rIiWFQ)
    * [Code Repository](https://ec.europa.eu/cefdigital/code/projects/EBSI/repos/trusted-apps-registry-api/browse)
  version: 2.0.0
  termsOfService: /docs/terms
  contact:
    name: EBSI Support
    url: https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.preprod.ebsi.eu"
    description: EBSI Pre-production Environment
  - url: "https://api.ebsi.eu"
    description: EBSI Production Environment
tags:
  - name: Trusted Apps Registry
    description: List and verify trusted apps
paths:
  /trusted-apps-registry/v2/apps:
    get:
      tags:
        - Trusted Apps Registry
      summary: Get all apps
      description: Get all apps. Endpoint returns a paginated list of items.
      operationId: get-trusted-apps-registry-v2-apps
      parameters:
        - in: query
          name: page[before]
          schema:
            type: string
          description: Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
        - in: query
          name: name
          schema:
            type: string
          description: Filter results by name
        - in: query
          name: public_key_id
          schema:
            type: string
          description: Filter results by public key id
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to apps
                  items:
                    type: array
                    description: List of apps
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ID of the app
                        name:
                          type: string
                          description: Name of the app
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                Success:
                  value:
                    self: https://api.ebsi.xyz/trusted-apps-registry/v2/apps?page[after]=3&page[size]=2
                    items:
                      - id: "0x3f571838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0909"
                        name: test-app-1
                        href: https://api.ebsi.xyz/trusted-apps-registry/v2/apps/0x3f571838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0909
                      - id: "0x1b891838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0854"
                        name: test-app-2
                        href: https://api.ebsi.xyz/trusted-apps-registry/v2/apps/0x1b891838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0854
                    total: 124
                    pageSize: 2
                    links:
                      first: https://api.ebsi.xyz/trusted-apps-registry/v2/apps?page[after]=1&page[size]=2
                      prev: https://api.ebsi.xyz/trusted-apps-registry/v2/apps?page[after]=2&page[size]=2
                      next: https://api.ebsi.xyz/trusted-apps-registry/v2/apps?page[after]=4&page[size]=2
                      last: https://api.ebsi.xyz/trusted-apps-registry/v2/apps?page[after]=62&page[size]=2
        400:
          description: Bad Request Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Paging Request:
                  value:
                    title: Bad Paging Request
                    status: 400
                    detail: PageSize should not be greater than 50
        500:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /trusted-apps-registry/v2/apps/{applicationId}:
    get:
      tags:
        - Trusted Apps Registry
      summary: Get app by its ID
      description: Returns a trusted app by its ID
      operationId: get-trusted-apps-registry-v2-app
      parameters:
        - name: applicationId
          in: path
          schema:
            type: string
          example: "0x3f571838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0909"
          required: true
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
              examples:
                Success:
                  value:
                    applicationId: "0x3f571838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0909"
                    name: test-app-1
                    domain: ebsi
                    administrators:
                      - "did:ebsi:0x8031E8E4Df0d53bee9d4E78049aE74329905A288"
                      - "did:ebsi:0x4713e2C59DB9411e71e39C85c5De8613E744dA5a"
                    publicKeys:
                      - LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0t...
                      - LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0t...
                    info:
                      { data1: "data 1", data2: "data 2", anyField: "any data" }
                    authorizations:
                      - authorizationId: "0x3f571838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0909"
                        resourceApplicationId: "0x125b1838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0845"
                        requesterApplicationId: "0xca451838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d1234"
                        resourceApplicationName: test-app-1
                        requesterApplicationName: test-app-2
                        iss: did:ebsi:0xeD82f3e166D72d47a687cD4b182710a21F431485
                        permissions:
                          create: "true"
                          read: "true"
                          update: "false"
                          delete: "false"
                        status: active
                        notBefore: 1610699786
                        notAfter: 2610699786
        400:
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {appId} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {appId} parameter is not valid
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                DID Not Found:
                  $ref: "#/components/examples/NotFound"
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
