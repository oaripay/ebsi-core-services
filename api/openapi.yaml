openapi: 3.0.3
info:
  title: Trusted Issuers Registry API
  description: |
    Trusted Issuers Registry API is a Core Service of the EBSI platform verifying
    if a legal entity is authorized to issue a W3C Verifiable Credential.
    The first implementation of this service in v1 checks for the presence of issuers DID
    in a Trusted Issuers Smart Contract and verifies if they are allowed
    to issue specific Verifiable Credentials.
  version: 2.0.0
  termsOfService: "/docs/terms"
  contact:
    name: EBSI Support
    url: "https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi"
  license:
    name: EUPL-1.2
    url: "https://joinup.ec.europa.eu/page/eupl-text-11-12"
tags:
  - name: Trusted Issuers Registry
    description: List and verify trusted issuers
paths:
  /trusted-issuers-registry/v2/administrators:
    get:
      tags:
        - Trusted Issuers Registry
      summary: List of trusted administrators
      description: Returns a list of trusted administrators
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to administrators
                  items:
                    type: array
                    description: list of administrators whith their decentralized identifier
                    items:
                      type: string
                  total:
                    type: integer
                    description: Total number of pages in a collection
                  pageSize:
                    type: integer
                    description: number of items to be return per page
                  links:
                    $ref: "#/components/schemas/links"
              examples:
                Success:
                  value:
                    self: "https://api.ebsi.xyz/trusted-issuers-registry/v2/administrators"
                    items:
                      - did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
                      - did:ebsi:0x454253492d52554c45532d4d414c494e41524148
                    total: 2
                    pageSize: 10
                    links:
                      first: "/trusted-issuers-registry/v2/administrators?page[after]=0&page[size]=10"
                      prev: "/trusted-issuers-registry/v2/administrators?page[after]=2&page[size]=10"
                      next: "/trusted-issuers-registry/v2/administrators?page[after]=4&page[size]=10"
                      last: "/trusted-issuers-registry/v2/administrators?page[after]=13&page[size]=10"
        "400":
          description: Bad Request Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Paging Request:
                  value:
                    title: Bad Paging Request
                    status: 400
                    detail: PageSize should not be greater than 50
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      operationId: get-trusted-issuers-registry-v2-administrators
      parameters:
        - in: query
          name: "page[before]"
          schema:
            type: string
          description: Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: "page[after]"
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: "page[size]"
          description: Defines the maximum number of objects that may be returned.
