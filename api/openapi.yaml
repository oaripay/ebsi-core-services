  /timestamp/v2/jsonrpc:
    post:
      operationId: post-timestamp-v2-jsonrpc
      tags:
        - Timestamp API
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions for Timestamp
        operations, and interaction with the ledger (Write operation on ledger)
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method to be invoked. Possible values: insertHashAlgorithm,
            updateHashAlgorithm, timestampHashes, timestampRecordHashes,
            insertRecordOwner, revokeRecordOwner, timestampRecordVersionHashes,
            appendRecordVersionHashes, detachRecordVersionHash
            insertRecordVersionInfo, signedTransaction.
          - **params**: Array of parameters
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier stablished by the client
                  type: integer
                  example: 1
            examples:
              Build tx to insertHashAlgorithm:
                value:
                  jsonrpc: "2.0"
                  method: insertHashAlgorithm
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      outputLength: 256
                      ianaName: sha-256
                      oid: "2.16.840.1.101.3.4.2.1"
                      status: 1
                  id: 1
              Build tx to updateHashAlgorithm:
                value:
                  jsonrpc: "2.0"
                  method: updateHashAlgorithm
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      hashAlgorithmId: 3
                      outputLength: 256
                      ianaName: sha-256
                      oid: "2.16.840.1.101.3.4.2.1"
                      status: 2
                  id: 1
              Build tx to timestampHashes:
                value:
                  jsonrpc: "2.0"
                  method: timestampHashes
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      hashAlgorithmIds:
                        - 0
                      hashValues:
                        - "0x1234567890123456789012345678901234567890123456789012345678901234"
                      timestampData:
                        - "0xec45567890123456789012345678901fa456789012345678901234567890abfe"
                  id: 1
              Build tx to timestampRecordHashes:
                value:
                  jsonrpc: "2.0"
                  method: timestampRecordHashes
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      hashAlgorithmIds:
                        - 0
                      hashValues:
                        - "0x1234567890123456789012345678901234567890123456789012345678901234"
                      timestampData:
                        - "0xec45567890123456789012345678901fa456789012345678901234567890abfe"
                      versionInfo: "0x7b2274657374223a34327d"
                  id: 1
              Build tx to insertRecordOwner:
                value:
                  jsonrpc: "2.0"
                  method: insertRecordOwner
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      recordId: "0xec45567890123456789012345678901fa456789012345678901234567890abfe"
                      ownerId: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      notBefore: 1606387195
                      notAfter: 0
                  id: 1
              Build tx to revokeRecordOwner:
                value:
                  jsonrpc: "2.0"
                  method: revokeRecordOwner
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      recordId: "0xec45567890123456789012345678901fa456789012345678901234567890abfe"
                      ownerId: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                  id: 1
              Build tx to timestampRecordVersionHashes:
                value:
                  jsonrpc: "2.0"
                  method: timestampRecordVersionHashes
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      recordId: "0xec45567890123456789012345678901fa456789012345678901234567890abfe"
                      hashAlgorithmIds:
                        - 0
                      hashValues:
                        - "0x1234567890123456789012345678901234567890123456789012345678901234"
                      timestampData:
                        - "0xec45567890123456789012345678901fa456789012345678901234567890abfe"
                      versionInfo: "0x7b2274657374223a34327d"
                  id: 1
              Build tx to appendRecordVersionHashes:
                value:
                  jsonrpc: "2.0"
                  method: appendRecordVersionHashes
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      recordId: "0xec45567890123456789012345678901fa456789012345678901234567890abfe"
                      versionId: 0
                      hashAlgorithmIds:
                        - 0
                      hashValues:
                        - "0x1234567890123456789012345678901234567890123456789012345678901234"
