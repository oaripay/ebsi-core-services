openapi: 3.0.3
info:
  title: Notifications API
  version: 1.0.0
  description: |
    Notifications API is an EBSI core service that helps to send async or delayed notifications by addressing the DID of a natural person or legal entity.
    * Notification service can be used by any entity/user registered in the DID registry or application registered in the Trusted Applications Registry (TAR).
    * Entity or application is notified via its DID registered in the DID registry or TAR.

    For more information see:
    * [Technical Specifications](https://ec.europa.eu/cefdigital/wiki/display/EBSIDOC/Notifications+API)
    * [Code repository](https://ec.europa.eu/cefdigital/code/projects/EBSI/repos/notifications-api/)
  termsOfService: /docs/terms
  contact:
    name: EBSI Support – Service Desk
    url: https://ec.europa.eu/cefdigital/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.preprod.ebsi.eu"
    description: EBSI Pre-production Environment
  - url: "https://api.ebsi.eu"
    description: EBSI Production Environment
tags:
  - name: Notifications
    description: Store and retrieve notifications
paths:
  /notifications/v1/notifications:
    post:
      tags:
        - Notifications
      summary: Create a new notification
      description: Creates a new notification and stores it to the Decentralized Storage.
      operationId: post-notifications-v1-notifications
      security:
        - bearerAuth: []
      requestBody:
        description: Notification Request Input
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Notification"
            examples:
              New Notification:
                value:
                  schemaId: notification-001
                  type:
                    - Notification
                    - StoreVerifiableCredential
                  "@context":
                    - https://www.w3.org/2018/credentials/v1
                    - https://essif.europa.eu/schemas/vc/2020/v1
                    - https://essif.europa.eu/schemas/notifications/2020/v1
                  from: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657
                  to: did:ebsi:0xC2322cfDde2ffB61De2692D6369C4AFDAc48fe93
                  issuanceDate: "2019-06-22T14:11:44Z"
                  expirationDate: "2019-06-27T14:11:44Z"
                  payload: {}
                  proof:
                    type: EcdsaSecp256k1Signature2019
                    created: "2019-11-17T14:00:00Z"
                    proofPurpose: assertionMethod
                    verificationMethod: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657#key-1
                    jws: eyJh..Iw
        required: true
      responses:
        201:
          description: Creates a new notification
          headers:
            Location:
              schema:
                type: string
                example: https://api.ebsi.xyz/notifications/v1/notifications/123
              description: URI to retrieve a specific notification using its identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
              examples:
                Created:
                  value:
                    schemaId: notification-001
                    type:
                      - Notification
                      - StoreVerifiableCredential
                    "@context":
                      - https://www.w3.org/2018/credentials/v1
                      - https://essif.europa.eu/schemas/vc/2020/v1
                      - https://essif.europa.eu/schemas/notifications/2020/v1
                    from: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657
                    to: did:ebsi:0xC2322cfDde2ffB61De2692D6369C4AFDAc48fe93
                    issuanceDate: "2019-06-22T14:11:44Z"
                    expirationDate: "2019-06-27T14:11:44Z"
                    payload: {}
                    proof:
                      type: EcdsaSecp256k1Signature2019
                      created: "2019-11-17T14:00:00Z"
                      proofPurpose: assertionMethod
                      verificationMethod: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657#key-1
                      jws: eyJh..Iw
        400:
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                BadRequest:
                  $ref: "#/components/examples/BadRequest"
        401:
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        403:
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Forbidden:
                  $ref: "#/components/examples/Forbidden"
        500:
          description: Internal Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
    get:
      tags:
        - Notifications
      summary: Get all notifications
      description: Retrieves all the notifications corresponding to the Bearer Token's DID.
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationLinks"
                  self:
                    type: string
                    description: Absolute URI (http or https) to the the resource's own location.
                  links:
                    $ref: "#/components/schemas/Links"
                  pageSize:
                    type: integer
                    description: Maximum number of items per page.
                  total:
                    type: integer
                    description: Total number of items across all pages.
              examples:
                Get notifications:
                  value:
                    items:
                      - schemaId: notification-001
                        type:
                          - Notification
                          - StoreVerifiableCredential
                        "@context":
                          - https://www.w3.org/2018/credentials/v1
                          - https://essif.europa.eu/schemas/vc/2020/v1
                          - https://essif.europa.eu/schemas/notifications/2020/v1
                        from: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657
                        to: did:ebsi:0xC2322cfDde2ffB61De2692D6369C4AFDAc48fe93
                        issuanceDate: "2019-06-22T14:11:44Z"
                        expirationDate: "2019-06-27T14:11:44Z"
                        payload: {}
                        proof:
                          type: EcdsaSecp256k1Signature2019
                          created: "2019-11-17T14:00:00Z"
                          proofPurpose: assertionMethod
                          verificationMethod: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657#key-1
                          jws: eyJh..Iw
                        _links:
                          self:
                            href: /notifications/v1/notifications/123
                      - schemaId: notification-001
                        type:
                          - Notification
                          - RequestVerifiablePresentation
                        "@context":
                          - https://www.w3.org/2018/credentials/v1
                          - https://essif.europa.eu/schemas/vc/2020/v1
                          - https://essif.europa.eu/schemas/notifications/2020/v1
                        from: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657
                        to: did:ebsi:0xC2322cfDde2ffB61De2692D6369C4AFDAc48fe93
                        issuanceDate: "2019-06-22T14:11:44Z"
                        expirationDate: "2019-06-27T14:11:44Z"
                        payload: {}
                        proof:
                          type: EcdsaSecp256k1Signature2019
                          created: "2019-11-17T14:00:00Z"
                          proofPurpose: assertionMethod
                          verificationMethod: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657#key-1
                          jws: eyJh..Iw
                        _links:
                          self:
                            href: https://api.ebsi.xyz/notifications/v1/notifications/124
                    total: 13
                    pageSize: 2
                    self: https://api.ebsi.xyz/notifications/v1/notifications?page[after]=3&page[size]=2
                    links:
                      first: https://api.ebsi.xyz/notifications/v1/notifications?page[after]=1&page[size]=2
                      prev: https://api.ebsi.xyz/notifications/v1/notifications?page[after]=2&page[size]=2
                      next: https://api.ebsi.xyz/notifications/v1/notifications?page[after]=4&page[size]=2
                      last: https://api.ebsi.xyz/notifications/v1/notifications?page[after]=7&page[size]=2
        400:
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                BadRequest:
                  $ref: "#/components/examples/BadRequest"
        401:
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        403:
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Forbidden:
                  $ref: "#/components/examples/Forbidden"
        500:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      security:
        - bearerAuth: []
      operationId: get-notifications-v1-notifications
      parameters:
        - in: query
          name: page[before]
          schema:
            type: string
          description: |
            Cursor that points to the start of the page of data that has been
            returned.
        - in: query
          name: page[after]
          schema:
            type: string
          description: |
            Cursor that points to the end of the page of data that has been
            returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
  /notifications/v1/notifications/{id}:
    get:
      tags:
        - Notifications
      summary: Get notification by ID
      description: Gets a specific notification by its ID.
      operationId: get-notifications-v1-notifications-id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          schema:
            type: string
            example: ecd0e108a98e192af1d2c25055f4e3bed784b5c877204e73219a5203251feaab
          required: true
          description: |
            ID of the notification, sha3-256 hash of the serialized notification schema.
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
              examples:
                Success:
                  value:
                    schemaId: notification-001
                    type:
                      - Notification
                      - StoreVerifiableCredential
                    "@context":
                      - https://www.w3.org/2018/credentials/v1
                      - https://essif.europa.eu/schemas/vc/2020/v1
                      - https://essif.europa.eu/schemas/notifications/2020/v1
                    from: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657
                    to: did:ebsi:0xC2322cfDde2ffB61De2692D6369C4AFDAc48fe93
                    issuanceDate: "2019-06-22T14:11:44Z"
                    expirationDate: "2019-06-27T14:11:44Z"
                    payload: {}
                    proof:
                      type: EcdsaSecp256k1Signature2019
                      created: "2019-11-17T14:00:00Z"
                      proofPurpose: assertionMethod
                      verificationMethod: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657#key-1
                      jws: eyJh..Iw
        400:
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {id} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The {id} parameter is not valid
        401:
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        403:
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Forbidden:
                  $ref: "#/components/examples/Forbidden"
        404:
          description: Notification Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Not found:
                  value:
                    title: Not Found
                    status: 404
                    detail: Id parameter not found
        500:
          description: Internal Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
    delete:
      tags:
        - Notifications
      summary: Delete notification by ID
      description: Deletes a notification by its ID.
      operationId: delete-notifications-v1-notifications-id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          schema:
            type: string
            example: ecd0e108a98e192af1d2c25055f4e3bed784b5c877204e73219a5203251feaab
          required: true
          description: |
            ID of the notification, sha3-256 hash of the serialized notification schema.
      responses:
        204:
          description: Notification deleted
        400:
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {id} parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The {id} parameter is not valid
        401:
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        403:
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Forbidden:
                  $ref: "#/components/examples/Forbidden"
        404:
          description: Notification Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Not found:
                  value:
                    title: Not Found
                    status: 404
                    detail: No notification found for the given ID
        500:
          description: Internal Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
components:
  schemas:
    Notification:
      type: object
      description: Notification
      example:
        schemaId: notification-001
        type:
          - Notification
          - StoreVerifiableCredential
        "@context":
          - https://www.w3.org/2018/credentials/v1
          - https://essif.europa.eu/schemas/vc/2020/v1
          - https://essif.europa.eu/schemas/notifications/2020/v1
        from: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657
        to: did:ebsi:0xC2322cfDde2ffB61De2692D6369C4AFDAc48fe93
        issuanceDate: "2019-06-22T14:11:44Z"
        expirationDate: "2019-06-27T14:11:44Z"
        payload: {}
        proof:
          type: EcdsaSecp256k1Signature2019
          created: "2019-11-17T14:00:00Z"
          proofPurpose: assertionMethod
          verificationMethod: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657#key-1
          jws: eyJh..Iw
      title: Notification
      properties:
        schemaId:
          type: string
          description: |
            Notification Schema identifier generated after registering it to the
            Trusted Schemas Registry.
          example: notification-001
        type:
          type: array
          description: |
            Notification type that corresponds to the Notifications type that is
            included as data.
          example:
            - Notification
            - StoreVerifiableCredential
          uniqueItems: true
          items:
            type: string
        "@context":
          description: |
            An ordered set where the first item is a URI https://www.w3.org/2018/credentials/v1. It
            is used to define terms and help to express specific identifiers in a compact manner.
          items:
            type: string
          uniqueItems: true
          example:
            - https://www.w3.org/2018/credentials/v1
          type: array
        from:
          type: string
          description: Sender's Decentralized Identifier
          example: did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
        to:
          type: string
          description: Recipient's Decentralized Identifier
          example: did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
        issuanceDate:
          type: string
          description: |
            Date and time at which the information associated with the notification becomes valid.
          format: date-time
          example: "2010-01-01T19:23:24Z"
        expirationDate:
          type: string
          format: date-time
          example: "2020-01-01T19:23:24Z"
          description: Date and time at which a notification ceases to be valid.
        payload:
          type: object
          format: application/json
          description: "Any valid JSON. Size limit: 1MB"
        proof:
          $ref: "#/components/schemas/embeddedProof"
      required:
        - schemaId
        - type
        - "@context"
        - from
        - to
        - issuanceDate
        - payload
        - proof
    embeddedProof:
      title: Embedded Proof
      type: object
      description: |
        Cryptographic proofs that can be used to detect tampering and verify the authorship of a
        notification. An embedded proof is a mechanism where the proof is included in the data,
        such as a Linked Data Signature.
      properties:
        type:
          type: string
          description: Type of the object or the datatype of the typed value.
          example: EcdsaSecp256k1Signature2019
        created:
          type: string
          description: Date and time at which proof has been created.
          format: date-time
          example: "2019-11-17T09:00:00Z"
        proofPurpose:
          type: string
          description: |
            It expresses the purpose of the proof and ensures the information is protected by the
            signature.
          example: assertionMethod
        verificationMethod:
          type: string
          description: |
            Specifies the public key that can be used to verify the digital signature.
            Dereferencing a public key URL reveals information about the controller of the key,
            which can be checked against the issuer of the credential.
          example: did:ebsi:0x454253492d52554c45532d4d414c494e41524148#key-1
        jws:
          type: string
          description: JSON Web Signature
          example: eyJhbGciOiJFUzI1NksifQ.eyJzdWIiOiJFQlNJIDIwMTkifQ.oggE3ft3kJYPGGa9eBibpbjgeJXw4fLbVMouVoM2NfcDxsl_UUUIarsS1VpBoYEs7s9cBlc4uC0EbnJCHfVJIw
      required:
        - type
        - created
        - proofPurpose
        - verificationMethod
        - jws
      example:
        type: RsaSignature2018
        created: "2018-06-18T21:19:10Z"
        proofPurpose: assertionMethod
        verificationMethod: "https://example.com/jdoe/keys/1"
        jws: eyJhbGciOiJQUzI1NiIsImI2NCI..
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: "about:blank"
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    Links:
      title: Links
      type: object
      properties:
        last:
          type: string
          description: URI of the last page
        prev:
          type: string
          description: URI of the previous page
        next:
          type: string
          description: URI of the next page
        first:
          type: string
          description: URI of the first page
      description: links model used for pagination
      example:
        first: https://api.ebsi.xyz/notifications/v1/notifications?page[after]=1&page[size]=2
        prev: https://api.ebsi.xyz/notifications/v1/notifications?page[after]=2&page[size]=2
        next: https://api.ebsi.xyz/notifications/v1/notifications?page[after]=4&page[size]=2
        last: https://api.ebsi.xyz/notifications/v1/notifications?page[after]=7&page[size]=2
    NotificationLinks:
      type: object
      description: Notification Object with a link to retrieve the specific notification.
      example:
        schemaId: notification-001
        type:
          - Notification
          - StoreVerifiableCredential
        "@context":
          - https://www.w3.org/2018/credentials/v1
          - https://essif.europa.eu/schemas/vc/2020/v1
          - https://essif.europa.eu/schemas/notifications/2020/v1
        from: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657
        to: did:ebsi:0xC2322cfDde2ffB61De2692D6369C4AFDAc48fe93
        issuanceDate: "2019-06-22T14:11:44Z"
        expirationDate: "2019-06-27T14:11:44Z"
        payload: {}
        proof:
          type: EcdsaSecp256k1Signature2019
          created: "2019-11-17T14:00:00Z"
          proofPurpose: assertionMethod
          verificationMethod: did:ebsi:0x2F5Ea30a6dbf76FA3BF6fDb297A53684530Bb657#key-1
          jws: eyJh..Iw
        _links:
          self:
            href: https://api.ebsi.xyz/notifications/v1/notifications/123
      title: NotificationLinks
      properties:
        schemaId:
          type: string
          description: |
            Notification Schema identifier generated after registering it to the
            Trusted Schemas Registry.
          example: notification-001
        type:
          type: array
          description: |
            Notification type that corresponds to the Notifications type that is
            included as data.
          example:
            - Notification
            - StoreVerifiableCredential
          uniqueItems: true
          items:
            type: string
        "@context":
          description: |
            An ordered set where the first item is a URI https://www.w3.org/2018/credentials/v1. It
            is used to define terms and help to express specific identifiers in a compact manner.
          items:
            type: string
          uniqueItems: true
          example:
            - https://www.w3.org/2018/credentials/v1
          type: array
        from:
          type: string
          description: Sender's Decentralized Identifier
          example: did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
        to:
          type: string
          description: Recipient's Decentralized Identifier
          example: did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
        issuanceDate:
          type: string
          description: |
            Date and time at which the information associated with the notification becomes valid.
          format: date-time
          example: "2010-01-01T19:23:24Z"
        expirationDate:
          type: string
          format: date-time
          example: "2020-01-01T19:23:24Z"
          description: Date and time at which a notification ceases to be valid.
        payload:
          type: object
          format: application/json
          description: "Any valid JSON. Size limit: 1MB"
        proof:
          $ref: "#/components/schemas/embeddedProof"
        _links:
          $ref: "#/components/schemas/_links"
      required:
        - schemaId
        - type
        - "@context"
        - from
        - to
        - issuanceDate
        - payload
        - proof
        - _links
    _links:
      title: _links
      type: object
      properties:
        self:
          type: object
          properties:
            href:
              type: string
              description: URI to the specific notification with its id
              example: https://api.ebsi.xyz/notifications/v1/notifications/123
          required:
            - href
      required:
        - self
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
    Forbidden:
      value:
        title: Forbidden
        status: 403
        detail: Forbidden.
    Unauthorized:
      value:
        title: Unauthorized
