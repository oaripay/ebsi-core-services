                Invalid {id} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The {id} parameter is not valid
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
