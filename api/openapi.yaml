  /trusted-ledgers-smart-contracts-registry/v1/ledgers/{ledgerInfoId}:
    get:
      tags:
        - Trusted Ledgers & Smart Contracts Registry API
      summary: Get ledger info by its ID
      description: Returns a trusted ledger info by its ID
      operationId: get-trusted-ledgers-smart-contracts-registry-v1-ledger
      parameters:
        - name: ledgerInfoId
          in: path
          schema:
            type: string
          examples:
            "[test] ledgerInfoId":
              description: valid test ledgerInfoId
              value: "0x50c4e3d7e0e9c588c0ab7b72747b10bdeab48efa9e375bf9e9b67fe91a0c64f2"
            "[pilot] ledgerInfoId":
              description: valid preprod ledgerInfoId
              value: "0xc981798c566a266b48cfd0d7684a4a00ce8d9d9d770aa7614ff0f7cc724e0a57"
          required: true
      responses:
        200:
          description: Success
          content:
            application/ld+json:
              schema:
                type: object
              examples:
                Success:
                  value:
                    "@context": ebsi.eu
                    name: EBSI-Ethereum
                    type: ledger
                    status: active
                    protocol: eth
        400:
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {ledgerInfoId} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {ledgerInfoId} parameter is not valid
        404:
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                LedgerInfo Not Found:
                  $ref: "#/components/examples/NotFound"
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
