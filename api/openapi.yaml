openapi: 3.0.3
info:
  title: Trusted Policies Registry API
  version: 1.0.0
  description: |
    Trusted Policies Registry API provides an interface to interact with policies stored at the ledger administrated by Policies Registry Smart Contract.
  termsOfService: /docs/terms
  contact:
    name: EBSI Support – Service Desk
    url: https://ec.europa.eu/cefdigital/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
paths:
  /trusted-policies-registry/v1/policies:
    get:
      tags:
        - Trusted Policies Registry API
      summary: Get list of policies
      description: Returns list of policies registered in the blockchain.
      operationId: get-policies
      security:
        - bearerAuth: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to policies
                  items:
                    type: array
                    description: List of policies
                    items:
                      type: object
                      properties:
                        policyId:
                          type: string
                          description: ID of the policy
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                "[test] Success":
                  value:
                    self: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies?page[after]=3&page[size]=2
                    items:
                      - policyId: "0"
                        href: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies/0
                      - policyId: "1"
                        href: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies/1
                    total: 124
                    pageSize: 2
                    links:
                      first: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies?page[after]=1&page[size]=2
                      prev: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies?page[after]=2&page[size]=2
                      next: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies?page[after]=4&page[size]=2
                      last: https://api.test.intebsi.xyz/trusted-policies-registry/v1/policies?page[after]=62&page[size]=2
                "[pilot] Success":
                  value:
                    self: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies?page[after]=3&page[size]=2
                    items:
                      - policyId: "0"
                        href: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies/0
                      - policyId: "1"
                        href: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies/1
                    total: 124
                    pageSize: 2
                    links:
                      first: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies?page[after]=1&page[size]=2
                      prev: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies?page[after]=2&page[size]=2
                      next: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies?page[after]=4&page[size]=2
                      last: https://api.preprod.ebsi.eu/trusted-policies-registry/v1/policies?page[after]=62&page[size]=2
        400:
          $ref: "#/components/responses/400"
        500:
          $ref: "#/components/responses/500"
components:
  schemas:
    Links:
      title: Links
      type: object
      description: Links model used for pagination.
      properties:
        first:
          type: string
          description: Hyperlink to the first page.
        prev:
          type: string
          description: Hyperlink to the previous page.
        next:
          type: string
          description: Hyperlink to the next page.
        last:
          type: string
          description: Hyperlink to the last page.
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem. It may or may
            not yield further information if dereferenced.
  responses:
    400:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            Bad Request:
              $ref: "#/components/examples/BadRequest"
    500:
      description: Internal Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            Internal Server Error:
              $ref: "#/components/examples/InternalError"
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
    InternalError:
      value:
        title: Internal Server Error
        status: 500
        detail: The server encountered an internal error and was unable to process your request.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.preprod.ebsi.eu"
    description: EBSI Pre-production Environment
  - url: "https://api.ebsi.eu"
    description: EBSI Production Environment
  - url: "https://conformance.ebsi.eu"
    description: EBSI Conformance Environment
