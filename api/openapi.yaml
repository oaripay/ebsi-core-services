openapi: 3.0.3
info:
  title: Authorisation API
  description: |
    Authorisation service is an EBSI core service that manages the user,
    legal entities and component authentication.
  version: 1.0.0
  termsOfService: "/docs/terms"
  contact:
    name: "EBSI Support"
    url: "https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi"
  license:
    name: "EUPL-1.2"
    url: "https://joinup.ec.europa.eu/page/eupl-text-11-12"
servers:
  - url: "https://api.ebsi.xyz"
    description: EBSI Testing Environment
tags:
  - name: Authorisation API
    description: Manage EBSI User, Legal Entities and Component Authentication
paths:
  /authorisation/v1/authentication-requests:
    post:
      operationId: post-authorisation-v1-authentication-requests
      tags:
        - Authorisation API
      summary: Authentication Requests
      description: Natural Person and Legal Entities entry point to initiate a SIOP DID Auth Request.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticationRequest"
            examples:
              openid did_authn:
                value:
                  scope: openid did_authn
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationRequestResponse"
              examples:
                Authentication Request:
                  value:
                    uri: openid://?scope=openid%20did_authn&response_type=id_token&client_id=https%3A%2F%2Fapi.test.intebsi.xyz%2Fauthorisation%2Fv1%2Fsiop-sessions&request=eyJraWQiOiJodHRwczovL...
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
                Issuer Not Found:
                  $ref: "#/components/examples/IssuerNotFound"
                Expired Token:
                  $ref: "#/components/examples/ExpiredToken"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /authorisation/v1/siop-sessions:
    post:
      operationId: post-authorisation-v1-siop-sessions
      tags:
        - Authorisation API
      summary: SIOP Sessions
      description:
        Sessions Token endpoint as the callback for DID SIOP Response.
        This endpoint accepts id-token for algorithms ES256K, ES256, RS256, and EdDSA
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SiopSessionsRequest"
            examples:
              SIOP Response:
                value: "id_token=eyJraW..&state=af0ifjsldkj"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ake1SiopResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
                Issuer Not Found:
                  $ref: "#/components/examples/IssuerNotFound"
                Expired Token:
                  $ref: "#/components/examples/ExpiredToken"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /authorisation/v1/oauth2-sessions:
    post:
      operationId: post-authorisation-v1-oauth2-sessions
      tags:
        - Authorisation API
      summary: OAuth2 Sessions Token
      description: Session Token endpoint for Component Authorisation (DID Auth - CCG Flow).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuth2SessionsRequest"
            examples:
              OAuth2 Session Request:
                value:
                  grantType: client_credentials
                  clientAssertionType: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                  clientAssertion: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                  scope: openid did_authn
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ake1Oauth2Response"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
                Issuer Not Found:
                  $ref: "#/components/examples/IssuerNotFound"
                Expired Token:
                  $ref: "#/components/examples/ExpiredToken"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
components:
  schemas:
    AuthenticationRequest:
      title: SIOP Authentication Request
      description: Request to initiate a SIOP authentication process.
      type: object
      properties:
        scope:
          type: string
          description: Scope is used to define the authentication response method.
          example: openid did_authn
      required:
        - scope
    AuthenticationRequestResponse:
      title: SIOP Authentication Request Response
      type: object
      properties:
        uri:
          description: OpenId DID SIOP Uri response.
          type: string
          example: openid://?response_type=id_token&client_id=https%3A%2F%2Fapi.ebsi.zyz%2Fauthorisation%2Fv1%2Faccess-tokens&scope=openid%20did_authn&request=eyJhbGciOiJIUzI1Ni...
      description: DID SIOP OIDC URI
    SiopSessionsRequest:
      title: SIOP Session Request
      type: string
      properties:
        id_token:
          type: string
          description: signed JWT OIDC Id Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        state:
          type: string
          description: Required if it is present in the Authentication Request
          example: "af0ifjsldkj"
      required:
        - id_token
      description: Request for JWT bearer token on a DID SIOP Response.
    Ake1SiopResponse:
      title: SIOP Session Response
      type: object
      properties:
        ake1_enc_payload:
          description: Encrypted payload with user's public key
          type: string
          example: dc3495621fcabdee33fe86...
        ake1_jws_detached:
          description: Detached JWS of AKE1 Signing Payload
          type: string
          example: eyJraWQiOiJodH...
        ake1_sig_payload:
          type: object
          properties:
            ake1_enc_payload:
              description: Encrypted payload with user's public key
              type: string
              example: dc3495621fcabdee33fe86...
            ake1_nonce:
              description: Nonce used during the authentication process
              type: string
              example: 6fSnKv06+4XcZQ==
            did:
              description: User DID
              type: string
              example: did:ebsi:v3Yb4v92ykowMg
            iat:
              description: Issued at
              type: number
              example: 1615883457
            iss:
              description: Issuer (authorisation api)
              type: string
              example: authorisation-api
        did:
          description: API DID
          type: string
          example: did:ebsi:0x404aaa7c731b023e5342e8329b625f2fb9763a26
      description: Ake1 Response for Oauth2 authentication
    OAuth2SessionsRequest:
      title: OAuth2 Session Request
      description: Request for JWT bearer assertion grant.
      type: object
      properties:
        grantType:
          description: |
            'Grant type. Must be set to "client_credentials"'
          type: string
          example: "client_credentials"
        clientAssertionType:
          description: |
            'Client Assertion type. Must be set to "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"'
          type: string
          example: "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
        clientAssertion:
          type: string
          description: Self-signed JWT
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        scope:
          type: string
          description: Scope is used to define the authentication method. Must be set to "openid did_authn"
          example: "openid did_authn"
      required:
        - grantType
        - clientAssertionType
        - clientAssertion
        - scope
    Ake1Oauth2Response:
      title: Oauth2 Session Response
      type: object
      properties:
        ake1_enc_payload:
          description: Encrypted payload with user's public key
          type: string
          example: dc3495621fcabdee33fe86...
        ake1_jws_detached:
          description: Detached JWS of AKE1 Signing Payload
          type: string
          example: eyJraWQiOiJodH...
        ake1_sig_payload:
          type: object
          properties:
            ake1_enc_payload:
              description: Encrypted payload with user's public key
              type: string
              example: dc3495621fcabdee33fe86...
            ake1_nonce:
              description: Nonce used during the authentication process
              type: string
              example: 6fSnKv06+4XcZQ==
            kid:
              description: Trusted App Kid
              type: string
              example: https://api.test.intebsi.xyz/trusted-apps-registry/v2/apps/0xb9f5523a132d9c22c552bf126691a0c9dfa3ba550c8de3e8409c0c21b28e0e99
            iat:
              description: Issued at
              type: number
              example: 1615883457
            iss:
              description: Issuer (authorisation api)
              type: string
              example: authorisation-api
        kid:
          description: API Kid
          type: string
          example: https://api.test.intebsi.xyz/trusted-apps-registry/v2/apps/0xf0c34a721e1bb7606de33a6e44ab30698e8076d7bb5c0b11d108aa52a5de0337
      description: Ake1 Response for Oauth2 authentication
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: "about:blank"
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
    IssuerNotFound:
      value:
        title: Issuer Not Found
        status: 400
        detail: Issuer not found in the trusted apps registry.
    ExpiredToken:
      value:
        title: Token Expired
        status: 400
        detail: The token has expired.
    InternalError:
      value:
        title: Internal Server Error
        status: 500
        detail: The server encountered an internal error and was unable to complete your request.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
