openapi: 3.0.3
info:
  title: Notifications API
  version: 1.0.0
  description: |
    Notifications API is an EBSI core service that helps to send async or delayed notifications by
    addressing the DID of a natural person or legal entity.

    * Notification service can be used by any entity/user registered in the DID registry or
    application registered in the Trusted Applications Registry (TAR).
    * Entity or application is notified via its DID registered in the DID registry or TAR.

    For more information see:
    * [Technical Specifications](https://ec.europa.eu/cefdigital/wiki/display/EBSIDOC/Notifications+API)
    * [Code repository](https://ec.europa.eu/cefdigital/code/projects/EBSI/repos/notifications-api/)
  termsOfService: /docs/terms
  contact:
    name: EBSI Support – Service Desk
    url: https://ec.europa.eu/cefdigital/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
servers:
  - url: http://localhost
    description: Local Computer Environment
  - url: https://api.preprod.ebsi.eu
    description: EBSI Pre-production Environment
  - url: https://api.ebsi.eu
    description: EBSI Production Environment
tags:
  - name: Notifications
    description: Store and retrieve notifications
paths:
  /notifications/v1/notifications:
    post:
      tags:
        - Notifications
      summary: Create a new notification
      description: Creates a new notification and stores it to the Decentralized Storage.
      parameters:
        - $ref: "#/components/parameters/headerConformance"
      operationId: post-notifications-v1-notifications
      security:
        - bearerAuth: []
      requestBody:
        description: |
          Notification Request Input

          [EBSI conformance testing](https://ec.europa.eu/cefdigital/wiki/x/5YDwG) The API supports
          the following EBSI conformance tests:
          * Transfer Verifiable Authorisation (CT V1 ONBOARD_04_B)
          * Request Verifiable Attestation (CT V1 ISSUE_011)
          * Transfer Verifiable Attestation (CT V1 ISSUE_031)
          * Transfer Verifiable Presentation (CT V1 VERIFY_031)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Notification"
            examples:
              New Notification:
                value:
                  schemaId: notification-001
                  type:
                    - Notification
                    - StoreVerifiableCredential
                  "@context":
                    - https://www.w3.org/2018/credentials/v1
                    - https://essif.europa.eu/schemas/vc/2020/v1
                    - https://essif.europa.eu/schemas/notifications/2020/v1
                  from: did:ebsi:zub5ZZUfHLLptCduwEy8xRj
                  to: did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ
                  issuanceDate: "2019-06-22T14:11:44Z"
                  expirationDate: "2019-06-27T14:11:44Z"
                  payload: {}
                  proof:
                    type: EcdsaSecp256k1Signature2019
                    created: "2019-11-17T14:00:00Z"
                    proofPurpose: assertionMethod
                    verificationMethod: did:ebsi:zub5ZZUfHLLptCduwEy8xRj#key-1
                    jws: eyJh..Iw
              ct_ONBOARD_04_B:
                summary: Transfer Verifiable Authorisation  (CT V1 ONBOARD_04_B)
                description: |
                  This is test data for [CT V1 ONBOARD_04_B](https://ec.europa.eu/cefdigital/wiki/display/BLOCKCHAININT/RFC+-+Conformance+testing#RFCConformancetesting-Scenario:ONBOARD).
                  'payload' is a properly formed verifiable Authorisation.
                value:
                  schemaId: notification-001
                  type:
                    - Notification
                    - StoreVerifiableAuthorisation
                  "@context":
                    - https://www.w3.org/2018/credentials/v1
                    - https://essif.europa.eu/schemas/vc/2020/v1
                    - https://essif.europa.eu/schemas/notifications/2020/v1
