                      expirationDate: "2022-04-12T09:44:01Z"
                      "@context":
                        - https://www.w3.org/2018/credentials/v1
                        - https://www.w3.org/2018/credentials/examples/v1
                        - https://w3c-ccg.github.io/lds-jws2020/contexts/lds-jws2020-v1.json
                      type:
                        - VerifiableCredential
                        - VerifiableAuthorisation
                      proof:
                        type: EcdsaSecp256k1Signature2019
                        created: "2021-10-12T09:44:01Z"
                        proofPurpose: assertionMethod
                        verificationMethod: did:ebsi:zwC56DZdiJh8kSxbgg4fMCu#keys-1
                        jws: eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QifQ..XzsjuUGM8Z8iGEn_s9sS4MbsHBxnEmYBvnn3BTc6tUig9e_1FIBPtE8Fgs8UM6HKeHGYOrY-_0rm8vT3zh_X3Q
