      operationId: post-did-registry-v2-jsonrpc
      tags:
        - DID Registry
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions and interaction with
        the ledger (Write operation on ledger).
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method to be invoked. Possible values: 'insertAdministrator',
            'updateAdministrator', 'insertPolicy', 'updatePolicy', 'insertHashAlgorithm',
            'updateHashAlgorithm'
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              Build tx to insertAdministrator:
                value:
                  jsonrpc: "2.0"
                  method: insertAdministrator
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: "did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4"
                      attributeData: "0x68946e6565d6516..."
              Build tx to updateAdministrator (new attribute):
                value:
                  jsonrpc: "2.0"
                  method: updateAdministrator
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4
                      attributeData: "0x68946e6565d6516..."
                  id: 1
              Build tx to updateAdministrator (update attribute):
                value:
                  jsonrpc: "2.0"
                  method: updateAdministrator
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4
                      attributeData: "0x68946e6565d6516..."
                      prevAttributeHash: "0x9045517cc555c75cd7085900a900e6693439086f9eddeee513271fba278964fe"
                  id: 1
              Build tx to insertPolicy:
                value:
                  jsonrpc: "2.0"
                  method: insertPolicy
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: test-policy-1
                      policyData: "0x1234567890..."
                  id: 1
              Build tx to updatePolicy:
                value:
                  jsonrpc: "2.0"
                  method: updatePolicy
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: test-policy-1
                      policyData: "0x1234567890..."
                  id: 1
              Build tx to insertHashAlgorithm:
                value:
                  jsonrpc: "2.0"
                  method: insertHashAlgorithm
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      outputLength: 256
                      ianaName: sha-256
                      oid: "2.16.840.1.101.3.4.2.1"
                      status: 1
                  id: 1
              Build tx to updateHashAlgorithm:
                value:
                  jsonrpc: "2.0"
                  method: updateHashAlgorithm
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      hashAlgorithmId: 3
                      outputLength: 256
                      ianaName: sha-256
                      oid: "2.16.840.1.101.3.4.2.1"
                      status: 2
                  id: 1
              Send Transaction:
                value:
                  jsonrpc: "2.0"
                  method: signedTransaction
                  id: 1
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
                      s: "0x..."
                      v: "0x..."
                      signedRawTransaction: "--- signed raw transaction ---"
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
              examples:
                Build tx:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                      data: "0x0000..."
                      nonce: "0x00"
                      chainId: "0x1b3b"
                      gasLimit: "0x10000"
                      gasPrice: "0x00"
                      value: "0x00"
                Send Transaction:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: "0xe670ec64341771606e55d6b4ca35a1a6b75ee3d5145a99d05921026d1527331"
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
components:
  schemas:
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    Links:
      title: Links
      type: object
      properties:
        last:
          type: string
          description: URI of the last page
        prev:
          type: string
          description: URI of the previous page
        next:
          type: string
          description: URI of the next page
        first:
          type: string
          description: URI of the first page
      description: links model used for pagination
      x-examples:
        Links:
          first: https://api.ebsi.xyz/did-registry/v2/administrators?page[after]=1&page[size]=2
          prev: https://api.ebsi.xyz/did-registry/v2/administrators?page[after]=2&page[size]=2
          next: https://api.ebsi.xyz/did-registry/v2/administrators?page[after]=4&page[size]=2
          last: https://api.ebsi.xyz/did-registry/v2/administrators?page[after]=13&page[size]=2
    Attribute:
      title: Attribute
      type: object
      description: Attribute
      properties:
        hash:
          type: string
          description: sha256 hash of the payload
        body:
          description: Base64 encoded content
    AttributeDetails:
      title: attributeDetails
      type: object
      description: Attribute Details
      properties:
        did:
          type: string
          description: DID of the attribute owner
        attribute:
          $ref: "#/components/schemas/Attribute"
    Administrator:
      title: Administrator
      type: object
      description: Name of the administrator
      properties:
        did:
          type: string
          description: DID of the administrator
        attributes:
          type: array
          description: Array of attributes
          items:
            $ref: "#/components/schemas/Attribute"
    Policy:
      title: Policy
      type: object
      description: Policy data model
      properties:
        policyId:
          type: string
          description: Unique policy ID
        policy:
          type: string
          description: Base64 encoded policy
        hash:
          type: string
          description: Hash (multihash) of the policy
    JsonRpcResponse:
      title: Json Rpc Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly '2.0'
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: object
            - type: string
  examples:
    BadRequest:
      value:
        title: Bad request
        status: 400
        detail: Bad request
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
servers:
  - url: http://localhost
    description: Local Computer Environment
  - url: https://api.ebsi.xyz
    description: EBSI Testing Environment
