                  $ref: "#/components/examples/InternalError"
      security:
        - bearerAuth: []
      operationId: get-notifications-v1-notifications
      parameters:
        - $ref: "#/components/parameters/headerConformance"
        - in: query
          name: page[before]
          schema:
            type: string
          description: |
            Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: page[after]
          schema:
            type: string
          description: |
            Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
