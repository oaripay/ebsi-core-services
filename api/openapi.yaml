                        proofPurpose: assertionMethod
                        verificationMethod: did:ebsi:zwC56DZdiJh8kSxbgg4fMCu#keys-1
                        jws: eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QifQ..XzsjuUGM8Z8iGEn_s9sS4MbsHBxnEmYBvnn3BTc6tUig9e_1FIBPtE8Fgs8UM6HKeHGYOrY-_0rm8vT3zh_X3Q
                  proof:
