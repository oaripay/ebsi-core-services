components:
  schemas:
    AuthenticationRequest:
      title: SIOP Authentication Request
      description: Request to initiate a SIOP authentication process.
      type: object
      properties:
        scope:
          type: string
          description: Scope is used to define the authentication response method.
          example: openid did_authn
      required:
        - scope
    AuthenticationRequestResponse:
      title: SIOP Authentication Request Response
      type: object
      properties:
        uri:
          description: OpenId DID SIOP Uri response.
          type: string
          example: openid://?response_type=id_token&client_id=https%3A%2F%2Fapi.preprod.ebsi.eu%2Fauthorisation%2Fv1%2Fsiop-sessions&scope=openid%20did_authn&nonce=2a6a2e33-fbf8-4a41-95a4-88201ebd9b0f&request=eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QiLCJraWQiOiJodHRwczovL2FwaS5wcmVwcm9kLmVic2kuZXUvdHJ1c3RlZC1hcHBzLXJlZ2lzdHJ5L3YyL2FwcHMvMHgwOGMyNTg1NmZiY2JkZDA3NmM5YzM5NTEyYWJlZjYzMDk3NDk5MTBhMTEwZDlkMWE5YzlhN2QyYjI3N2I2ZDIwIn0..3ET08uTUO8CxdC2H8AhBTvxLMb4yXVn5CxY0gtuexbfCM4EgL4U_FqYGbsApP1iugn9ZUx2v6V_zVcfJVPvZqA
      description: DID SIOP OIDC URI
    SiopSessionsRequest:
      title: SIOP Session Request
      type: object
      properties:
        id_token:
          type: string
          description: signed JWT OIDC Id Token
          example: eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QiLCJraWQiOiJkaWQ6ZWJzaToybWhtMTl0d3RpbHJyd241N2x4c25ocDl6YXlqN2cyYXQxYnFmZ21uam5kayNrZXktMSJ9..1xt0OjtMyuJcC7FGtnVwAYQ16C7fD3uLi9egpOqh2M4ivrxTxYLqPlbvg5463sRNOu9-aAsNfYXvNCzHbiEkow
      required:
        - id_token
      description: Request for JWT bearer token on a DID SIOP Response.
    Ake1SiopResponse:
      title: SIOP Session Response
      type: object
      properties:
        ake1_enc_payload:
          description: Encrypted payload with user's public key
          type: string
          example: 
        ake1_jws_detached:
          description: Detached JWS of AKE1 Signing Payload
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NksiLCJraWQiOiJodHRwczovL2FwaS5wcmVwcm9kLmVic2kuZXUvdHJ1c3RlZC1hcHBzLXJlZ2lzdHJ5L3YyL2FwcHMvMHgwOGMyNTg1NmZiY2JkZDA3NmM5YzM5NTEyYWJlZjYzMDk3NDk5MTBhMTEwZDlkMWE5YzlhN2QyYjI3N2I2ZDIwIn0..hniLWpfw8sxgacyRdXr7en4UrCQoWvsJ72m9bo51x3n5fWSoL7_BdfcHyaEQXCHz_y7iZhRDBxtT1Pw03OiNIQ
        ake1_sig_payload:
          type: object
          properties:
            ake1_enc_payload:
              description: Encrypted payload with user's public key
              type: string
              example: 
            ake1_nonce:
              description: Nonce used during the authentication process
              type: string
              example: 60193434-8319-4f0c-b47a-ad146aa55915
            did:
              description: User DID
              type: string
              example: did:ebsi:zub5ZZUfHLLptCduwEy8xRj
            iat:
              description: Issued at
              type: number
              example: 1627652364
            exp:
              description: Expires
              type: number
              example: 1627653264
            iss:
              description: Issuer (authorisation api)
              type: string
              example: did:ebsi:zwC56DZdiJh8kSxbgg4fMCu
        did:
          description: API DID
          type: string
          example: did:ebsi:zwC56DZdiJh8kSxbgg4fMCu
      description: Ake1 Response for Oauth2 authentication
    OAuth2SessionsRequest:
      title: OAuth2 Session Request
      description: Request for JWT bearer assertion grant.
      type: object
      properties:
        grantType:
          description: |
            'Grant type. Must be set to "client_credentials"'
          type: string
          example: "client_credentials"
        clientAssertionType:
          description: |
            'Client Assertion type. Must be set to "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"'
          type: string
          example: "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
        clientAssertion:
          type: string
          description: Self-signed JWT
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NksiLCJraWQiOiJodHRwczovL2FwaS5wcmVwcm9kLmVic2kuZXUvdHJ1c3RlZC1hcHBzLXJlZ2lzdHJ5L3YyL2FwcHMvMHg3ZGE5MzMwNDhlNzNkOTFmMDE5OTQ0ZTczOGZjYjI4MDEzZjFiZjQzOGFiOTNmYWM2ZDU0NWZiOTM5MmFjMTJlIn0.eyJpYXQiOjE2Mjc2NTI1NDEsImV4cCI6MTYyNzY1MjU1Niwibm9uY2UiOiI0MDFlMGQ4Yi04OWQ1LTRiMDQtYjZmMC02YzgyOGY5Nzk4MzAiLCJqdGkiOiIzYjU4ZGZiYS02MDU2LTRlMmUtOTc1Mi0yYjNhZDhjN2E2YjUiLCJhdWQiOiJsZWRnZXItYXBpIiwic3ViIjoidGVzdC1hcHAyIiwiaXNzIjoidGVzdC1hcHAyIn0.7lIZb1zPgbg832ku-faA8fmMs8K1c2U14zzD1Ge85VjJCraUkmPHJdRmAsPlkoiXs8o6qUroT5Mge6LlFbeg3g
        scope:
          type: string
          description: Scope is used to define the authentication method. Must be set to "openid did_authn"
          example: "openid did_authn"
      required:
        - grantType
        - clientAssertionType
        - clientAssertion
        - scope
    Ake1OAuth2Response:
      title: Oauth2 Session Response
      type: object
      properties:
        ake1_enc_payload:
          description: Encrypted payload with user's public key
          type: string
          example: 
        ake1_jws_detached:
          description: Detached JWS of AKE1 Signing Payload
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NksiLCJraWQiOiJodHRwczovL2FwaS5wcmVwcm9kLmVic2kuZXUvdHJ1c3RlZC1hcHBzLXJlZ2lzdHJ5L3YyL2FwcHMvMHgwOGMyNTg1NmZiY2JkZDA3NmM5YzM5NTEyYWJlZjYzMDk3NDk5MTBhMTEwZDlkMWE5YzlhN2QyYjI3N2I2ZDIwIn0..x3zRsAlgJ3nPyQj24_IPy30rBXMWO7poNG3qITewwe4LGbs-EefgdSKQMVPHWOGKXrgH5pvQ_-IF-nVUIW5H9w
        ake1_sig_payload:
          type: object
          properties:
            ake1_enc_payload:
              description: Encrypted payload with user's public key
              type: string
              example: 
            ake1_nonce:
              description: Nonce used during the authentication process
              type: string
              example: 401e0d8b-89d5-4b04-b6f0-6c828f979830
            kid:
              description: Trusted App Kid
              type: string
              example: https://api.preprod.ebsi.eu/trusted-apps-registry/v2/apps/0x7da933048e73d91f019944e738fcb28013f1bf438ab93fac6d545fb9392ac12e
            iat:
              description: Issued at
              type: number
              example: 1627652552
            exp:
              description: Expires
              type: number
              example: 1627653452
            iss:
              description: Issuer (authorisation api)
              type: string
              example: authorisation-api
        kid:
          description: API Kid
          type: string
          example: https://api.preprod.ebsi.eu/trusted-apps-registry/v2/apps/0x08c25856fbcbdd076c9c39512abef6309749910a110d9d1a9c9a7d2b277b6d20
      description: Ake1 Response for Oauth2 authentication
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: "about:blank"
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
    IssuerNotFound:
      value:
        title: Issuer Not Found
        status: 400
        detail: Issuer not found in the trusted apps registry.
    ExpiredToken:
      value:
        title: Token Expired
        status: 400
        detail: The token has expired.
    InternalError:
      value:
        title: Internal Server Error
        status: 500
        detail: The server encountered an internal error and was unable to complete your request.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
