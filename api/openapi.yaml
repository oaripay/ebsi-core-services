    Notification:
      type: object
      description: Notification
      example:
        schemaId: notification-001
        type:
          - Notification
          - StoreVerifiableCredential
        "@context":
          - https://www.w3.org/2018/credentials/v1
          - https://essif.europa.eu/schemas/vc/2020/v1
          - https://essif.europa.eu/schemas/notifications/2020/v1
        from: did:ebsi:zub5ZZUfHLLptCduwEy8xRj
        to: did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ
        issuanceDate: "2019-06-22T14:11:44Z"
        expirationDate: "2019-06-27T14:11:44Z"
        payload: {}
        proof:
          type: EcdsaSecp256k1Signature2019
          created: "2019-11-17T14:00:00Z"
          proofPurpose: assertionMethod
          verificationMethod: did:ebsi:zub5ZZUfHLLptCduwEy8xRj#key-1
          jws: eyJh..Iw
      title: Notification
      properties:
        schemaId:
          type: string
          description: |
            Notification Schema identifier generated after registering it to the Trusted Schemas
            Registry.
          example: notification-001
        type:
          type: array
          description: |
            Notification type that corresponds to the Notifications type that is included as data.
          example:
            - Notification
            - StoreVerifiableCredential
          uniqueItems: true
          items:
            type: string
        "@context":
          description: |
            An ordered set where the first item is a URI https://www.w3.org/2018/credentials/v1. It
            is used to define terms and help to express specific identifiers in a compact manner.
          items:
            type: string
          uniqueItems: true
          example:
            - https://www.w3.org/2018/credentials/v1
          type: array
        from:
          type: string
          description: Sender's Decentralized Identifier
          example: did:ebsi:zub5ZZUfHLLptCduwEy8xRj
        to:
          type: string
          description: Recipient's Decentralized Identifier
          example: did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ
        issuanceDate:
          type: string
          description: |
            Date and time at which the information associated with the notification becomes valid.
          format: date-time
          example: "2010-01-01T19:23:24Z"
        expirationDate:
          type: string
          format: date-time
          example: "2020-01-01T19:23:24Z"
          description: Date and time at which a notification ceases to be valid.
        payload:
          type: object
          format: application/json
          description: "Any valid JSON. Size limit: 1MB"
          example: "{}"
        proof:
          $ref: "#/components/schemas/embeddedProof"
      required:
        - schemaId
        - type
        - "@context"
        - from
        - to
        - issuanceDate
        - payload
        - proof
    embeddedProof:
      title: Embedded Proof
      type: object
      description: |
        Cryptographic proofs that can be used to detect tampering and verify the authorship of a
        notification. An embedded proof is a mechanism where the proof is included in the data,
        such as a Linked Data Signature.
      properties:
        type:
          type: string
          description: Type of the object or the datatype of the typed value.
          example: EcdsaSecp256k1Signature2019
        created:
          type: string
          description: Date and time at which proof has been created.
          format: date-time
          example: "2019-11-17T09:00:00Z"
        proofPurpose:
          type: string
          description: |
            It expresses the purpose of the proof and ensures the information is protected by the
            signature.
          example: assertionMethod
        verificationMethod:
          type: string
          description: |
            Specifies the public key that can be used to verify the digital signature.

            Dereferencing a public key URL reveals information about the controller of the key,
            which can be checked against the issuer of the credential.
          example: did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ#key-1
        jws:
          type: string
          description: JSON Web Signature
          example: eyJhbGciOiJFUzI1NksifQ.eyJzdWIiOiJFQlNJIDIwMTkifQ.oggE3ft3kJYPGGa9eBibpbjgeJXw4fLbVMouVoM2NfcDxsl_UUUIarsS1VpBoYEs7s9cBlc4uC0EbnJCHfVJIw
      required:
        - type
        - created
        - proofPurpose
        - verificationMethod
        - jws
      example:
        type: RsaSignature2018
        created: "2018-06-18T21:19:10Z"
        proofPurpose: assertionMethod
        verificationMethod: https://example.com/jdoe/keys/1
        jws: eyJhbGciOiJQUzI1NiIsImI2NCI..
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide
            human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem. It may or may
            not yield further information if dereferenced.
    Links:
