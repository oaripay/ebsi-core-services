openapi: 3.0.3
info:
  title: Trusted Issuers Registry API
  description: |
    Trusted Issuers Registry API is a Core Service of the EBSI platform verifying if a legal entity
    is authorized to issue a W3C Verifiable Credential.
  version: 2.0.0
  termsOfService: /docs/terms
  contact:
    name: EBSI Support
    url: https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
tags:
  - name: Trusted Issuers Registry
    description: List and verify trusted issuers
paths:
  /trusted-issuers-registry/v2/administrators:
    get:
      tags:
        - Trusted Issuers Registry
      operationId: get-trusted-issuers-registry-v2-administrators
      summary: List of trusted administrators
      description: Returns a list of trusted administrators
      parameters:
        - in: query
          name: page[before]
          schema:
            type: string
          description: Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to administrators
                  items:
                    type: array
                    description: List of administrators
                    items:
                      type: object
                      properties:
                        did:
                          type: string
                          description: DID of the administrator
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/links"
              examples:
                Success:
                  value:
                    self: https://api.ebsi.xyz/trusted-issuers-registry/v2/administrators?page[after]=3&page[size]=10
                    items:
                      - did: did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
                        href: https://api.ebsi.xyz/trusted-issuers-registry/v2/administrators/did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
                      - did: did:ebsi:0x454253492d52554c45532d4d414c494e41524148
                        href: https://api.ebsi.xyz/trusted-issuers-registry/v2/administrators/did:ebsi:0x454253492d52554c45532d4d414c494e41524148
                    total: 124
                    pageSize: 10
                    links:
                      first: https://api.ebsi.xyz/trusted-issuers-registry/v2/administrators?page[after]=1&page[size]=10
                      prev: https://api.ebsi.xyz/trusted-issuers-registry/v2/administrators?page[after]=2&page[size]=10
                      next: https://api.ebsi.xyz/trusted-issuers-registry/v2/administrators?page[after]=4&page[size]=10
                      last: https://api.ebsi.xyz/trusted-issuers-registry/v2/administrators?page[after]=13&page[size]=10
        "400":
          description: Bad Request Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Paging Request:
                  value:
                    title: Bad Paging Request
                    status: 400
                    detail: PageSize should not be greater than 50
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /trusted-issuers-registry/v2/administrators/{did}:
    get:
      tags:
        - Trusted Issuers Registry
      operationId: get-trusted-issuers-registry-v2-administrators-did
      summary: Get administrator by its Decentralized Identifier
      description: Returns a trusted administrator by its decentralized identifier
      parameters:
        - name: did
          in: path
          schema:
            type: string
          example: did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/administrator"
              examples:
                Success:
                  value:
                    did: did:ebsi:0x464190367BE948210608a46847bed183607f685A
                    attributes:
                      - hash: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                        body: eyJhbnkiOiJBbnkgYXR0cmlidXRlIGhlcmUiLCJ0eXBlIjoiY3JlZGVudGlhbCIsImRhdGEiOiI2ZDdlNWUxZjJlYmExZDU2ZTJmZThlZjdiMTZmNGRlNSJ9
        "400":
          description: Bad Request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {did} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {did} parameter is not valid
        "404":
          description: Not found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                DID Not Found:
                  $ref: "#/components/examples/NotFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
