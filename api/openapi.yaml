openapi: 3.0.3
info:
  title: Identity Hub API
  description: Identity Hub API is a Core Service of the EBSI platform providing the capability of securely storing W3C Verifiable Credentials/Attestations.
  version: 1.0.0
  termsOfService: "/docs/terms"
  contact:
    name: "EBSI Support"
    url: "https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi"
  license:
    name: "EUPL-1.2"
    url: "https://joinup.ec.europa.eu/page/eupl-text-11-12"
servers:
  - url: "http://localhost:9000"
    description: Local Computer Environment
  - url: "https://api.ebsi.xyz"
    description: EBSI Testing Environment
tags:
  - name: Authentication
    description: Authenticate to the Identity Hub
  - name: Identity Hub
    description: Store and retrieve personal credentials
paths:
  /identity-hub/v1/sessions:
    post:
      tags:
        - Authentication
      summary: Login to Identity Hub.
      description: Login to Identity Hub.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionsRequest"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
                Token Expired:
                  $ref: "#/components/examples/ExpiredToken"
                Issuer Not Found:
                  $ref: "#/components/examples/IssuerNotFound"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      operationId: post-identity-hub-v1-sessions
  "/identity-hub/v1/attributes":
    get:
      tags:
        - Identity Hub
      summary: Get attributes.
      description: "Retrieves attributes from the ID Hub."
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attribute"
                  links:
                    $ref: "#/components/schemas/Links"
                  pageSize:
                    type: integer
                    description: number of items to be return per page
                  total:
                    type: integer
                    description: " total number of pages in a collection"
              examples:
                Get Attributes:
                  value:
                    items:
                      - id: cred-7ee0d94aab0e4f36eae85127056de084
                        type:
                          - VerifiableCredential
                          - EssifVerifiableID
                        name: Verifiable ID
                        did: "did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e"
                        hash: "0x7ee0d94aab0e4f36eae85127056de08433591304a83ff8801bb9212b624f1321"
                        data:
                          base64: "<bytes for base64>"
                      - id: cred-7ee0d94aab0e4f36eae85127056de084
                        type:
                          - VerifiableCredential
                          - EssifVerifiableID
                        name: Verifiable ID
                        did: "did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e"
                        hash: "0x7ee0d94aab0e4f36eae85127056de08433591304a83ff8801bb9212b624f1321"
                        data:
                          base64: "<bytes for base64>"
                    total: 13
                    pageSize: 2
                    links:
                      first: "/identity-hub/v1/attributes?page[after]=0&page[size]=2"
                      prev: "/identity-hub/v1/attributes?page[after]=2&page[size]=2"
                      next: "/identity-hub/v1/attributes?page[after]=4&page[size]=2"
                      last: "/identity-hub/v1/attributes?page[after]=13&page[size]=2"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {did, type} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: "The format of {did, type} parameter is not valid"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Forbidden:
                  $ref: "#/components/examples/Forbidden"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      security:
        - bearerAuth: []
      operationId: get-identity-hub-v1-attributes-did-type
      parameters:
        - name: did
          in: query
          schema:
            type: string
            example: "did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e"
          required: true
          description: Decentralized Identifier
        - name: type
          in: query
          schema:
            type: string
            example: "%5B%22EssifVerifiableID%22%2C%22EuropassDiploma%22%5D"
          description: Attributes types. They must be url-encoded
          required: false
        - in: query
          name: "page[before]"
          schema:
            type: string
          description: Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: "page[after]"
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: "page[size]"
          description: Defines the maximum number of objects that may be returned.
  "/identity-hub/v1/attributes/{hash}":
    put:
      tags:
        - Identity Hub
      summary: Store attributes.
      description: "Stores an attribute to the ID Hub."
      requestBody:
        description: Verifiable Identity attribute.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeRequest"
            examples:
              New Attribute:
                value:
                  id: cred-7ee0d94aab0e4f36eae85127056de084
                  type:
                    - VerifiableCredential
                    - EssifVerifiableID
                  name: Verifiable ID
                  data:
                    base64: "<bytes for base64>"
        required: true
      responses:
        "200":
          description: Attribute already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attribute"
              examples:
                Success:
                  value:
                    id: cred-7ee0d94aab0e4f36eae85127056de084
                    type:
                      - VerifiableCredential
                      - EssifVerifiableID
                    name: Verifiable ID
                    did: "did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e"
                    hash: "0x7ee0d94aab0e4f36eae85127056de08433591304a83ff8801bb9212b624f1321"
                    data:
                      base64: "<bytes for base64>"
        "201":
          description: Create a new attribute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attribute"
              examples:
                Created:
                  value:
                    id: cred-7ee0d94aab0e4f36eae85127056de084
                    type:
                      - VerifiableCredential
                      - EssifVerifiableID
                    name: Verifiable ID
                    did: "did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e"
                    hash: "0x7ee0d94aab0e4f36eae85127056de08433591304a83ff8801bb9212b624f1321"
                    data:
                      base64: "<bytes for base64>"
        "400":
          description: Unformatted error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {hash} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: "The {hash} parameter is not valid"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Forbidden:
                  $ref: "#/components/examples/Forbidden"
        "500":
          description: Internal Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      security:
        - bearerAuth: []
      operationId: put-identity-hub-v1-attributes-hash
    parameters:
      - name: hash
        in: path
        schema:
          type: string
          example: "0x7ee0d94aab0e4f36eae85127056de08433591304a83ff8801bb9212b624f1321"
        required: true
        description: Hash of the attribute.
    get:
      tags:
        - Identity Hub
      summary: Get Identity Attribute by its hash
      operationId: get-identity-hub-v1-attributes-hash
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attribute"
              examples:
                Success:
                  value:
                    id: cred-7ee0d94aab0e4f36eae85127056de084
                    type:
                      - VerifiableCredential
                      - EssifVerifiableID
                    name: Verifiable ID
                    did: "did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e"
                    hash: "0x7ee0d94aab0e4f36eae85127056de08433591304a83ff8801bb9212b624f1321"
                    data:
                      base64: "<bytes for base64>"
        "400":
          description: Unformatted error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {hash} parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: "The {hash} parameter is not valid"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Forbidden:
                  $ref: "#/components/examples/Forbidden"
        "404":
          description: Hash does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Not found:
                  value:
                    title: Not Found
                    status: 404
                    detail: "Hash parameter not found"
        "500":
          description: Internal Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      description: Retrieves an attribute by hash.
      security:
        - bearerAuth: []
components:
  schemas:
    Attribute:
      type: object
      description: Identity Attribute
      x-examples:
        Attribute example:
          id: cred-7ee0d94aab0e4f36eae85127056de084
          type:
            - VerifiableCredential
            - EssifVerifiableID
          name: Verifiable ID
          did: "did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e"
          hash: "0x7ee0d94aab0e4f36eae85127056de08433591304a83ff8801bb9212b624f1321"
          data:
            base64: "<bytes for base64>"
      title: Attribute
      properties:
        id:
          type: string
          description: Attribute Metadata identifier generated by ID Hub to later identify it.
          example: cred-7ee0d94aab0e4f36eae85127056de084
        type:
          type: array
          description: Attribute type that corresponds to the Credential type that is included as data.
          example:
            - "VerifiableCredential"
            - "EssifVerifiableID"
          uniqueItems: true
          items:
            type: string
        did:
          type: string
          description: User Decentralized Identifier
          example: "did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e"
        hash:
          type: string
          description: Hash of the attribute.
          example: "0x7ee0d94aab0e4f36eae85127056de08433591304a83ff8801bb9212b624f1321"
        data:
          type: object
          format: date-time
          description: Data object encoded in base64
          required:
            - base64
          properties:
            base64:
              type: string
              format: byte
              description: base64 encoding of the data to be stored.
        name:
          type: string
          description: User defined name to better display the attribute type on Frontend UI.
          example: Verifiable ID
      required:
        - id
        - type
        - hash
        - data
        - name
    AttributeRequest:
      type: object
      description: Identity Attribute request for creation
      x-examples:
        Attribute request example:
          id: cred-7ee0d94aab0e4f36eae85127056de084
          type: "['VerifiableCredential', 'EssifVerifiableID']"
          name: Verifiable ID
          data:
            base64: "<bytes for base64>"
      title: Attribute Request
      properties:
        id:
          type: string
          description: Attribute Metadata identifier generated by ID Hub to later identify it.
          example: cred-7ee0d94aab0e4f36eae85127056de084
        type:
          type: array
          description: Attribute type that corresponds to the Credential type that is included as data.
          example:
            - "VerifiableCredential"
            - "EssifVerifiableID"
          uniqueItems: true
          items:
            type: string
        data:
          type: object
          format: date-time
          description: Data object encoded in base64
          required:
            - base64
          properties:
            base64:
              type: string
              format: byte
              description: base64 encoding of the data to be stored.
        name:
          type: string
          description: User defined name to better display the attribute type on Frontend UI.
          example: Verifiable ID
      required:
        - id
        - type
        - data
        - name
    SessionsRequest:
      description: Request for OAuth 2.0 JWT bearer assertion grant.
      required:
        - grantType
        - assertion
      type: object
      properties:
        grantType:
          description: OAuth 2.0 grant type. Must be set to "urn:ietf:params:oauth:grant-type:jwt-bearer"
          type: string
          example: "urn:ietf:params:oauth:grant-type:jwt-bearer"
        assertion:
          type: string
          description: Self-signed JWT
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    SessionsResponse:
      type: object
      properties:
        accessToken:
          description: Token to access the api
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        tokenType:
          description: Token type
          type: string
          example: Bearer
        expiresIn:
          description: JWT token expiration time in seconds
          type: integer
          example: 900
        issuedAt:
          description: "Time at which the JWT was issued. Format: unix timestamp"
          type: string
          example: "1467841035013"
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: "about:blank"
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    Links:
      title: Links
      type: object
      properties:
        last:
          type: string
          description: " URI of the last page"
        prev:
          type: string
          description: " URI of the previous page"
        next:
          type: string
          description: " URI of the next page"
        first:
          type: string
          description: " URI of the first page"
      description: links model used for pagination
      x-examples:
        links example:
          first: "/identity-hub/v1/attributes?page[after]=0&page[size]=2"
          prev: "/identity-hub/v1/attributes?page[after]=2&page[size]=2"
          next: "/identity-hub/v1/attributes?page[after]=4&page[size]=2"
          last: "/identity-hub/v1/attributes?page[after]=13&page[size]=2"
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
    ExpiredToken:
      value:
        title: Token Expired
        status: 400
        detail: The token has expired.
    Forbidden:
      value:
        title: Forbidden
        status: 403
        detail: Forbidden.
    Unauthorized:
      value:
        title: Unauthorized
        status: 401
        detail: You are not authorized to access the resources.
    IssuerNotFound:
      value:
        title: Issuer Not Found
        status: 400
        detail: Issuer not found in the list of trusted apps.
    InternalError:
      value:
        title: Internal Server Error
        status: 500
        detail: The server encountered an internal error and was unable to complete your request.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
