      operationId: post-did-registry-v2-jsonrpc
      tags:
        - DID Registry
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions and interaction with
        the ledger (Write operation on ledger).
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method to be invoked. Possible values: 'insertAdministrator',
            'updateAdministrator', 'insertPolicy', 'updatePolicy', 'insertHashAlgorithm',
            'updateHashAlgorithm', 'insertDidDocument', 'updateDidDocument', 'insertDidController',
            'updateDidController', 'revokeDidController', 'insertDidMethod', 'updateDidMethod',
            'appendDidDocumentVersionHash', 'detachDidDocumentVersionHash',
            'appendDidDocumentVersionMetadata', 'detachDidDocumentVersionMetadata'
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
