openapi: 3.0.3
info:
  title: Timestamp API
  description: |
    Timestamp API is a Core Service of the EBSI platform providing the
    capability of checking the authenticity of a digital document by
    verifying the presence and the timestamp of the document's hash
    in a specific smart contract.
  version: 2.0.0
  termsOfService: "/docs/terms"
  contact:
    name: "EBSI Support"
    url: "https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi"
  license:
    name: "EUPL-1.2"
    url: "https://joinup.ec.europa.eu/page/eupl-text-11-12"
paths:
  /timestamp/v2/hash-algorithms:
    get:
      tags:
        - Timestamp API
      operationId: get-timestamp-v2-hash-algorithms
      summary: List of hash algorithms
      description: Returns a list of hash algorithms
      parameters:
        - in: query
          name: page[before]
          schema:
            type: string
          description: Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to hash algorithms
                  items:
                    type: array
                    description: List of hash algorithms
                    items:
                      type: object
                      properties:
                        hashAlgorithmId:
                          type: number
                          description: ID of the hash algorithm
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                Success:
                  value:
                    self: https://api.test.ebsi.xyz/timestamp/v2/hash-algorithms?page[after]=3&page[size]=2
                    items:
                      - hashAlgorithmId: 0
                        href: https://api.test.ebsi.xyz/timestamp/v2/hash-algorithms/0
                      - hashAlgorithmId: 1
                        href: https://api.test.ebsi.xyz/timestamp/v2/hash-algorithms/1
                    total: 124
                    pageSize: 2
                    links:
                      first: https://api.test.ebsi.xyz/timestamp/v2/hash-algorithms?page[after]=1&page[size]=2
                      prev: https://api.test.ebsi.xyz/timestamp/v2/hash-algorithms?page[after]=2&page[size]=2
                      next: https://api.test.ebsi.xyz/timestamp/v2/hash-algorithms?page[after]=4&page[size]=2
                      last: https://api.test.ebsi.xyz/timestamp/v2/hash-algorithms?page[after]=62&page[size]=2
        "400":
          description: Bad Request Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Paging Request:
                  value:
                    title: Bad Paging Request
                    status: 400
                    detail: PageSize should not be greater than 50
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  "/timestamp/v2/hash-algorithms/{hashAlgorithmId}":
    get:
      tags:
        - Timestamp API
      operationId: get-timestamp-v2-hash-algorithms-hash-algorithm-id
      summary: Get hash algorithm by its ID
      description: Returns a hash algorithm by its ID
      parameters:
        - name: hashAlgorithmId
          in: path
          schema:
            type: string
          example: "0"
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HashAlgorithm"
              examples:
                Success:
                  value:
                    outputLengthBits: 256
                    ianaName: SHA-256
                    oid: "2.16.840.1.101.3.4.2.1"
                    status: active
        "400":
          description: Bad Request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {hashAlgorithmId} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {hashAlgorithmId} parameter is not valid
        "404":
          description: Not found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Hash algortihm Not Found:
                  $ref: "#/components/examples/NotFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
