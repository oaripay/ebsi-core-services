openapi: 3.0.3
info:
  title: Trusted Schemas Registry API
  version: 1.0.0
  description: |
    Trusted Schemas Registry (TSR) API is an EBSI core service. It enables us to interact with the
    Trusted Schemas Registry Smart Contract to:
    - register a new schema
    - update a registered schema
    - read and validate registered schemas

    EBSI Trusted Schemas Registry is a Domain Specific registry service focusing on registering in
    it only Data Model and Ontology. The registry is agnostic of any type of schema (we support
    whatever scheme the consumer needs to anchor, being it JSON, JSON-LD, XML, etc.).

    TSR API is a microservice, hosted on the EBSI infrastructure.

    For more information see:
    * [Technical Specifications](https://ec.europa.eu/digital-building-blocks/wikis/display/EBP/Trusted+Schemas+Registry+API)
    * [Smart Contract Technical Specifications](https://ec.europa.eu/digital-building-blocks/wikis/display/EBP/Trusted+Schemas+Registry+Smart+Contract)
    * [Code Repository](https://ec.europa.eu/digital-building-blocks/code/projects/EBSI/repos/trusted-schemas-registry-api/browse)
    * [Smart Contract Repository](https://ec.europa.eu/digital-building-blocks/code/projects/EBSI/repos/trusted-schemas-registry-ethereum-sc/browse)
  termsOfService: /docs/terms
  contact:
    name: EBSI Support - Service Desk
    url: https://ec.europa.eu/digital-building-blocks/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
paths:
  /trusted-schemas-registry/v1/schemas:
    get:
      operationId: get-trusted-schemas-registry-v1-schemas
      summary: List schemas
      description: Returns a list of schemas.
      tags:
        - Schemas
      parameters:
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: Absolute path to the collection.
                  items:
                    type: array
                    description: List of schemas
                    items:
                      title: Schema links
                      description: Links to schemas as returned by the REST APIs.
                      type: object
                      properties:
                        schemaId:
                          type: string
                          description: Unique schema id (OID or DOI)
                        href:
                          type: string
                          description: Link to the resource.
                  total:
                    type: integer
                    description: Total number of items accross all pages.
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page.
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                "[test] Success":
                  value:
                    self: https://api.test.intebsi.xyz/trusted-schemas-registry/v1/schemas?page[after]=1&page[size]=10
                    items:
                      - schemaId: "0x312e332e362e312e342e312e313636342e31302e3138372e312e322e322e3333"
                        href: https://api.test.intebsi.xyz/trusted-schemas-registry/v1/schemas/0x312e332e362e312e342e312e313636342e31302e3138372e312e322e322e3333
                      - schemaId: "0x312e332e362e312e342e312e313532372e382e3132352e322e312e322e3639"
                        href: https://api.test.intebsi.xyz/trusted-schemas-registry/v1/schemas/0x312e332e362e312e342e312e313532372e382e3132352e322e312e322e3639
                      - schemaId: "0x312e332e362e312e342e312e313730312e372e3130372e322e322e332e3235"
                        href: https://api.test.intebsi.xyz/trusted-schemas-registry/v1/schemas/0x312e332e362e312e342e312e313730312e372e3130372e322e322e332e3235
                      - schemaId: "0x312e332e362e312e342e312e313537362e342e3230352e312e332e332e3530"
                        href: https://api.test.intebsi.xyz/trusted-schemas-registry/v1/schemas/0x312e332e362e312e342e312e313537362e342e3230352e312e332e332e3530
                    total: 4
                    pageSize: 10
                    links:
                      first: https://api.preprod.ebsi.eu/trusted-schemas-registry/v1/schemas?page[after]=1&page[size]=10
                      prev: https://api.preprod.ebsi.eu/trusted-schemas-registry/v1/schemas?page[after]=1&page[size]=10
