components:
  schemas:
    verifiableAttestation:
      title: EBSI Verifiable Attestation
      required:
        - "@context"
        - credentialSchema
        - credentialSubject
        - id
        - issuanceDate
        - issuer
        - proof
        - type
        - validFrom
      type: object
