openapi: 3.0.3
info:
  title: Trusted Apps Registry API
  description: |
    Trusted Apps Registry API is a Core Service of the EBSI platform providing the capability of
    verifying if an application is trusted and authorized to interact with other applications in
    the EBSI network.
  version: 2.0.0
  termsOfService: "/docs/terms"
  contact:
    name: "EBSI Support"
    url: "https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi"
  license:
    name: "EUPL-1.2"
    url: "https://joinup.ec.europa.eu/page/eupl-text-11-12"
tags:
  - name: Trusted Apps Registry
    description: List and verify trusted apps
paths:
  /trusted-apps-registry/v2/administrators:
    get:
      tags:
        - Trusted Apps Registry
      summary: List of trusted administrators
      description: Returns a list of trusted administrators
      operationId: get-trusted-apps-registry-v2-administrators
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: URI to administrators
                  items:
                    type: array
                    description: List of administrators
                    items:
                      type: object
                      properties:
                        did:
                          type: string
                          description: DID of the administrator
                        href:
                          type: string
                          description: Link to the resource
                  total:
                    type: integer
                    description: Total number of items in a collection
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page
                  links:
                    $ref: "#/components/schemas/links"
              examples:
                Success:
                  value:
                    self: https://api.ebsi.xyz/trusted-apps-registry/v2/administrators?page[after]=3&page[size]=10
                    items:
                      - did: did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
                        href: https://api.ebsi.xyz/trusted-apps-registry/v2/administrators/did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
                      - did: did:ebsi:0x454253492d52554c45532d4d414c494e41524148
                        href: https://api.ebsi.xyz/trusted-apps-registry/v2/administrators/did:ebsi:0x454253492d52554c45532d4d414c494e41524148
                    total: 124
                    pageSize: 10
                    links:
                      first: https://api.ebsi.xyz/trusted-apps-registry/v2/administrators?page[after]=1&page[size]=10
                      prev: https://api.ebsi.xyz/trusted-apps-registry/v2/administrators?page[after]=2&page[size]=10
                      next: https://api.ebsi.xyz/trusted-apps-registry/v2/administrators?page[after]=4&page[size]=10
                      last: https://api.ebsi.xyz/trusted-apps-registry/v2/administrators?page[after]=13&page[size]=10
        "400":
          description: Bad Request Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Paging Request:
                  value:
                    title: Bad Paging Request
                    status: 400
                    detail: PageSize should not be greater than 50
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      parameters:
        - in: query
          name: page[before]
          schema:
            type: string
          description: Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
  "/trusted-apps-registry/v2/administrators/{did}":
    get:
      tags:
        - Trusted Apps Registry
      summary: Get administrator by its Decentralized Identifier
      description: Returns a trusted administrator by its decentralized identifier
      operationId: get-trusted-administrator
      parameters:
        - name: did
          in: path
          schema:
            type: string
          example: did:ebsi:0x416e6e6162656c2e4c65652e452d412d506f652e
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/administrator"
              examples:
                Success:
                  value:
                    did: did:ebsi:0x464190367BE948210608a46847bed183607f685A
                    attributes:
                      - hash: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                        body: eyJhbnkiOiJBbnkgYXR0cmlidXRlIGhlcmUiLCJ0eXBlIjoiY3JlZGVudGlhbCIsImRhdGEiOiI2ZDdlNWUxZjJlYmExZDU2ZTJmZThlZjdiMTZmNGRlNSJ9
        "400":
          description: Bad Request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {did} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {did} parameter is not valid
        "404":
          description: Not found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                DID Not Found:
                  $ref: "#/components/examples/NotFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
components:
  schemas:
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      x-examples:
        Not Enough Credit:
          type: https://example.com/probs/out-of-credit
          title: You do not have enough credit.
          detail: Your current balance is 30, but that costs 50.
          instance: /account/12345/msgs/abc
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    links:
      title: Links
      type: object
      properties:
        last:
          type: string
          description: URI of the last page
        prev:
          type: string
          description: URI of the previous page
        next:
          type: string
          description: URI of the next page
        first:
          type: string
          description: URI of the first page
      description: links model used for pagination
      x-examples:
        Links:
          first: https://api.ebsi.xyz/trusted-apps-registry/v2/administrators?page[after]=1&page[size]=2
          prev: https://api.ebsi.xyz/trusted-apps-registry/v2/administrators?page[after]=2&page[size]=2
          next: https://api.ebsi.xyz/trusted-apps-registry/v2/administrators?page[after]=4&page[size]=2
          last: https://api.ebsi.xyz/trusted-apps-registry/v2/administrators?page[after]=13&page[size]=2
    attribute:
      title: Attribute
      type: object
      description: Attribute
      properties:
        hash:
          type: string
          description: sha256 hash of the payload
        body:
          description: Base64 encoded content
    administrator:
      title: Administrator
      type: object
      description: Name of the administrator
      properties:
        did:
          type: string
          description: DID of the administrator
        attributes:
          type: array
          description: Array of attributes
          items:
            $ref: "#/components/schemas/attribute"
  examples:
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
servers:
  - url: http://localhost
    description: Local Computer Environment
  - url: https://api.ebsi.xyz
    description: EBSI Testing Environment
