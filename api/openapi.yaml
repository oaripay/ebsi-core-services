  /trusted-apps-registry/v2/apps/{applicationId}/public-keys/{publicKeyId}:
    get:
      tags:
        - Trusted Apps Registry
      summary: Get public key by its ID
      description: Returns the public key by its ID
      operationId: get-apps-applicationId-public-keys-public-key
      parameters:
        - name: applicationId
          in: path
          schema:
            type: string
          example: "0x123456789012345678901234567890123456789012345678901234"
          required: true
        - name: publicKeyId
          in: path
          schema:
            type: string
          example: "0xfa34567890123456789012345678901234567890123456789012b5"
          required: true
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
                    description: Unique app ID
                  publicKey:
                    type: string
                    description: Public key in base64
                  status:
                    type: string
                    description: Status
                    enum: ["undefined", "active", "revoked", "suspended"]
                  notBefore:
                    description: Date and time before the public key must be considered invalid.
                    type: number
                  notAfter:
                    description: Date and time after the public key must be considered invalid.
                    type: number
              examples:
                Success:
                  value:
                    applicationId: "0x3f571838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0909"
                    publicKey: "LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0t..."
