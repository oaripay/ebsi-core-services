  /did-registry/v2/did-methods/{name}:
    get:
      tags:
        - DID Registry
      summary: Get DID Method by its name
      description: Returns a DID Method by its name
      operationId: get-did-registry-v2-did-method
      parameters:
        - name: name
          in: path
          schema:
            type: string
          example: did:ebsi
          required: true
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DIDMethod"
              examples:
                "[test] Success":
                  value:
                    methodName: did:ebsi
                    ledgerName: EBSI-ethereum
                    methodSpec:
                      - "0x7b226d6574686f644e616d65223a226469643a65627369222c226d6574686f645370656369666963496447656e65726174696f6e223a7b7d2c226d6574686f6453706563696669634964456e636f64696e67223a7b7d2c2276657273696f6e223a317d"
