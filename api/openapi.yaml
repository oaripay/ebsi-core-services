  /trusted-issuers-registry/v2/jsonrpc:
    post:
      tags:
        - Trusted Issuers Registry
      operationId: post-ledger-v2-blockchains-besu
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions for TIR SC operations,
        and interaction with the ledger (Write operation on ledger)
      security:
        - bearerAuth: []
      requestBody:
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method that to be invoked. Possible values: insertIssuer, 
          updateIssuer, insertPolicy, updatePolicy, and sendSignedTransaction.
          - **params**: Array of parameters
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier stablished by the client
                  type: integer
                  example: 1
            examples:
              Build tx to insert issuer:
                description: |
                  Call to build an unsigned transaction to insert a new issuer. This method requires admin rights in the Trusted Policies Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of the issuer to insert
                  - **attributeData**: Attribute data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: insertIssuer
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: did:ebsi:zkFpKw8Q6EJW75cDue7bg17
                      attributeData: "0x7b22616e79223a22416e79206174747269627574652068657265222c2274797065223a2263726564656e7469616c222c2264617461223a223730373634663965353838646438306465343133363261373339646362303133227d"
              Build tx to add a new attribute to an issuer:
                description: |
                  Call to build an unsigned transaction to add a new attribute to an issuer. The issuer can be updated by the own issuer or an admin regitered Trusted Issuers Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of the issuer
                  - **attributeData**: Attribute data to insert. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: updateIssuer
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: did:ebsi:zkFpKw8Q6EJW75cDue7bg17
                      attributeData: "0x7b22616e79223a22416e79206174747269627574652068657265222c2274797065223a2263726564656e7469616c222c2264617461223a223730373634663965353838646438306465343133363261373339646362303133227d"
              Build tx to update an attribute of an issuer:
                description: |
                  Call to build an unsigned transaction to update an attribute of an issuer. The issuer can be updated by the own issuer or an admin regitered Trusted Issuers Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of the issuer
                  - **prevAttributeHash**: Attribute ID to update
                  - **attributeData**: Attribute data to insert. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: updateIssuer
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: did:ebsi:zkFpKw8Q6EJW75cDue7bg17
                      attributeData: "0x7b22616e79223a22416e79206174747269627574652068657265222c2274797065223a2263726564656e7469616c222c2264617461223a223730373634663965353838646438306465343133363261373339646362303133227d"
                      prevAttributeHash: "0x9045517cc555c75cd7085900a900e6693439086f9eddeee513271fba278964fe"
              Build tx to insert a policy:
                description: |
                  Call to build an unsigned transaction to insert a policy in the registry. This method requires admin rights in the Trusted Policies Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **policyId**: Policy Id
                  - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: insertPolicy
                  id: 1
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      policyId: my-policy
                      policyData: "0x7b22706f6c696379223a22396361663735323733373936353135656465613631323165227d"
              Build tx to update a policy:
                description: |
                  Call to build an unsigned transaction to update a policy. This method requires admin rights in the Trusted Policies Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **policyId**: Policy Id
                  - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updatePolicy
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: test-policy-1
                      policyData: "0x1234567890..."
              Send Transaction:
                description: Call to send a signed transaction to the blockchain.
                value:
                  jsonrpc: "2.0"
                  method: sendSignedTransaction
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
                      s: "0x..."
                      v: "0x..."
                      signedRawTransaction: "--- signed raw transaction ---"
                  id: 1
              Send Transaction (DEPRECATED):
                description: |
                  THIS METHOD IS DEPRECATED! Use "sendSignedTransaction" instead.
                  Call to send a signed transaction to the blockchain.
                value:
                  jsonrpc: "2.0"
                  method: signedTransaction
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
                      s: "0x..."
                      v: "0x..."
                      signedRawTransaction: "--- signed raw transaction ---"
                  id: 1
        required: true
      responses:
        "200":
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
              examples:
                Build tx:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                      data: "0x0000..."
                      nonce: "0x00"
                      chainId: "0x1b3b"
                      gasLimit: "0x10000"
                      gasPrice: "0x00"
                      value: "0x00"
                Send Transaction:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: "0xe670ec64341771606e55d6b4ca35a1a6b75ee3d5145a99d05921026d1527331"
        400:
          description: Bad request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
                Invalid Token:
                  $ref: "#/components/examples/InvalidToken"
components:
  schemas:
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      x-examples:
        Not Enough Credit:
          type: https://example.com/probs/out-of-credit
          title: You do not have enough credit.
          detail: Your current balance is 30, but that costs 50.
          instance: /account/12345/msgs/abc
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    links:
      title: Links
      type: object
      properties:
        last:
          type: string
          description: URI of the last page
        prev:
          type: string
          description: URI of the previous page
        next:
          type: string
          description: URI of the next page
        first:
          type: string
          description: URI of the first page
      description: links model used for pagination
      x-examples:
        Links:
          first: https://api.preprod.ebsi.eu/trusted-issuers-registry/v2/issuers?page[after]=1&page[size]=2
          prev: https://api.preprod.ebsi.eu/trusted-issuers-registry/v2/issuers?page[after]=2&page[size]=2
          next: https://api.preprod.ebsi.eu/trusted-issuers-registry/v2/issuers?page[after]=4&page[size]=2
          last: https://api.preprod.ebsi.eu/trusted-issuers-registry/v2/issuers?page[after]=13&page[size]=2
    JsonRpcResponse:
      title: JSON-RPC Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly '2.0'
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: object
            - type: string
    issuer:
      title: Issuer
      type: object
      description: Name of the issuer
      properties:
        did:
          type: string
          description: did of the issuer
        attributes:
          type: array
          description: Array of attributes
          items:
            $ref: "#/components/schemas/attribute"
    attribute:
      title: Attribute
      type: object
      description: Attribute
      properties:
        hash:
          type: string
          description: sha256 hash of the payload
        body:
          description: Base64 encoded content
    attributeDetails:
      title: attributeDetails
      type: object
      description: Attribute Details
      properties:
        did:
          type: string
          description: DID of the attribute owner
        attribute:
          $ref: "#/components/schemas/attribute"
    policy:
      title: Policy
      type: object
      description: Policy data model
      properties:
        policyId:
          type: string
          description: Unique policy ID
        policy:
          type: string
          description: Base64 encoded policy
