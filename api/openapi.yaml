  /trusted-schemas-registry/v1/jsonrpc:
    post:
      operationId: post-trusted-schemas-registry-v1-jsonrpc
      summary: JSON-RPC API
      description: |
        The JSON-RPC API provides methods assisting the construction of blockchain transactions and
        interaction with the ledger.
      tags:
        - JSON-RPC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: must be exactly "2.0"
          - **method**: method to be invoked
          - **params**: method parameters
          - **id**: identifier established by the client

          ### API Methods

          #### insertSchema

          Call to build an unsigned transaction to insert a new schema. This method requires having right attributes assigned in Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the sender
          - **schemaId**: DOI/OID converted into hex string
          - **schema**: Content. This field must be a JSON stringified and converted into hex string
          - **metadata**: Metadata of the first version. This field must be a JSON stringified and converted into hex string

          #### updateSchema

          Call to build an unsigned transaction to update an schema. This method requires having right attributes assigned in Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the sender
          - **schemaId**: Schema ID
          - **schema**: Content. This field must be a JSON stringified and converted into hex string
          - **metadata**: Metadata. This field must be a JSON stringified and converted into hex string

          #### updateMetadata

          Call to build an unsigned transaction to update the metadata of a schema revision. This method requires having right attributes assigned in Trusted Policies Registry.

          Parameters:
          - **from**: Ethereum address of the sender
          - **schemaRevisionId**: Schema revision ID
          - **metadata**: Metadata. This field must be a JSON stringified and converted into hex string

          #### insertPolicy

          Call to build an unsigned transaction to insert a policy in the registry. 

          Parameters:
          - **from**: Ethereum address of the sender
          - **policyId**: Policy Id
          - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string

          #### updatePolicy

          Call to build an unsigned transaction to update a policy.

          Parameters:
          - **from**: Ethereum address of the sender
            - **policyId**: Policy Id
            - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string

          #### sendSignedTransaction

          Call to send a signed transaction to the blockchain.
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly "2.0"
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              Build tx to insertSchema:
                value:
                  jsonrpc: "2.0"
                  method: insertSchema
                  id: 1
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      schemaId: "0x312e332e362e312e342e312e3339312e31302e3132302e322e332e312e3734"
                      schema: "0x7b2240636f6e74657874223a2268747470733a2f2f656273692e6575222c2274797065223a22536368656d61222c226e616d65223a226578616d706c65222c2264617461223a223065346637383664343036613330643339343438633563613232343562316130227d"
                      metadata: "0x7b226d657461223a2276616c7565222c2264617461223a223536323930303863363738383536346164653165353266383635623864366535222c2276616c696446726f6d223a22323032312d30382d30325430393a31323a30342e3230365a222c2276616c6964546f223a22323032312d30382d30325430393a31383a30342e3230365a227d"
              Build tx to updateSchema:
                value:
                  jsonrpc: "2.0"
                  method: updateSchema
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      schemaId: "{ hex-encoded oid or doi }"
                      schema: "0x227b2240636f6e74657874223a2268747470733a2f2f656273692e6575222c2274797065223a22536368656d61222c226e616d65223a226578616d706c65227d22"
                      metadata: "0x227b226d657461223a2276616c7565227d22"
              Build tx to updateMetadata:
                value:
                  jsonrpc: "2.0"
                  method: updateMetadata
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      schemaRevisionId: "0x3f571838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0909"
                      metadata: "0x227b226d657461223a2276616c7565227d22"
              Build tx to insertPolicy:
                value:
                  jsonrpc: "2.0"
                  method: insertPolicy
                  id: 1
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      policyId: my-policy
                      policyData: "0x7b22706f6c696379223a22396361663735323733373936353135656465613631323165227d"
              Build tx to updatePolicy:
                value:
                  jsonrpc: "2.0"
                  method: updatePolicy
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: test-policy-1
                      policyData: "0x1234567890..."
              Send Transaction:
                description: Call to send a signed transaction to the blockchain.
                value:
                  jsonrpc: "2.0"
                  method: sendSignedTransaction
                  id: 1
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
