                    jws: eyJh..Iw
              ct_ISSUE_011:
                summary: Request Verifiable Attestation  (CT V1 ISSUE_011)
                description: |
                  This is test data for [CT V1 ISSUE_011](https://ec.europa.eu/cefdigital/wiki/display/BLOCKCHAININT/RFC+-+Conformance+testing#RFCConformancetesting-Scenario:ISSUE).
                  'payload' is a properly formed verifiable Attestation request.
                value:
                  schemaId: notification-001
                  type:
                    - Notification
