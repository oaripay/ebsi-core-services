  /trusted-apps-registry/v2/jsonrpc:
    post:
      operationId: post-ledger-v2-blockchains-besu
      tags:
        - Trusted Apps Registry
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions for TAR SC operations,
        and interaction with the ledger (Write operation on ledger)
      security:
        - bearerAuth: []
      requestBody:
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method that to be invoked. Possible values: deleteAppAdministrator,
          insertAdministrator, insertApp, insertAppAdministrator, insertAppInfo,
          insertAppPublicKey, insertAuthorization, insertPolicy, insertRevocation,
          sendSignedTransaction, updateAdministrator, updateApp, updateAppPublicKey,
          updateAuthorization, and updatePolicy.
          - **params**: Array of parameters
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier stablished by the client
                  type: integer
                  example: 1
            examples:
              Build tx to deleteAppAdministrator:
                description: |
                  Call to build an unsigned transaction to delete an app administrator. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **applicationId**: Application ID
                  - **administratorId**: DID of app administrator
                value:
                  jsonrpc: "2.0"
                  method: deleteAppAdministrator
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      applicationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      administratorId: "did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ"
                  id: 1
              Build tx to insertAdministrator:
                description: |
                  Call to build an unsigned transaction to insert a new administrator in the registry. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of new administrator
                  - **attributeData**: Attribute data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: insertAdministrator
                  id: 1
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      did: did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ
                      attributeData: "0x7b2261646d696e223a22306139393338616431616538623865323932613961336536227d"
              Build tx to insertApp:
                description: |
                  Call to build an unsigned transaction to insert an App. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **name**: Name of the app
                  - **domain**: Domain. 1 (ebsi) or 2 (external)
                  - **appAdministrator**: DID of the app administrator
                  - **publicKey**: Public key. Insert the hex string representation of PEM string.
                  - **status**: Status. 1 (active), 2 (revoked), or 3 (suspended)
                  - **notBefore**: Point in time when the public key becomes valid. It should be defined in epoch time.
                  - **notAfter**: Point in time when the public key becomes invalid. It should be defined in epoch time.
                value:
                  jsonrpc: "2.0"
                  method: insertApp
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      name: "my app"
                      domain: 1
                      appAdministrator: "did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ"
                      publicKey: "0x219846541f63165e651651ca231..."
                      status: 1
                      notBefore: 1609926740
                      notAfter: 1709926740
                  id: 1
              Build tx to insertAppAdministrator:
                description: |
                  Call to build an unsigned transaction to insert an app administrator. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **applicationId**: Application ID.
                  - **administratorId**: DID of the app administrator to add
                value:
                  jsonrpc: "2.0"
                  method: insertAppAdministrator
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      applicationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      administratorId: "did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ"
                  id: 1
              Build tx to insertAppInfo:
                description: |
                  Call to build an unsigned transaction to insert app info. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **applicationId**: Application ID.
                  - **info**: Info. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: insertAppInfo
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      applicationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      info: "0x7b2261646d696e223a22306139393338616431616538623865323932613961336536227d"
                  id: 1
              Build tx to insertAppPublicKey:
                description: |
                  Call to build an unsigned transaction to insert a public key. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **applicationId**: Application ID
                  - **publicKey**: Public key. Insert the hex string representation of PEM string.
                  - **status**: Status. 1 (active), 2 (revoked), or 3 (suspended)
                  - **notBefore**: Point in time when the public key becomes valid. It should be defined in epoch time.
                  - **notAfter**: Point in time when the public key becomes invalid. It should be defined in epoch time.
                value:
                  jsonrpc: "2.0"
                  method: insertAppPublicKey
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      applicationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      publicKey: "0x219846541f63165e651651ca231..."
                      status: 2
                      notBefore: 1609926740
                      notAfter: 1709926740
                  id: 1
              Build tx to insertAuthorization:
                description: |
                  Call to build an unsigned transaction to insert an authorisation. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **name**: Application name
                  - **authorizedAppName**: Authorized app name
                  - **iss**: Administrator did
                  - **status**: Status. 1 (active), 2 (revoked), or 3 (suspended)
                  - **permissions**: CRUD permissions. It must be a number between 0 and 15 (default). It's binary representation enables or disables each one of the 4 CRUD permissions (create, read, update, delete).
                  - **notBefore**: Point in time when the authorisation becomes valid. It should be defined in epoch time.
                  - **notAfter**: Point in time when the authorisation becomes invalid. It should be defined in epoch time.
                value:
                  jsonrpc: "2.0"
                  method: insertAuthorization
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      name: "app1"
                      authorizedAppName: "app2"
                      iss: "did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ"
                      status: 1
                      permissions: 15
                      notBefore: 1609926740
                      notAfter: 1709926740
                  id: 1
              Build tx to insert a policy:
                description: |
                  Call to build an unsigned transaction to insert a policy in the registry. This method requires admin rights in the Trusted Apps Registry.

                   Parameters:
                   - **from**: Ethereum address of the administrator
                   - **policyId**: Policy Id
                   - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: insertPolicy
                  id: 1
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      policyId: my-policy
                      policyData: "0x7b22706f6c696379223a22396361663735323733373936353135656465613631323165227d"
              Build tx to insertRevocation:
                description: |
                  Call to build an unsigned transaction to insert a revocation. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **applicationId**: Application ID
                  - **revokedBy**: Administrator DID
                  - **notBefore**: Point in time when the revocation becomes valid. It should be defined in epoch time.
                value:
                  jsonrpc: "2.0"
                  method: insertRevocation
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      applicationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      revokedBy: "did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ"
                      notBefore: 1609926740
                  id: 1
              Build tx to add a new attribute to an administrator:
                description: |
                  Call to build an unsigned transaction to insert new attribute data to an administrator in the registry. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of the administrator to update
                  - **attributeData**: Attribute data to add. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateAdministrator
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      did: did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ
                      attributeData: "0x7b2261646d696e223a22306139393338616431616538623865323932613961336536227d"
                  id: 1
              Build tx to update an attribute of an administrator:
                description: |
                  Call to build an unsigned transaction to update an attribute of an administrator in the registry. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of the administrator to update
                  - **prevAttributeHash**: Attribute ID to update
                  - **attributeData**: Attribute data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateAdministrator
                  params:
                    - from: "0x6bd81E8CaA368CC196d573a26F1BE6c0753aC6e6"
                      did: did:ebsi:znbuGDt6tEqpGZNAuGc2uvZ
                      attributeData: "0x7b2261646d696e223a22306139393338616431616538623865323932613961336536227d"
                      prevAttributeHash: "0x9045517cc555c75cd7085900a900e6693439086f9eddeee513271fba278964fe"
                  id: 1
              Build tx to updateApp:
                description: |
                  Call to build an unsigned transaction to update an app. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **applicationId**: Application ID
                  - **name**: New name
                  - **domain**: Domain. 1 (ebsi) or 2 (external)
                value:
                  jsonrpc: "2.0"
                  method: updateApp
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      applicationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      name: "new name"
                      domain: 2
                  id: 1
              Build tx to updateAppPublicKey:
                description: |
                  Call to build an unsigned transaction to update an existing public key. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **publicKeyId**: Public key ID
                  - **status**: Status. 1 (active), 2 (revoked), or 3 (suspended)
                  - **notAfter**: Point in time when the public key becomes invalid. It should be defined in epoch time.
                value:
                  jsonrpc: "2.0"
                  method: updateAppPublicKey
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      publicKeyId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      status: 2
                      notAfter: 1709926740
                  id: 1
              Build tx to updateAuthorization:
                description: |
                  Call to build an unsigned transaction to update an authorisation. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **authorizationId**: Authorization ID
                  - **status**: Status. 1 (active), 2 (revoked), or 3 (suspended)
                  - **permissions**: CRUD permissions. It must be a number between 0 and 15 (default). It's binary representation enables or disables each one of the 4 CRUD permissions (create, read, update, delete).
                  - **notAfter**: Point in time when the authorisation becomes invalid. It should be defined in epoch time.
                value:
                  jsonrpc: "2.0"
                  method: updateAuthorization
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      authorizationId: "0x31a014c390aa9ad2b47a1df8904c8addf87db279b06eae50797f546da63229d3"
                      status: 1
                      permissions: 15
                      notAfter: 1709926740
                  id: 1
              Build tx to update a policy:
                description: |
                  Call to build an unsigned transaction to update a policy. This method requires admin rights in the Trusted Apps Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                   - **policyId**: Policy Id
                   - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updatePolicy
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: test-policy-1
                      policyData: "0x1234567890..."
              Send Transaction:
                description: Call to send a signed transaction to the blockchain.
                value:
                  jsonrpc: "2.0"
                  method: sendSignedTransaction
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
                      s: "0x..."
                      v: "0x..."
                      signedRawTransaction: "--- signed raw transaction ---"
                  id: 1
              Send Transaction (DEPRECATED):
                description: |
                  THIS METHOD IS DEPRECATED! Use "sendSignedTransaction" instead.
                  Call to send a signed transaction to the blockchain.
                value:
                  jsonrpc: "2.0"
                  method: signedTransaction
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
                      s: "0x..."
                      v: "0x..."
                      signedRawTransaction: "--- signed raw transaction ---"
                  id: 1
        required: true
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
              examples:
                Build tx:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                      data: "0x0000..."
                      nonce: "0x00"
                      chainId: "0x1b3b"
                      gasLimit: "0x10000"
                      gasPrice: "0x00"
                      value: "0x00"
                Send Transaction:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: "0xe670ec64341771606e55d6b4ca35a1a6b75ee3d5145a99d05921026d1527331"
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
                Invalid Token:
                  $ref: "#/components/examples/InvalidToken"
components:
  schemas:
    App:
      title: App
      type: object
      description: App data model
      properties:
        applicationId:
          type: string
          description: Unique app ID
        name:
          type: string
          description: App name
        domain:
          type: string
          description: domain
          enum: ["undefined", "ebsi", "external"]
        administrators:
          type: array
          items:
            type: string
        publicKeys:
          type: array
          items:
            type: string
        info:
          type: object
        authorizations:
          type: array
          items:
            $ref: "#/components/schemas/Authorization"
    Authorization:
      description: Authorization data model
      type: object
      properties:
        authorizationId:
          type: string
          format: multi-base64url encoded authorization id
        resourceApplicationId:
          description: Application id of application that authorizes an app (requesterApplicationId) to perform operations.
          type: string
          format: multi-base64url encoded application id
        requesterApplicationId:
          description: Application id of the app that is authorized to consume app (resourceApplicationId) resources.
          type: string
          format: multi-base64url encoded application id
        resourceApplicationName:
          description: Application name
          type: string
        requesterApplicationName:
          description: Application name
          type: string
        iss:
          description: DID of the authorization issuer.
          type: string
          format: DID
        permissions:
          description: Application permissions
          type: object
          properties:
            create:
              type: string
              enum: ["true", "false"]
            read:
              type: string
              enum: ["true", "false"]
            update:
              type: string
              enum: ["true", "false"]
            delete:
              type: string
              enum: ["true", "false"]
        status:
          description: "Authorization status: active, revoked"
          type: string
          enum: ["undefined", "active", "revoked", "suspended"]
        notBefore:
          description: Date and time before the authorization must be considered invalid.
          type: number
        notAfter:
          description: Date and time after the authorization must be considered invalid.
          type: number
    Links:
      title: Links
      type: object
      properties:
        last:
          type: string
          description: URI of the last page
        prev:
          type: string
          description: URI of the previous page
        next:
          type: string
          description: URI of the next page
        first:
          type: string
          description: URI of the first page
      description: links model used for pagination
      x-examples:
        Links:
          first: https://api.preprod.ebsi.eu/trusted-apps-registry/v2/administrators?page[after]=1&page[size]=2
          prev: https://api.preprod.ebsi.eu/trusted-apps-registry/v2/administrators?page[after]=2&page[size]=2
          next: https://api.preprod.ebsi.eu/trusted-apps-registry/v2/administrators?page[after]=4&page[size]=2
          last: https://api.preprod.ebsi.eu/trusted-apps-registry/v2/administrators?page[after]=13&page[size]=2
    Attribute:
      title: Attribute
      type: object
      description: Attribute
      properties:
        hash:
          type: string
          description: sha256 hash of the payload
        body:
          description: Base64 encoded content
    AttributeDetails:
      title: Attribute Details
      type: object
      description: Attribute Details
      properties:
        did:
          type: string
          description: DID of the attribute owner
        attribute:
          $ref: "#/components/schemas/Attribute"
    Administrator:
      title: Administrator
      type: object
      description: Name of the administrator
      properties:
        did:
          type: string
          description: DID of the administrator
        attributes:
          type: array
          description: Array of attributes
          items:
            $ref: "#/components/schemas/Attribute"
    JsonRpcResponse:
      title: JSON-RPC Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly '2.0'
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: object
            - type: string
    Policy:
      title: Policy
      type: object
      description: Policy data model
      properties:
        policyId:
          type: string
          description: Unique policy ID
        policy:
          type: string
          description: Base64 encoded policy
        hash:
          type: string
          description: Hash (multihash) of the policy
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      x-examples:
        Not Enough Credit:
          type: https://example.com/probs/out-of-credit
          title: You do not have enough credit.
          detail: Your current balance is 30, but that costs 50.
          instance: /account/12345/msgs/abc
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
  examples:
    BadRequest:
      value:
        title: Bad request
        status: 400
        detail: Bad request
    InvalidToken:
      value:
        title: Invalid token
        status: 400
        detail: Invalid token
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.preprod.ebsi.eu"
    description: EBSI Pre-production Environment
  - url: "https://api.ebsi.eu"
    description: EBSI Production Environment
