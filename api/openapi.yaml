                  - **didVersionMetadata**: DID Document metadata (stringified JSON encoded in hexadecimal)
                value:
                  jsonrpc: "2.0"
                  method: updateDidDocument
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      identifier: "0x6469643a656273693a434245736e5445445434764d714a73396b38576759644e757945796b6a57706276645a4d6363596456456e4e"
