openapi: 3.0.3
info:
  title: Trusted Ledgers & Smart Contracts Registry API
  version: 1.0.0
  description: |
    Trusted Ledgers & Smart Contracts Registry (TLSCR) API is an EBSI core service. It enables us
    to interact with the Trusted Ledgers & Smart Contracts Registry - Smart Contract to
    - list the trusted smart contract,
    - list the trusted ledgers (on the long term a network of trusted ledger compliant with EBSI
    rules)
    - obtain Smart Contract and Ledger information,
    - optionally it helps to construct unsigned transactions for the operations.

    For more information see:

    * [Technical Specifications](https://ec.europa.eu/cefdigital/wiki/display/EBSIDOC/Trusted+Ledgers+and+Smart+Contracts+Registry+API)
    * [Smart Contract Technical Specifications](https://ec.europa.eu/cefdigital/wiki/pages/viewpage.action?pageId=374834300)
    * [Code Repository](https://ec.europa.eu/cefdigital/code/projects/EBSI/repos/trusted-ledgers-sc-registry-api/browse)
    * [Smart Contract Code Repository](https://ec.europa.eu/cefdigital/code/projects/EBSI/repos/trusted-ledgers-sc-registry-ethereum-sc/browse)
  termsOfService: /docs/terms
  contact:
    name: EBSI Support – Service Desk
    url: https://ec.europa.eu/cefdigital/tracker/plugins/servlet/desk/portal/11
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
tags:
  - name: Trusted Ledgers & Smart Contracts Registry API
    description: List trusted Ledgers and Smart Contracts
paths:
  /trusted-ledgers-smart-contracts-registry/v1/ledgers:
    get:
      tags:
        - Trusted Ledgers & Smart Contracts Registry API
      summary: Get all ledgers
      description: Get all ledgers. Endpoint returns a paginated list of items.
      operationId: get-trusted-ledgers-smart-contracts-registry-v1-ledgers
      parameters:
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
        - in: query
          name: name
          schema:
            type: string
          description: Filter results by ledger name.
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: Absolute path to the collection.
                  items:
                    type: array
                    description: List of ledgers
                    items:
                      $ref: "#/components/schemas/LedgerInfoLinks"
                  total:
                    type: integer
                    description: Total number of items accross all pages.
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page.
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                "[test] Success":
                  value:
                    self: https://api.test.intebsi.xyz/trusted-ledgers-smart-contracts-registry/v1/ledgers?page[after]=1&page[size]=10
                    items:
                      - ledgerInfoId: "0xc981798c566a266b48cfd0d7684a4a00ce8d9d9d770aa7614ff0f7cc724e0a57"
                        href: https://api.test.intebsi.xyz/trusted-ledgers-smart-contracts-registry/v1/ledgers/0xc981798c566a266b48cfd0d7684a4a00ce8d9d9d770aa7614ff0f7cc724e0a57
                      - ledgerInfoId: "0x0cd81662c95df9643238abdbfc15b6f23c7754fcb8d1cc6be909e2525b550b44"
                        href: https://api.test.intebsi.xyz/trusted-ledgers-smart-contracts-registry/v1/ledgers/0x0cd81662c95df9643238abdbfc15b6f23c7754fcb8d1cc6be909e2525b550b44
                    total: 2
                    pageSize: 10
                    links:
