openapi: 3.0.3
info:
  title: Authorisation API
  description: |
    The Authorisation API is a core EBSI service responsible to issue Short Term
    Access Tokens (JWS) to the EBSI Platform for entities (Natural Persons,
    Legal Entities) and trusted Applications (EBSI or third-party applications)
    in exchange of their presentation of a long term EBSI Verifiable
    Authorisation credential, plus their authentication/identification. Access
    tokens are required by entities and applications to access the protected
    resources of EBSI.

    Users receive access tokens after they present a valid EBSI Verifiable
    Authorisation credential and prove ownership over their DID.

    Trusted Applications receive access tokens if they are well registered in
    the Trusted Apps Registry (application public keys are listed), are
    authorised there to access the requested protected resources, and
    successfully prove their private key ownership. We implement the
    Authenticated Key Exchange cryptographic identification protocol.

    For more information see:
      * [Technical Specifications](https://ec.europa.eu/cefdigital/wiki/display/EBSIDOC/Authorisation+API)
      * [Code Repository](https://ec.europa.eu/cefdigital/code/projects/EBSI/repos/authorisation-api)
  version: 1.0.0
  termsOfService: "/docs/terms"
  contact:
    name: "EBSI Support – Service Desk"
    url: "https://ec.europa.eu/cefdigital/tracker/plugins/servlet/desk/portal/11"
  license:
    name: "EUPL-1.2"
    url: "https://joinup.ec.europa.eu/page/eupl-text-11-12"
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.preprod.ebsi.eu"
    description: EBSI Pre-production Environment
  - url: "https://api.ebsi.eu"
    description: EBSI Production Environment
tags:
  - name: Authorisation API
    description: Manage EBSI User, Legal Entities and Component Authentication
paths:
  /authorisation/v1/authentication-requests:
    post:
      operationId: post-authorisation-v1-authentication-requests
      tags:
        - Authorisation API
      summary: Authentication Requests
      description: Natural Person and Legal Entities entry point to initiate a SIOP DID Auth Request.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticationRequest"
            examples:
              openid did_authn:
                value:
                  scope: openid did_authn
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationRequestResponse"
              examples:
                Authentication Request:
                  value:
                    uri: openid://?response_type=id_token&client_id=https%3A%2F%2Fapi.preprod.ebsi.eu%2Fauthorisation%2Fv1%2Fsiop-sessions&scope=openid%20did_authn&nonce=2a6a2e33-fbf8-4a41-95a4-88201ebd9b0f&request=eyJhbGciOiJFUzI1NksiLCJ0eXAiOiJKV1QiLCJraWQiOiJodHRwczovL2FwaS5wcmVwcm9kLmVic2kuZXUvdHJ1c3RlZC1hcHBzLXJlZ2lzdHJ5L3YyL2FwcHMvMHgwOGMyNTg1NmZiY2JkZDA3NmM5YzM5NTEyYWJlZjYzMDk3NDk5MTBhMTEwZDlkMWE5YzlhN2QyYjI3N2I2ZDIwIn0..3ET08uTUO8CxdC2H8AhBTvxLMb4yXVn5CxY0gtuexbfCM4EgL4U_FqYGbsApP1iugn9ZUx2v6V_zVcfJVPvZqA
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
                Issuer Not Found:
                  $ref: "#/components/examples/IssuerNotFound"
                Expired Token:
                  $ref: "#/components/examples/ExpiredToken"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /authorisation/v1/siop-sessions:
    post:
      operationId: post-authorisation-v1-siop-sessions
      tags:
        - Authorisation API
      summary: SIOP Sessions
      description:
        Sessions Token endpoint as the callback for DID SIOP Response.
        This endpoint accepts id-token for algorithms ES256K, ES256, RS256, and EdDSA.
        The public key must be in the DID Registry.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SiopSessionsRequest"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ake1SiopResponse"
              examples:
                SIOP Response:
                  value:
                    ake1_enc_payload: 
                    ake1_sig_payload:
                      iat: 1627652364
                      exp: 1627653264
                      ake1_nonce: 60193434-8319-4f0c-b47a-ad146aa55915
                      ake1_enc_payload: 
                      did: did:ebsi:zub5ZZUfHLLptCduwEy8xRj
                      iss: did:ebsi:zwC56DZdiJh8kSxbgg4fMCu
                    ake1_jws_detached: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NksiLCJraWQiOiJodHRwczovL2FwaS5wcmVwcm9kLmVic2kuZXUvdHJ1c3RlZC1hcHBzLXJlZ2lzdHJ5L3YyL2FwcHMvMHgwOGMyNTg1NmZiY2JkZDA3NmM5YzM5NTEyYWJlZjYzMDk3NDk5MTBhMTEwZDlkMWE5YzlhN2QyYjI3N2I2ZDIwIn0..hniLWpfw8sxgacyRdXr7en4UrCQoWvsJ72m9bo51x3n5fWSoL7_BdfcHyaEQXCHz_y7iZhRDBxtT1Pw03OiNIQ
                    did: did:ebsi:zwC56DZdiJh8kSxbgg4fMCu
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
                Issuer Not Found:
                  $ref: "#/components/examples/IssuerNotFound"
                Expired Token:
                  $ref: "#/components/examples/ExpiredToken"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /authorisation/v1/oauth2-sessions:
    post:
      operationId: post-authorisation-v1-oauth2-sessions
      tags:
