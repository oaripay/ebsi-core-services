  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
    Forbidden:
      value:
        title: Forbidden
        status: 403
        detail: Forbidden.
    Unauthorized:
      value:
        title: Unauthorized
        status: 401
        detail: You are not authorized to access the resources.
    InternalError:
      value:
        title: Internal Server Error
        status: 500
        detail: |
          The server encountered an internal error and was unable to complete your request.
  parameters:
    headerConformance:
      in: header
      name: Conformance
      description: |
        The header MUST be used ONLY for the EBSI conformance testing.
        - Type: string
        - Format: UUID V4

        The header is used to log the activities.
      required: false
      schema:
        type: string
        format: uuid
      example: edb60e02-398d-4b62-8028-85710b2476a5
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
