      summary: Get timestamp by its ID
      description: Returns a timestamp by its ID
      parameters:
        - name: timestampId
          in: path
          schema:
            type: string
          example: uMHhlODRhMzdhMmFiNGZkZGExYTFkMzE4MzAwODY5OWNhNzAyOWE0ZWNmNTAzMWY3Mzg3OGI3OGIyNWM2OGU4M2Jl
          description: Multi-base64url encoded timestamp ID
          required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timestamp"
              examples:
                Success:
                  value:
                    hash: "0x123"
                    timestampedBy: "0x456"
                    blockNumber: 12
                    transactionHash: "0x789"
                    data: "0xabc"
        "400":
