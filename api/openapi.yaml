openapi: 3.0.3
info:
  title: Trusted Issuers Registry API
  description: |
    Trusted Issuers Registry API is a Core Service of the EBSI platform verifying if a legal entity is authorized to issue a W3C Verifiable Credential. 
    The first implementation of this service in v1 checks for the presence of issuers DID in a Trusted Issuers Smart Contract and verifies if they are allowed to issue specific Verifiable Credentials.
  version: 1.0.0
  termsOfService: "/docs/terms"
  contact:
    name: "EBSI Support"
    url: "https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi"
  license:
    name: "EUPL-1.2"
    url: "https://joinup.ec.europa.eu/page/eupl-text-11-12"
tags:
  - name: Trusted Issuers Registry
    description: List and verify trusted issuers
paths:
  "/trusted-issuers-registry/v1/issuers/{did}":
    get:
      tags:
        - Trusted Issuers Registry
      summary: Get issuer by its Decentralized Identifier
      description: returns a trusted issuer by its decentralized identifier
      parameters:
        - name: did
          in: path
          schema:
            type: string
          example: "did:example:123456789abcdefghi"
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/issuerName"
              examples:
                Success:
                  value:
                    name: string
        "400":
          description: Bad Request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {did} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: "The format of {did} parameter is not valid"
        "404":
          description: Not found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Did Not Found:
                  value:
                    title: Not found
                    status: 404
                    detail: "{did} not found"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  value:
                    $ref: "#/components/examples/InternalError"
      operationId: get-trusted-issuer
  /trusted-issuers-registry/v1/issuers:
    get:
      tags:
        - Trusted Issuers Registry
      summary: List of trusted issuers
      description: Returns a list of trusted issuers
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: list of issuers whith their decentralized identifier
                    items:
                      $ref: "#/components/schemas/issuer"
                  total:
                    type: integer
                    description: " total number of pages in a collection"
                  pageSize:
                    type: integer
                    description: number of items to be return per page
                  links:
                    $ref: "#/components/schemas/links"
              examples:
                Success:
                  value:
                    items:
                      - name: string
                        did: string
                      - name: string
                        did: string
                    total: 2
                    pageSize: 10
                    links:
                      first: "/trusted-issuers-registry/v1/issuers?page[after]=0&page[size]=2"
                      prev: "/trusted-issuers-registry/v1/issuers?page[after]=2&page[size]=2"
                      next: "/trusted-issuers-registry/v1/issuers?page[after]=4&page[size]=2"
                      last: "/trusted-issuers-registry/v1/issuers?page[after]=13&page[size]=2"
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      operationId: get-trusted-issuers-registry-v1-issuers
      parameters:
        - in: query
          name: "page[before]"
          schema:
            type: string
          description: Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: "page[after]"
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: "page[size]"
          description: Defines the maximum number of objects that may be returned.
components:
  schemas:
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      x-examples:
        Not Enough Credit:
          type: "https://example.com/probs/out-of-credit"
          title: You do not have enough credit.
          detail: "Your current balance is 30, but that costs 50."
          instance: /account/12345/msgs/abc
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: "about:blank"
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    links:
      title: links
      type: object
      properties:
        last:
          type: string
          description: " URI of the last page"
        prev:
          type: string
          description: " URI of the previous page"
        next:
          type: string
          description: " URI of the next page"
        first:
          type: string
          description: " URI of the first page"
      description: links model used for pagination
      x-examples:
        Links:
          first: "/trusted-issuers-registry/v1/issuers?page[after]=0&page[size]=2"
          prev: "/trusted-issuers-registry/v1/issuers?page[after]=2&page[size]=2"
          next: "/trusted-issuers-registry/v1/issuers?page[after]=4&page[size]=2"
          last: "/trusted-issuers-registry/v1/issuers?page[after]=13&page[size]=2"
    issuer:
      type: object
      description: app model
      title: ""
      x-examples:
        app model example:
          appName: string
          pubKey: string
      properties:
        appName:
          type: string
          description: application name
        pubKey:
          type: string
          description: Secp256k1 Public key
      required:
        - appName
        - pubKey
    issuerName:
      title: Issuer name
      type: object
      x-examples:
        Issuer name example:
          name: string
      description: Name of the issuer
      properties:
        name:
          type: string
          description: name of the issuer
      required:
        - name
  examples:
    BadRequest:
      value:
        title: Bad request
        status: 400
        detail: Bad request
    InvalidToken:
      value:
        title: Invalid token
        status: 400
        detail: Invalid token
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    TooLarge:
      value:
        title: Payload too large
        status: 413
        detail: Payload too large
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
    ListFiles:
      value:
        items:
          - hash1
          - hash2
        total: 2
    ListFilesPagination:
      value:
        items:
          - hash1
          - hash2
        total: 2
        pageSize: 3
        links:
          first: "/trusted-issuers-registry/v1/issuers/distributed?page[after]=fff&page[size]=2"
          prev: "/trusted-issuers-registry/v1/issuers/distributed?page[after]=ppp&page[size]=2"
          next: "/trusted-issuers-registry/v1/issuers/distributed?page[after]=nnn&page[size]=2"
          last: "/trusted-issuers-registry/v1/issuers/distributed?page[after]=lll&page[size]=2"
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.ebsi.xyz"
    description: EBSI Testing Environment
