                  issuanceDate: "2019-06-22T14:11:44Z"
                  expirationDate: "2019-06-27T14:11:44Z"
                  payload:
                    verifiableCredential:
                      id: vc:ebsi:authentication#bfc64c03-a203-4005-8ce7-9593d1421636
                      issuer: did:ebsi:zwC56DZdiJh8kSxbgg4fMCu
                      validFrom: "2021-10-12T09:44:01Z"
                      credentialSubject:
                        id: did:ebsi:zctk4PzNdbyCzKWwV5VZh3t
                      credentialSchema:
