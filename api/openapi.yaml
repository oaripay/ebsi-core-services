  /did-registry/v2/jsonrpc:
    post:
      operationId: post-did-registry-v2-jsonrpc
      tags:
        - DID Registry
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions and interaction with
        the ledger (Write operation on ledger).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method to be invoked. Possible values: 'insertAdministrator',
            'updateAdministrator', 'insertPolicy', 'updatePolicy', 'insertHashAlgorithm',
            'updateHashAlgorithm', 'insertDidDocument', 'updateDidDocument', 'insertDidController',
            'updateDidController', 'revokeDidController', 'insertDidMethod', 'updateDidMethod',
            'appendDidDocumentVersionHash', 'detachDidDocumentVersionHash',
            'appendDidDocumentVersionMetadata', 'detachDidDocumentVersionMetadata'
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              Build tx to insertAdministrator:
                description: |
                  Call to build an unsigned transaction to insert a new administrator in the registry. This method requires admin rights in the DID Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of new administrator
                  - **attributeData**: Attribute data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: insertAdministrator
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: "did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4"
                      attributeData: "0x7b22616e79223a22416e79206174747269627574652068657265222c2274797065223a2263726564656e7469616c222c2264617461223a226439333866396337356465643839623835613231363566343539333964356235227d"
              Build tx to updateAdministrator (new attribute):
                description: |
                  Call to build an unsigned transaction to insert new attribute data to an administrator in the registry. This method requires admin rights in the DID Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of the administrator to update
                  - **attributeData**: Attribute data to add. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateAdministrator
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4
                      attributeData: "0x7b22616e79223a22416e79206174747269627574652068657265222c2274797065223a2263726564656e7469616c222c2264617461223a226234646562303165383334303335643863313731326530663633326536633164227d"
              Build tx to updateAdministrator (update attribute):
                description: |
                  Call to build an unsigned transaction to update an attribute of an administrator in the registry. This method requires admin rights in the DID Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **did**: DID of the administrator to update
                  - **prevAttributeHash**: Attribute ID to update
                  - **attributeData**: Attribute data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updateAdministrator
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      did: did:ebsi:0xC3EF569B74B8DE63826aD256290E35BD35bD06c4
                      prevAttributeHash: "0xade61e5d36c9cb925a59c00c4c0e16c25a6dce1ec8475432f75c953ff2cd551d"
                      attributeData: "0x7b22616e79223a22416e79206174747269627574652068657265222c2274797065223a2263726564656e7469616c222c2264617461223a223962346233643265613331636561366336346535653763393462363462383932227d"
              Build tx to insertPolicy:
                description: |
                  Call to build an unsigned transaction to insert a policy in the registry. This method requires admin rights in the DID Registry.

                   Parameters:
                   - **from**: Ethereum address of the administrator
                   - **policyId**: Policy Id
                   - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: insertPolicy
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: policy-test-2021-03-30T14:10:56.932Z
                      policyData: "0x7b22616e79223a22416e79206174747269627574652068657265222c2274797065223a2263726564656e7469616c222c2264617461223a223832663965313262313636363665313134303661383738643364653266333465227d"
              Build tx to updatePolicy:
                description: |
                  Call to build an unsigned transaction to update a policy. This method requires admin rights in the DID Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **policyId**: Policy Id
                  - **policyData**: Policy data. This field must be a JSON stringified and converted into hex string
                value:
                  jsonrpc: "2.0"
                  method: updatePolicy
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      policyId: policy-test-2021-03-30T14:10:56.932Z
                      policyData: "0x7b22616e79223a22416e79206174747269627574652068657265222c2274797065223a2263726564656e7469616c222c2264617461223a223832663965313262313636363665313134303661383738643364653266333465227d"
              Build tx to insertHashAlgorithm:
                description: |
                  Call to build an unsigned transaction to insert a new hash algorithm. This method requires admin rights in the DID Registry.

                  Parameters:
                  - **from**: Ethereum address of the administrator
                  - **outputLength**: hash output length (in bits)
                  - **ianaName**: IANA name of the hash algorithm
                  - **oid**: object identifier (OID)
                  - **status**: status of the algorithm (1 = active, 2 = revoked)
                  - **multihash**: multihash name
                value:
                  jsonrpc: "2.0"
                  method: insertHashAlgorithm
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      outputLength: 256
                      ianaName: sha-256
                      oid: "2.16.840.1.101.3.4.2.1"
                      status: 1
                      multihash: sha2-256
              Build tx to updateHashAlgorithm:
                description: |
                  Call to build an unsigned transaction to update an existing hash algorithm. This method requires admin rights in the DID Registry.

                   Parameters:
                   - **from**: Ethereum address of the administrator
                   - **hashAlgorithmId**: ID of the hash algorithm to update
                   - **outputLength**: hash output length (in bits)
                   - **ianaName**: IANA name of the hash algorithm
                   - **oid**: object identifier (ODI)
                   - **status**: status of the algorithm (1 = active, 2 = revoked)
                   - **multihash**: multihash name
                value:
                  jsonrpc: "2.0"
                  method: updateHashAlgorithm
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      hashAlgorithmId: 3
                      outputLength: 256
                      ianaName: sha-256
                      oid: "2.16.840.1.101.3.4.2.1"
                      status: 2
                      multihash: sha2-256
              Build tx to insertDidDocument:
                description: |
                  Call to build an unsigned transaction to insert a new DID Document.

                  Parameters:
                  - **from**: Ethereum address of the signer
                  - **identifier**: DID identifier (hexadecimal)
                  - **hashAlgorithmId**: ID of the hash algorithm used to hash the DID Document
                  - **hashValue**: hash of the canonicalized DID Document
                  - **didVersionInfo**: stringified JSON DID Document (hex-encoded)
                  - **timestampData**: data to be added to the timestamp (stringified JSON encoded in hexadecimal)
                  - **didVersionMetadata**: DID Document metadata (stringified JSON encoded in hexadecimal)
                value:
                  jsonrpc: "2.0"
                  method: insertDidDocument
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      identifier: "0x6469643a656273693a434245736e5445445434764d714a73396b38576759644e757945796b6a57706276645a4d6363596456456e4e"
                      hashAlgorithmId: 0
                      hashValue: "0xf0fcfaf89af366f278900538f074eba8469408b1c54451e4ff4660a379e7e8f5"
                      didVersionInfo: ""
                      timestampData: "0x7b2264617461223a2274657374222c2272223a2239333133313465363232633231613635227d"
                      didVersionMetadata: "0x7b226d657461223a2238313239336463633863623537623930663835383662396237343139333530653636316166623530663563633461656666376632643532373863623530353562227d"
              Build tx to updateDidDocument:
                description: |
