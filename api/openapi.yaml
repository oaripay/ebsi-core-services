openapi: 3.0.3
info:
  title: Trusted Schemas Registry API
  description: |
    Trusted Schemas Registry (TSR) API is an EBSI core service. It enables us to interact with the
    Trusted Schemas Registry Smart Contract to:
    - register a new schema
    - update a registered schema
    - read and validate registered schemas

    EBSI Trusted Schemas Registry is a Domain Specific registry service focusing on registering in
    it only Data Model and Ontology. The registry is agnostic of any type of schema (we support
    whatever scheme the consumer needs to anchor, being it JSON, JSON-LD, XML, etc.).

    TSR API is a microservice, hosted on the EBSI infrastructure.
  version: 1.0.0
  termsOfService: /docs/terms
  contact:
    name: EBSI Support
    url: https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/page/eupl-text-11-12
tags:
  - name: Trusted Schemas Registry API
    description: List trusted schemas
paths:
  /trusted-schemas-registry/v1/schemas:
    get:
      tags:
        - Trusted Schemas Registry API
      summary: Get all schemas
      description: Get all schemas. Endpoint returns a paginated list of items.
      operationId: get-trusted-schemas-registry-v1-schemas
      parameters:
        - in: query
          name: page[before]
          schema:
            type: string
          description: Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: page[after]
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: page[size]
          description: Defines the maximum number of objects that may be returned.
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    type: string
                    description: Absolute path to the collection.
                  items:
                    type: array
                    description: List of schemas
                    items:
                      $ref: "#/components/schemas/SchemaLinks"
                  total:
                    type: integer
                    description: Total number of items accross all pages.
                  pageSize:
                    type: integer
                    description: Number of items to be returned per page.
                  links:
                    $ref: "#/components/schemas/Links"
              examples:
                Success:
                  value:
                    self: https://api.ebsi.xyz/trusted-schemas-registry/v1/schemas?page[after]=3&page[size]=2
                    items:
                      - schemaId: schema-abc
                        href: https://api.ebsi.xyz/trusted-schemas-registry/v1/schemas/schema-abc
                      - schemaId: schema-xyz
                        href: https://api.ebsi.xyz/trusted-schemas-registry/v1/schemas/schema-xyz
                    total: 124
                    pageSize: 2
                    links:
                      first: https://api.ebsi.xyz/trusted-schemas-registry/v1/schemas?page[after]=1&page[size]=2
                      prev: https://api.ebsi.xyz/trusted-schemas-registry/v1/schemas?page[after]=2&page[size]=2
                      next: https://api.ebsi.xyz/trusted-schemas-registry/v1/schemas?page[after]=4&page[size]=2
                      last: https://api.ebsi.xyz/trusted-schemas-registry/v1/schemas?page[after]=62&page[size]=2
        400:
          description: Bad Request Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Paging Request:
                  value:
                    title: Bad Paging Request
                    status: 400
                    detail: PageSize should not be greater than 50
        500:
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /trusted-schemas-registry/v1/schemas/{schemaId}:
    get:
      tags:
        - Trusted Schemas Registry API
      summary: Get schema by its ID
      description: Returns a trusted schema by its ID
      operationId: get-trusted-schemas-registry-v1-schema
      parameters:
        - name: schemaId
          in: path
          schema:
            type: string
          example: "{DOI or IOD}"
          required: true
      responses:
        200:
          description: Success
          content:
            application/ld+json:
              schema:
                type: object
              examples:
                Success:
                  value:
                    "@context": https://ebsi.com
                    type: CustomSchema
                    name: My custom schema
        400:
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {schemaId} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: The format of {schemaId} parameter is not valid
        404:
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Schema Not Found:
                  $ref: "#/components/examples/NotFound"
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /trusted-schemas-registry/v1/jsonrpc:
    post:
      operationId: post-trusted-schemas-registry-v1-jsonrpc
      tags:
        - Trusted Schemas Registry API
      summary: Helper APIs
      description: |
        Helper APIs that assist the construction of blockchain transactions and interaction with
        the ledger (Write operation on ledger).
      requestBody:
        required: true
        description: |
          The body follows the
          [JSON-RPC 2.0 specification](https://www.jsonrpc.org/specification).

          It requires the following fields:

          - **jsonrpc**: Must be exactly '2.0'
          - **method**: Method to be invoked. Possible values: 'insertSchema', 'updateSchema',
          'updateMetadata'
          - **params**: Array of parameters
          - **id**: Identifier stablished by the client
        content:
          application/json:
            schema:
              required:
                - jsonrpc
                - id
                - method
                - params
              type: object
              properties:
                jsonrpc:
                  description: Must be exactly '2.0'
                  type: string
                method:
                  description: Method that needs to be invoked
                  type: string
                params:
                  description: Array of parameters
                  type: array
                  items:
                    type: object
                id:
                  description: Identifier established by the client
                  type: integer
                  example: 1
            examples:
              Build tx to insertSchema:
                value:
                  jsonrpc: "2.0"
                  method: insertSchema
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      schemaId: "{ hex-encoded oid or doi }"
                      schema: "0x227b2240636f6e74657874223a2268747470733a2f2f656273692e6575222c2274797065223a22536368656d61222c226e616d65223a226578616d706c65227d22"
                      metadata: "0x227b226d657461223a2276616c7565227d22"
              Build tx to updateSchema:
                value:
                  jsonrpc: "2.0"
                  method: updateSchema
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      schemaId: "{ hex-encoded oid or doi }"
                      schema: "0x227b2240636f6e74657874223a2268747470733a2f2f656273692e6575222c2274797065223a22536368656d61222c226e616d65223a226578616d706c65227d22"
                      metadata: "0x227b226d657461223a2276616c7565227d22"
              Build tx to updateMetadata:
                value:
                  jsonrpc: "2.0"
                  method: updateMetadata
                  id: 1
                  params:
                    - from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      schemaRevisionId: "0x3f571838c18b0e83db06d167211279b437e0becc999309be2de54ccc7b8d0909"
                      metadata: "0x227b226d657461223a2276616c7565227d22"
              Send Transaction:
                value:
                  jsonrpc: "2.0"
                  method: signedTransaction
                  id: 1
                  params:
                    - protocol: eth
                      unsignedTransaction:
                        from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                        to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                        data: "0x0000..."
                        nonce: "0x00"
                        chainId: "0x1b3b"
                        gasLimit: "0x10000"
                        gasPrice: "0x00"
                        value: "0x00"
                      r: "0x..."
                      s: "0x..."
                      v: "0x..."
                      signedRawTransaction: "--- signed raw transaction ---"
      responses:
        200:
          description: Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
              examples:
                Build tx:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      from: "0x416e6e6162656c2e4c65652e452d412d506f652e"
                      to: "0xFde86148db58f57787C06BeAf63a9c3f789357b3"
                      data: "0x0000..."
                      nonce: "0x00"
                      chainId: "0x1b3b"
                      gasLimit: "0x10000"
                      gasPrice: "0x00"
                      value: "0x00"
                Send Transaction:
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result: "0xe670ec64341771606e55d6b4ca35a1a6b75ee3d5145a99d05921026d1527331"
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
components:
  schemas:
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: about:blank
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    JsonRpcResponse:
      title: Json Rpc Response
      type: object
      properties:
        jsonrpc:
          description: Must be exactly '2.0'
          type: string
        id:
          description: Same identifier established by the client in the call
          type: integer
        result:
          description: Result of the call
          oneOf:
            - type: object
            - type: string
    Links:
      title: Links
      type: object
      description: Links model used for pagination.
      properties:
        first:
          type: string
          description: Hyperlink to the first page.
        prev:
          type: string
          description: Hyperlink to the previous page.
        next:
          type: string
          description: Hyperlink to the next page.
        last:
          type: string
          description: Hyperlink to the last page.
      x-examples:
        Links:
          first: https://api.ebsi.xyz/trusted-schemas-registry/v1/schemas?page[after]=1&page[size]=2
          prev: https://api.ebsi.xyz/trusted-schemas-registry/v1/schemas?page[after]=2&page[size]=2
          next: https://api.ebsi.xyz/trusted-schemas-registry/v1/schemas?page[after]=4&page[size]=2
          last: https://api.ebsi.xyz/trusted-schemas-registry/v1/schemas?page[after]=13&page[size]=2
    SchemaLinks:
      title: Schema links
      description: Links to schemas as returned by the REST APIs.
      type: object
      properties:
        schemaId:
          type: string
          description: Unique schema id (OID or DOI)
        href:
          type: string
          description: Link to the resource.
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
servers:
  - url: http://localhost
    description: Local Computer Environment
  - url: https://api.ebsi.xyz
    description: EBSI Testing Environment
