                  payload:
                    verifiableCredential:
                      id: vc:ebsi:attestation#bfc64c03-a203-4005-8ce7-9593d1421636
                      issuer: did:ebsi:zwC56DZdiJh8kSxbgg4fMCu
                      validFrom: "2021-10-12T09:44:01Z"
                      credentialSubject:
                        id: did:ebsi:zctk4PzNdbyCzKWwV5VZh3t
                      credentialSchema:
                        id: https://api.test.intebsi.xyz/trusted-schemas-registry/v1/schemas/0x312e332e362e312e342e312e313338312e332e31322e332e322e332e3738
                        type: OID
                      issuanceDate: "2021-10-12T09:44:01Z"
                      expirationDate: "2022-04-12T09:44:01Z"
                      "@context":
