                value:
                  grantType: client_credentials
                  clientAssertionType: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                  clientAssertion: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NksiLCJraWQiOiJodHRwczovL2FwaS5wcmVwcm9kLmVic2kuZXUvdHJ1c3RlZC1hcHBzLXJlZ2lzdHJ5L3YyL2FwcHMvMHg3ZGE5MzMwNDhlNzNkOTFmMDE5OTQ0ZTczOGZjYjI4MDEzZjFiZjQzOGFiOTNmYWM2ZDU0NWZiOTM5MmFjMTJlIn0.eyJpYXQiOjE2Mjc2NTI1NDEsImV4cCI6MTYyNzY1MjU1Niwibm9uY2UiOiI0MDFlMGQ4Yi04OWQ1LTRiMDQtYjZmMC02YzgyOGY5Nzk4MzAiLCJqdGkiOiIzYjU4ZGZiYS02MDU2LTRlMmUtOTc1Mi0yYjNhZDhjN2E2YjUiLCJhdWQiOiJsZWRnZXItYXBpIiwic3ViIjoidGVzdC1hcHAyIiwiaXNzIjoidGVzdC1hcHAyIn0.7lIZb1zPgbg832ku-faA8fmMs8K1c2U14zzD1Ge85VjJCraUkmPHJdRmAsPlkoiXs8o6qUroT5Mge6LlFbeg3g
                  scope: openid did_authn
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ake1OAuth2Response"
              examples:
                OAuth2 response:
                  value:
                    ake1_enc_payload: 
                    ake1_sig_payload:
                      iat: 1627652552
