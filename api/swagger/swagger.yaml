openapi: 3.0.3
info:
  title: Ledger API
  description: |
    Ledger API is a Core Service of the EBSI platform providing access to the EBSI Ledger Protocols and Smart Contracts services of the lower layer Chain & Storage. In v1 we provide capabilities to interact with Hyperledger Besu and Fabric ledgers.

    For Besu, we are exposing a selected set of BESU RPC native APIs. Write operations require authentication.

    For Fabric, we start in v1 by providing an initial set of read REST API to interact with the ledger.
  license:
    name: EUPL-1.2
    url: "https://joinup.ec.europa.eu/page/eupl-text-11-12"
  version: 1.0.0
  contact:
    name: EBSI Support
    url: "https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi"
  termsOfService: "/docs/terms"
tags:
  - name: Authentication
    description: Authenticate to Ledger API
  - name: Besu
    description: Interaction with Besu blockchain
  - name: Fabric
    description: Hyperledger Fabric REST APIs
    externalDocs:
      url: "http://docs.my-api.com/store-orders.htm"
paths:
  /ledger/v1/sessions:
    post:
      operationId: post-ledger-v1-sessions
      tags:
        - Authentication
      summary: Login to Ledger
      description: Login to Ledger API
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionsRequest"
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  $ref: "#/components/examples/BadRequest"
                Invalid Token:
                  $ref: "#/components/examples/InvalidToken"
                Issuer Not Found:
                  $ref: "#/components/examples/IssuerNotFound"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
  /ledger/v1/blockchains/fabric/channels:
    get:
      tags:
        - Fabric
      summary: Get a list of all the available channels
      description: Returns a list of all the available EBSI Fabric channels.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: List of channel names.
                    items:
                      $ref: "#/components/schemas/channel"
                  links:
                    $ref: "#/components/schemas/links"
                  total:
                    type: integer
                    description: "Total number of pages in a collection."
                  pageSize:
                    type: integer
                    description: "Number of items to be return per page."
              examples:
                Get Available Channels:
                  value:
                    items:
                      - channelA
                      - channelB
                    total: 13
                    pageSize: 2
                    links:
                      self: "/ledger/v1/blockchains/fabric/channels?page[after]=3&page[size]=2"
                      first: "/ledger/v1/blockchains/fabric/channels?page[after]=0&page[size]=2"
                      prev: "/ledger/v1/blockchains/fabric/channels?page[after]=2&page[size]=2"
                      next: "/ledger/v1/blockchains/fabric/channels?page[after]=4&page[size]=2"
                      last: "/ledger/v1/blockchains/fabric/channels?page[after]=13&page[size]=2"
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                type: object
                properties:
                  title:
                    type: string
                  status:
                    type: number
                  detail:
                    type: string
              examples:
                Internal Server Error:
                  value:
                    title: Internal Server Error
                    status: 500
                    detail: Server encountered an internal error and was unable to complete your request.
      security:
        - bearerAuth: []
      operationId: get-ledger-bc-fabric-v1-channels
      parameters:
        - in: query
          name: "page[after]"
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: "page[size]"
          description: Defines the maximum number of objects that may be returned.
    parameters: []
  "/ledger/v1/blockchains/fabric/channels/{channel}":
    get:
      tags:
        - Fabric
      description: Check if channel exists
      summary: Check if channel exists
      responses:
        "204":
          description: Succes. Channel exists.
        "400":
          description: "Bad request. The format of the {channel} parameter is not valid."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {channel} Parameter:
                  value:
                    title: Bad request
                    status: 400
                    detail: "The format of {channel} parameter is not valid"
        "404":
          description: Channel {channel} not found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Channel Not Found:
                  value:
                    title: Not Found
                    status: 404
                    detail: "{channel} not found"
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  value:
                    title: Internal Server Error
                    status: 500
                    detail: The server encountered an internal error and was unable to complete your request.
      security:
        - bearerAuth: []
      operationId: get-ledger-bc-fabric-v1-channel
    parameters:
      - schema:
          type: string
        name: channel
        in: path
        required: true
        description: Fabric channel name.
