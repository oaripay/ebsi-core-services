openapi: 3.0.3
info:
  title: Trusted Issuers API
  description: Register of the legal entities that can issue VC for EBSI v1 demonstrator user journey.
  license:
    name: EUPL-1.2
    url: "https://joinup.ec.europa.eu/page/eupl-text-11-12"
  version: 1.0.0
  contact:
    name: EBSI Support
    url: "https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi"
  termsOfService: "https://api.ebsi.xyz/docs/terms"
tags:
  - name: Trusted Issuers
    description: Trusted Issuers Registry
paths:
  "/trusted-issuers-registry/v1/issuers/{did}":
    get:
      tags:
        - Trusted Issuers
      summary: Get issuer by its Decentralized Identifier
      description: returns a trusted issuer by its decentralized identifier
      parameters:
        - name: did
          in: path
          schema:
            type: string
          example: "did:example:123456789abcdefghi"
          required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/issuerName"
              examples:
                successful issuer response:
                  value:
                    name: string
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                Bad request:
                  value:
                    title: Bad request
                    status: 400
                    detail: "The format of {did} parameter is not valid"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                Not found:
                  value:
                    title: Not found
                    status: 404
                    detail: "{did} not found"
        "500":
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                Internal error:
                  value:
                    title: Internal Server Error
                    status: 500
                    detail: The server encountered an internal error and was unable to complete your request.
      operationId: get-trusted-issuer
  /trusted-issuers-registry/v1/issuers:
    get:
      tags:
        - Trusted Issuers
      summary: List of trusted issuers
      description: Returns a list of trusted issuers
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: list of issuers whith their decentralized identifier
                    items:
                      $ref: "#/components/schemas/issuer"
                  total:
                    type: integer
                    description: " total number of pages in a collection"
                  pageSize:
                    type: integer
                    description: number of items to be return per page
                  links:
                    $ref: "#/components/schemas/links"
              examples:
                successful list of issuers response:
                  value:
                    items:
                      - name: string
                        did: string
                      - name: string
                        did: string
                    total: 2
                    pageSize: 10
                    links:
                      self: "/trusted-issuers-registry/v1/issuers?page[after]=3&page[size]=2"
                      first: "/trusted-issuers-registry/v1/issuers?page[after]=0&page[size]=2"
                      prev: "/trusted-issuers-registry/v1/issuers?page[after]=2&page[size]=2"
                      next: "/trusted-issuers-registry/v1/issuers?page[after]=4&page[size]=2"
                      last: "/trusted-issuers-registry/v1/issuers?page[after]=13&page[size]=2"
        "500":
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                Internal error:
                  value:
                    title: Internal Server Error
                    status: 500
                    detail: The server encountered an internal error and was unable to complete your request.
      operationId: get-trusted-issuers-registry-v1-issuers
      parameters:
        - in: query
          name: "page[after]"
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: "page[size]"
          description: Defines the maximum number of objects that may be returned.
components:
  schemas:
    error:
      title: error
      type: object
      description: generic error response body based on problem details schema
      x-examples:
        error example:
          type: "https://example.com/probs/out-of-credit"
          title: You do not have enough credit.
          detail: "Your current balance is 30, but that costs 50."
          instance: /account/12345/msgs/abc
          status: 400
      properties:
        title:
          type: string
        status:
          type: integer
        type:
          type: string
        instance:
          type: string
        detail:
          type: string
      required:
        - title
        - status
        - detail
    links:
      title: links
      type: object
      properties:
        self:
          type: string
          description: " URI of the current page"
        last:
          type: string
          description: " URI of the last page"
        prev:
          type: string
          description: " URI of the previous page"
        next:
          type: string
          description: " URI of the next page"
        first:
          type: string
          description: " URI of the first page"
      description: links model used for pagination
      x-examples:
        links example:
          self: "/trusted-issuers-registry/v1/issuers?page[after]=3&page[size]=2"
          first: "/trusted-issuers-registry/v1/issuers?page[after]=0&page[size]=2"
          prev: "/trusted-issuers-registry/v1/issuers?page[after]=2&page[size]=2"
          next: "/trusted-issuers-registry/v1/issuers?page[after]=4&page[size]=2"
          last: "/trusted-issuers-registry/v1/issuers?page[after]=13&page[size]=2"
    issuer:
      type: object
      description: app model
      title: ""
      x-examples:
        app model example:
          appName: string
          pubKey: string
      properties:
        appName:
          type: string
          description: application name
        pubKey:
          type: string
          description: Secp256k1 Public key
      required:
        - appName
        - pubKey
    issuerName:
      title: Issuer name
      type: object
      x-examples:
        Issuer name example:
          name: string
      description: Name of the issuer
      properties:
        name:
          type: string
          description: name of the issuer
      required:
        - name
  examples:
    BadRequest:
      value:
        title: Bad request
        status: 400
        detail: Bad request
    InvalidToken:
      value:
        title: Invalid token
        status: 400
        detail: Invalid token
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    TooLarge:
      value:
        title: Payload too large
        status: 413
        detail: Payload too large
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
    ListFiles:
      value:
        items:
          - hash1
          - hash2
        total: 2
    ListFilesPagination:
      value:
        items:
          - hash1
          - hash2
        total: 2
        pageSize: 3
        links:
          first: "/trusted-issuers-registry/v1/issuers/distributed?page[after]=fff&page[size]=2"
          prev: "/trusted-issuers-registry/v1/issuers/distributed?page[after]=ppp&page[size]=2"
          next: "/trusted-issuers-registry/v1/issuers/distributed?page[after]=nnn&page[size]=2"
          last: "/trusted-issuers-registry/v1/issuers/distributed?page[after]=lll&page[size]=2"
servers:
  - url: "http://localhost"
    description: Local Computer Environment
  - url: "https://api.ebsi.xyz"
    description: EBSI Testing Environment
