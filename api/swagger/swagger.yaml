                    status: 404
                    detail: "{channel} parameter not found"
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  value:
                    title: Internal Server Error
                    status: 500
                    detail: The server encountered an internal error and was unable to complete your request.
      security:
        - bearerAuth: []
      operationId: get-ledger-bc-fabric-v1-channel-txs
      parameters:
        - in: query
          name: "page[after]"
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: "page[size]"
          description: "Number of items to be return per page."
    parameters:
      - schema:
          type: string
        name: channel
        in: path
        required: true
