  /storage/v1/sessions:
    post:
      tags:
        - Authentication
      summary: Login to storage services
      description: Login to storage services
      requestBody:
        description: Authentication. Self signed token with ebsi-storage as audience
        content:
          application/json:
            schema:
              required:
                - grantType
                - assertion
              type: object
              properties:
                grantType:
                  type: string
                  example: "urn:ietf:params:oauth:grant-type:jwt-bearer"
                assertion:
                  type: string
                  description: Self signed JWT
                  example: eyJraWQiOiJHNW01TmxiaTdGWlhPTVlHN2ctZ0tCLVVGdkVBSVUyUFkzSFQ3SFZtYkJzIiwiYWxnIjoiRVMyNTZLIn0.eyJpc3MiOiJlYnNpLXdhbGxldCIsImF1ZCI6ImVic2ktc3RvcmFnZSIsImlhdCI6MTU4NDY5MTIzOCwiZXhwIjoxNTg0NjkyMTM4fQ.boseFUS5fLXdH62ZggWvBkYL65d4xN52lmKNxUFwjLcQvbgF3RyYz-PU8hBY20LuoXbfbivOcEMmVExcwnUSzw
            examples:
              POST session example:
                value:
                  grantType: "urn:ietf:params:oauth:grant-type:jwt-bearer"
                  assertion: eyJraWQiOiJHNW01TmxiaTdGWlhPTVlHN2ctZ0tCLVVGdkVBSVUyUFkzSFQ3SFZtYkJzIiwiYWxnIjoiRVMyNTZLIn0.eyJkaWQiOiJkaWQ6ZWJzaToweDE4NGNhNzBCMjI3MzNmNzc4ODI0MDc0YzQ1YjUyNDk1MjFmZDk5MzYiLCJhdWQiOiJlYnNpLXdhbGxldCIsImlhdCI6MTU4NTA2MzMyMywiZXhwIjoxNTg1MDY0MjIzfQ.UxU-7msNhUHY4SHahLi_BuZv10kvaGHfjAV3EXi0uFDBGRUkI88Dpy-Y06UkIjcPwSEFjWXND5XvOwK3PdrU8A
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session"
              examples:
                Session successfull response:
                  value:
                    accessToken: 2YotnFZFEjr1zCsicMWpAA
                    tokenType: Bearer
                    expiresIn: 3600
                    issuedAt: 1467841035013
        "400":
          description: "Bad request, invalid token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                Bad Request:
                  value:
                    title: Bad request
                    status: 400
                    detail: Issuer not found in the Trusted Apps Registry
                Expired token:
                  value:
                    title: Bad request
                    status: 400
                    detail: The token has expired
                Invalid token:
                  value:
                    title: Bad request
                    status: 400
                    detail: The token is invalid
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
              examples:
                Internal Server Error:
                  value:
                    title: Internal Server Error
                    status: 500
                    detail: The server encountered an internal error and was unable to complete your request.
      operationId: post-storage-v1-sessions
components:
  schemas:
    patch:
      type: array
      description: format for expressing a sequence of operations to apply to a target JSON document
      items:
        type: object
        properties:
          op:
            type: string
            enum:
              - add
              - remove
              - replace
              - move
              - copy
              - test
            description: Operation to perform
          path:
            type: string
            description: string containing a JSON-Pointer value that references a location within the target document where the operation is performed.
          value:
            oneOf:
              - type: string
              - type: object
            description: "value to be added, replaced or tested"
          from:
            type: string
            description: "should be used with move, copy and remove operations"
        required:
          - op
          - path
      x-examples:
        Replace:
          op: replace
          path: /a/b/c
          value: 42
        Add:
          op: add
          path: /a/b/c
          value:
            - foo
            - bar
        Move:
          op: move
          from: /a/b/c
          path: /a/b/d
        Copy:
          op: copy
          from: /a/b/c
          path: /a/b/e
        Remove:
          op: remove
          path: /a/b/c
        Test:
          op: test
          path: /a/b/c
          value: foo
    key:
      type: string
      description: key from a key-value pair
    file:
      type: string
      description: file model
    error:
      type: object
      title: error
      description: generic error response body based on problem details schema
      x-examples:
        error example:
          type: "https://example.com/probs/out-of-credit"
          title: You do not have enough credit.
          detail: "Your current balance is 30, but that costs 50."
          instance: /account/12345/msgs/abc
          status: 400
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        type:
          type: string
      required:
        - title
        - status
        - detail
    session:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 900
        issuedAt:
          type: string
          example: "1467841035013"
      description: Access Token Response
      x-examples:
        access token response:
          accessToken: 2YotnFZFEjr1zCsicMWpAA
          tokenType: Bearer
          expiresIn: 3600
          issuedAt: "1467841035013"
      title: ""
    links:
      title: links
      type: object
      properties:
        self:
          type: string
          description: " URI of the current page"
        last:
          type: string
          description: " URI of the last page"
        prev:
          type: string
          description: " URI of the previous page"
        next:
          type: string
          description: " URI of the next page"
        first:
          type: string
          description: " URI of the first page"
      description: links model used for pagination
      x-examples:
        links example:
          self: "/storage/v1/stores?page[after]=3&page[size]=2"
          first: "/storage/v1/stores?page[after]=0&page[size]=2"
          prev: "/storage/v1/stores?page[after]=2&page[size]=2"
          next: "/storage/v1/stores?page[after]=4&page[size]=2"
          last: "/storage/v1/stores?page[after]=13&page[size]=2"
    fileStoreResponse:
      title: fileStoreResponse
      type: object
      x-examples:
        file store response:
          hash: "0xbe5b5152fcd01b6bf53f149bfd1493a49ec5e8ae94cc4c29a81563eea0e347f4"
          function: keccak256
      description: object returned upon successful file storage
      properties:
        hash:
          type: string
          description: hash of the file stored
        function:
          type: string
          description: "algorithm used to generate the file's hash"
      required:
        - hash
        - function
  examples:
    BadRequest:
      value:
        title: Bad request
        status: 400
        detail: Bad request
    InvalidToken:
      value:
        title: Invalid token
        status: 400
        detail: Invalid token
    Unauthorized:
      value:
        title: Unauthorized
        status: 401
        detail: Permission denied
    Forbidden:
      value:
        title: Forbidden
        status: 403
        detail: Forbidden You don't have the right to access that ressource
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Not found
    TooLarge:
      value:
        title: Payload too large
        status: 413
        detail: Payload too large
    InternalError:
      value:
        title: Internal error
        status: 500
        detail: Internal error
    ListFiles:
      value:
        items:
          - hash1
          - hash2
        total: 2
    ListFilesPagination:
      value:
        items:
          - hash1
          - hash2
        total: 2
        pageSize: 3
        links:
          first: "/storage/v1/stores/distributed?page[after]=fff&page[size]=2"
          prev: "/storage/v1/stores/distributed?page[after]=ppp&page[size]=2"
          next: "/storage/v1/stores/distributed?page[after]=nnn&page[size]=2"
          last: "/storage/v1/stores/distributed?page[after]=lll&page[size]=2"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
