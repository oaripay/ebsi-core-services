        "400":
          description: "Bad request the format of {channel} parameter is not valid"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {channel} Parameter:
                  value:
                    title: Bad request
                    status: 400
                    detail: "The format of {channel} parameter is not valid"
        "404":
          description: Not Found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Channel Not Found:
                  value:
                    title: Not Found
                    status: 404
                    detail: "{channel} parameter not found"
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  value:
