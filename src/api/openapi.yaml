openapi: 3.0.3
info:
  title: Storage API
  description: |
    Storage API is a Core Service of the EBSI platform providing access to the Off-chain
    Storage services of the lower layer Chain & Storage. This API provides read and write
    storage capabilities of files and Key-Value.

    File Storage API provides read and write files capabilities to off-chain distributed
    storage in v1 and in future to off-chain private (local) storage and off-chain external
    storage trusted providers.

    Key-Value Storage API provides capabilities to save Key-Value (with data value in JSON
    format) in the off-chain distributed storage for v1.
  version: 1.0.0
  termsOfService: "/docs/terms"
  contact:
    name: "EBSI Support"
    url: "https://ec.europa.eu/cefdigital/wiki/display/CEFDIGITAL/ebsi"
  license:
    name: "EUPL-1.2"
    url: "https://joinup.ec.europa.eu/page/eupl-text-11-12"
paths:
  /storage/v1/stores:
    get:
      tags:
        - Stores
      summary: List of available stores
      description: Returns a list of available stores
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: list of channel names
                    items:
                      type: string
                  total:
                    type: integer
                    description: " total number of pages in a collection"
                  pageSize:
                    type: integer
                    description: number of items to be return per page
                  links:
                    $ref: "#/components/schemas/links"
              examples:
                Stores:
                  value:
                    items:
                      - distributed
                    total: 1
      security:
        - bearerAuth: []
      operationId: get-storage-v1-stores
      parameters:
        - in: query
          name: "page[before]"
          schema:
            type: string
          description: Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: "page[after]"
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: "page[size]"
          description: Defines the maximum number of objects that may be returned.
  "/storage/v1/stores/{store}":
    get:
      tags:
        - Stores
      summary: Check if store exists
      description: Check if a store exists
      parameters:
        - name: store
          in: path
          schema:
            type: string
          example: distributed
          required: true
      responses:
        "204":
          description: Store exists
        "400":
          description: Bad Request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {store} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: "The format of {store} parameter is not valid"
        "404":
          description: Store does not exist
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Not Found:
                  value:
                    title: Not Found
                    status: 404
                    detail: "{store} parameter not found"
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      security:
        - bearerAuth: []
      operationId: get-storage-v1-store
  "/storage/v1/stores/{store}/files":
    get:
      tags:
        - File Storage
      summary: Get a List of files in the store
      description: Get a list of files stored in the {store} store
      parameters:
        - name: store
          in: path
          schema:
            type: string
          example: distributed
          required: true
        - in: query
          name: "page[before]"
          schema:
            type: string
          description: Cursor that points to the start of the page of data that has been returned.
        - in: query
          name: "page[after]"
          schema:
            type: string
          description: Cursor that points to the end of the page of data that has been returned.
        - schema:
            type: integer
          in: query
          name: "page[size]"
          description: Defines the maximum number of objects that may be returned.
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/file"
                  links:
                    $ref: "#/components/schemas/links"
                  pageSize:
                    type: integer
                    description: number of items to be return per page
                  total:
                    type: integer
                    description: Total number of pages in a collection
              examples:
                List of files:
                  value:
                    items:
                      - 0355a07b257bac3b223bd29b3bd3e24f5a53a84885d8bf36e278be0b45b04555
                      - 0355a07b257bac3b223bd29b3bd3e24f5a53a84885d8bf36e278be0b45b04555
                    total: 2
                List of files (pagination):
                  value:
                    items:
                      - 0355a07b257bac3b223bd29b3bd3e24f5a53a84885d8bf36e278be0b45b04555
                      - 0355a07b257bac3b223bd29b3bd3e24f5a53a84885d8bf36e278be0b45b04555
                    total: 13
                    pageSize: 2
                    links:
                      first: "/storage/v1/stores/distributed/files?page[after]=0&page[size]=2"
                      prev: "/storage/v1/stores/distributed/files?page[after]=2&page[size]=2"
                      next: "/storage/v1/stores/distributed/files?page[after]=4&page[size]=2"
                      last: "/storage/v1/stores/distributed/files?page[after]=13&page[size]=2"
        "400":
          description: Bad Request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {store} Parameter:
                  value:
                    title: Bad Request
                    status: 400
                    detail: "The format of {store} parameter is not valid"
        "401":
          description: Unauthorized
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "403":
          description: Forbidden
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Forbidden:
                  $ref: "#/components/examples/Forbidden"
        "404":
          description: Not Found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Not Found:
                  value:
                    title: Not Found
                    status: 404
                    detail: "{store} not found"
        "500":
          description: Internal Server Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      security:
        - bearerAuth: []
      operationId: get-storage-v1-store-files
    post:
      tags:
        - File Storage
      summary: Store files
      description: Store files to the {store}
      parameters:
        - name: store
          in: path
          schema:
            type: string
          example: distributed
          required: true
      requestBody:
        description: File to store
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  description: File to upload
                  format: binary
        required: true
      responses:
        "201":
          description: File stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/fileStoreResponse"
              examples:
                Success:
                  value:
                    hash: "0xbe5b5152fcd01b6bf53f149bfd1493a49ec5e8ae94cc4c29a81563eea0e347f4"
                    function: keccak256
        "400":
          description: Unformatted error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Invalid {store} Parameter:
                  value:
                    title: Bad request
                    status: 400
                    detail: "The format of {store} parameter is not valid"
        "401":
          description: Unauthorized
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "403":
          description: Forbidden
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Forbidden:
                  $ref: "#/components/examples/Forbidden"
        "404":
          description: Not Found
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Not Found:
                  value:
                    title: Not Found
                    status: 404
                    detail: "{store} not found"
        "413":
          description: Too large
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Too Large:
                  $ref: "#/components/examples/TooLarge"
        "500":
          description: Internal Error
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Internal Server Error:
                  $ref: "#/components/examples/InternalError"
      security:
        - bearerAuth: []
      operationId: post-storage-v1-store-files
  "/storage/v1/stores/{store}/files/{hash}":
    delete:
