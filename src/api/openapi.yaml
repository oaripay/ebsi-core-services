components:
  schemas:
    patch:
      title: Patch
      type: array
      description: format for expressing a sequence of operations to apply to a target JSON document
      items:
        type: object
        properties:
          op:
            type: string
            enum:
              - add
              - remove
              - replace
              - move
              - copy
              - test
            description: Operation to perform
          path:
            type: string
            description: |
              string containing a JSON-Pointer value that references a location within
              the target document where the operation is performed.
          value:
            oneOf:
              - type: string
              - type: object
            description: "value to be added, replaced or tested"
          from:
            type: string
            description: "should be used with move, copy and remove operations"
        required:
          - op
          - path
      x-examples:
        Replace:
          op: replace
          path: /a/b/c
          value: 42
        Add:
          op: add
          path: /a/b/c
          value:
            - foo
            - bar
        Move:
          op: move
          from: /a/b/c
          path: /a/b/d
        Copy:
          op: copy
          from: /a/b/c
          path: /a/b/e
        Remove:
          op: remove
          path: /a/b/c
        Test:
          op: test
          path: /a/b/c
          value: foo
    key:
      title: Key
      type: string
      description: key from a key-value pair
    file:
      title: File
      type: string
      description: File data model
    Problem:
      description: A Problem Details object (RFC 7807)
      type: object
      x-examples:
        Not Enough Credit:
          type: "https://example.com/probs/out-of-credit"
          title: You do not have enough credit.
          detail: "Your current balance is 30, but that costs 50."
          instance: /account/12345/msgs/abc
      properties:
        type:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the problem type. When dereferenced,
            it SHOULD provide human-readable documentation for the problem type.
          default: "about:blank"
        title:
          type: string
          description: |
            A short summary of the problem type.
          example: Internal Server Error
        status:
          type: integer
          format: int32
          description: |
            The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 400
          maximum: 600
          exclusiveMaximum: true
          example: 500
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem.
          example: Connection timeout
        instance:
          type: string
          format: uri
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
    links:
      title: Links
      type: object
      properties:
        last:
          type: string
          description: " URI of the last page"
        prev:
          type: string
          description: " URI of the previous page"
        next:
          type: string
          description: " URI of the next page"
        first:
          type: string
          description: " URI of the first page"
      description: links model used for pagination
      x-examples:
        Links:
          first: "/storage/v1/stores?page[after]=0&page[size]=2"
          prev: "/storage/v1/stores?page[after]=2&page[size]=2"
          next: "/storage/v1/stores?page[after]=4&page[size]=2"
          last: "/storage/v1/stores?page[after]=13&page[size]=2"
    fileStoreResponse:
      title: File Store Response
      type: object
      x-examples:
        file store response:
          hash: "0xbe5b5152fcd01b6bf53f149bfd1493a49ec5e8ae94cc4c29a81563eea0e347f4"
          function: keccak256
      description: object returned upon successful file storage
      properties:
        hash:
          type: string
          description: hash of the file stored
        function:
          type: string
          description: "algorithm used to generate the file's hash"
      required:
        - hash
        - function
    SessionsRequest:
      title: Sessions Request
      description: Request for OAuth 2.0 JWT bearer assertion grant.
      type: object
      required:
        - grantType
        - assertion
      properties:
        grantType:
          description: |
            OAuth 2.0 grant type. Must be set to "urn:ietf:params:oauth:grant-type:jwt-bearer"
          type: string
          example: "urn:ietf:params:oauth:grant-type:jwt-bearer"
        assertion:
          type: string
          description: Self-signed JWT
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    SessionsResponse:
      title: Sessions Response
      description: Authentication JWT
      type: object
      properties:
        accessToken:
          description: Authentication JWT to access the API.
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        tokenType:
          description: Type of the authentication token. Supported type "bearer".
          type: string
          example: Bearer
        expiresIn:
          description: JWT expiration in seconds.
          type: integer
          example: 900
        issuedAt:
          description: "Time of JWT issuance. Format: unix timestamp"
          type: string
          example: "1467841035013"
  examples:
    BadRequest:
      value:
        title: Bad Request
        status: 400
        detail: Bad request.
    ExpiredToken:
      value:
        title: Token Expired
        status: 400
        detail: The token has expired.
    InvalidToken:
      value:
        title: Invalid token
        status: 400
        detail: Invalid token.
    IssuerNotFound:
      value:
        title: Issuer Not Found
        status: 400
        detail: Issuer not found in the list of trusted apps.
    Unauthorized:
      value:
        title: Unauthorized
        status: 401
        detail: You are not authorized to access the resources.
    Forbidden:
      value:
        title: Forbidden
        status: 403
        detail: Forbidden.
    NotFound:
      value:
        title: Not found
        status: 404
        detail: Page not found.
    TooLarge:
      value:
        title: Payload Too Large
        status: 413
        detail: Payload exceedes the size limit {size_limit}.
    InternalError:
      value:
        title: Internal Server Error
        status: 500
        detail: The server encountered an internal error and was unable to complete your request.
    ListFiles:
      value:
        items:
          - hash1
          - hash2
        total: 2
    ListFilesPagination:
      value:
        items:
          - hash1
          - hash2
        total: 2
        pageSize: 3
        links:
          first: "/storage/v1/stores/distributed?page[after]=fff&page[size]=2"
          prev: "/storage/v1/stores/distributed?page[after]=ppp&page[size]=2"
          next: "/storage/v1/stores/distributed?page[after]=nnn&page[size]=2"
          last: "/storage/v1/stores/distributed?page[after]=lll&page[size]=2"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Authentication
    description: Authenticate to the Storage API
  - name: Stores
