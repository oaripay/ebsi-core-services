                  value:
                    title: Not Found
                    status: 404
                    detail: "{store} not found"
      security:
        - bearerAuth: []
      operationId: get-storage-v1-store-key-values
  "/storage/v1/stores/{store}/key-values/{key}":
    put:
      tags:
        - Key-Value Storage
      summary: Add or update a value
      description: Create a new entry or to update an existing one
      parameters:
        - name: store
          in: path
          schema:
            type: string
          example: distributed
          required: true
        - name: key
          in: path
          schema:
            type: string
          example: "key1"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: string
                - type: object
            examples:
              Simple Value:
                value: value
              Json Value:
                value:
                  prop: value
        description: "Any valid JSON. Size limit: 1MB"
      responses:
        "200":
          description: Object created
          content:
            application/json:
              schema:
                type: object
                properties:
                  "{key}":
                    type: string
                    example: '"{stored value}"'
                    description: Key Value example
              examples:
                Success:
                  value:
                    "{key}": "{stored value}"
        "201":
          description: Object updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  "{key}":
                    type: string
                    example: '"{stored value}"'
                    description: Key Value example
              examples:
                Success:
                  value:
                    "{key}": "{stored value}"
        "400":
          description: Bad request
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Bad Request:
                  value:
                    title: Bad Request
                    status: 400
                    detail: "The format of the {store,key} parameter is not valid"
        "401":
