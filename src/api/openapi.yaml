                  value:
                    title: Bad request
                    status: 400
                    detail: "The format of the {store,key} parameter is not valid"
        "401":
          description: Unauthorized
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Unauthorized:
                  $ref: "#/components/examples/Unauthorized"
        "403":
          description: Forbidden
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Forbidden:
