            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Not Found:
                  value:
                    title: Not found
                    status: 404
                    detail: "{store,key} is not found"
        "413":
          description: Entity Too Large
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Value Too Large:
                  $ref: "#/components/examples/TooLarge"
        "414":
          description: URI Too Long
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                Key Too Large:
                  value:
                    title: Key Too Large
                    status: 414
                    detail: "The key size exceeds the limit of 256 bytes"
        "500":
