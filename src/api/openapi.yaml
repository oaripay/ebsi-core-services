        - bearerAuth: []
      operationId: delete-storage-v1-store-key-value
    patch:
      tags:
        - Key-Value Storage
      summary: Apply a patch or add an item to an array of an existing value
      description: Patch an existing value
      parameters:
        - name: store
          in: path
          schema:
            type: string
          example: distributed
          required: true
        - name: key
          in: path
          schema:
            type: string
          example: key1
          required: true
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              $ref: "#/components/schemas/patch"
            examples:
              Add Value to a List:
                value:
                  - op: add
                    path: /list/-
                    value:
                      id: cred-new-credential
                      type: Verifiable ID
                      hash: "0x4f76b6a20aa300c6975ae3121c4cc859465378460da2500e4ba5d2d41b428728"
                      name: Verifiable ID
                      issuer: "did:ebsi:0x79475f0ffB15eD8c27D7Fe9A0Ceb1585Cc3fB1B3"
        description: " JSON Patch standard"
      responses:
        "200":
          description: Object patched
          content:
            application/json:
              schema:
                type: object
                description: Patched object
              examples:
                Success:
                  value:
                    list:
                      - id: cred-c1212ff0-440e-11ea-bf45-2d68c2715ada
                        type: Verifiable ID
                        hash: "0x4f76b6a20aa300c6975ae3121c4cc859465378460da2500e4ba5d2d41b428728"
                        name: Verifiable ID
                        issuer: "did:ebsi:0x79475f0ffB15eD8c27D7Fe9A0Ceb1585Cc3fB1B3"
                      - id: cred-new-credential
                        type: Verifiable ID
