      args:
        REACT_APP_REGISTRY_ADDRESS: ${REACT_APP_REGISTRY_ADDRESS}
        REACT_APP_DID_REGISTRY_ADDRESS: ${REACT_APP_DID_REGISTRY_ADDRESS}
    image: 305472350643.dkr.ecr.eu-central-1.amazonaws.com/ebsi/trusted-apps-registry-web-client:EBSIINT2976-v0.0.11
    ports:
      - "8080:8080"
