version: "3.7"

services:
  trusted-apps-registry-web-client:
    build:
      context: ../..
      args:
        REACT_APP_PROVIDER: ${REACT_APP_PROVIDER}
        REACT_APP_REGISTRY_ADDRESS: ${REACT_APP_REGISTRY_ADDRESS}
        REACT_APP_TAW_TX_URI: ${REACT_APP_TAW_TX_URI}
        REACT_APP_REDIRECT_URL: ${REACT_APP_REDIRECT_URL}
        REACT_APP_WALLET_WEB_CLIENT_URL: ${REACT_APP_WALLET_WEB_CLIENT_URL}
        REACT_APP_WALLET_API: ${REACT_APP_WALLET_API}
    image: 305472350643.dkr.ecr.eu-central-1.amazonaws.com/ebsi/trusted-apps-registry-web-client:EBSIINT2610-v0.0.3
