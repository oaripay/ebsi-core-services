version: "3.7"

services:
  identity-hub-api:
    build: .
    restart: always
    logging:
      options:
        max-size: "100m"
        max-file: "50"
    ports:
      - 8080:9000
    environment:
      - EBSI_ENV=${EBSI_ENV:?Missing EBSI_ENV variable}
      - API_PRIVATE_KEY=${API_PRIVATE_KEY:?Missing API_PRIVATE_KEY variable}
