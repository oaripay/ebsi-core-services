version: "3.7"

services:
  identity-hub-api:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: 305472350643.dkr.ecr.eu-central-1.amazonaws.com/intebsi/identity-hub-api:integration_EBSIINT-1382-chores-increase-coverage_v0.0.1
    container_name: identity-hub-api
    restart: always
    logging:
      options:
        max-size: "100m"
        max-file: "50"
    ports:
      - 8080:9000
    environment:
      - EBSI_ENV=${EBSI_ENV:?Missing EBSI_ENV variable}
      - API_PRIVATE_KEY=${API_PRIVATE_KEY:?Missing API_PRIVATE_KEY variable}
      - DID_REGISTRY_SC_ADDRESS=${DID_REGISTRY_SC_ADDRESS:?Missing DID_REGISTRY_SC_ADDRESS variable}
