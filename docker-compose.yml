version: "3.7"

services:
  cassandradb:
    image: cassandra:latest
    container_name: cassandradb
    ports:
      - "7000:7000"
      - "9042:9042"
  storage-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - EBSI_ENV=${EBSI_ENV}
      - API_PRIVATE_KEY=${API_PRIVATE_KEY}
      - CONSISTENCY=${CONSISTENCY}
      - SERIAL_CONSISTENCY=${SERIAL_CONSISTENCY}
    depends_on:
      - "cassandradb"
