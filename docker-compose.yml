version: "3.7"

services:
  trusted-apps-registry-api:
    build: .
    ports:
      - "9000:9000"
    environment:
      EBSI_ENV: ${EBSI_ENV:?Missing EBSI_ENV variable}
      API_PRIVATE_KEY: ${API_PRIVATE_KEY:?Missing API_PRIVATE_KEY variable}
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-9000}
      LOG_LEVEL: ${LOG_LEVEL:-}
      WEB3_PROVIDER: ${WEB3_PROVIDER:-}
      CONTRACT_ADDR: ${CONTRACT_ADDR:?Missing CONTRACT_ADDR variable}
      AUTH_EXPIRE_TIME: ${AUTH_EXPIRE_TIME:-}
