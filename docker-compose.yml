version: "3.7"

services:
  cassandradb:
    image: cassandra:latest
    container_name: cassandradb
    ports:
      - "7000:7000"
      - "9042:9042"
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
  api:
    build: .
    container_name: api
    ports:
      - "8080:8080"
    environment:
      - EBSI_ENV=integration
      - API_BESU_PRIVATE_KEY=${API_BESU_PRIVATE_KEY}
      - API_STORAGE_PRIVATE_KEY=${API_STORAGE_PRIVATE_KEY}
      - BESU_ADDRESS_NOTARY=${BESU_ADDRESS_NOTARY}
    depends_on:
      - "cassandradb"
      - "mongodb"
