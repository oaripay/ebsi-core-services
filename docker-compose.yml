version: "3.7"

services:
  trusted-issuers-registry-api:
    build: .
    image: 305472350643.dkr.ecr.eu-central-1.amazonaws.com/intebsi/trusted-issuers-registry-api:integration_EBSIINT-1379-cleanup-and-tests_v0.0.1
    ports:
      - "9000:9000"
    environment:
      API_PRIVATE_KEY: ${API_PRIVATE_KEY:?Missing API_PRIVATE_KEY variable}
      APP_PORT: ${APP_PORT:-9000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      EBSI_ENV: ${EBSI_ENV:-development}
