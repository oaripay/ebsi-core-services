specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TrustedSchemasRegistry
    network: besu
    source:
      abi: TrustedSchemasRegistry
      address: "{{ address }}"
      # prettier-ignore
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Schema
        - Revision
        - Metadata
      abis:
        - name: TrustedSchemasRegistry
          # prettier-ignore
          file: {{ &abi }}
      callHandlers:
        - function: insertSchema(bytes,bytes,bytes)
          handler: handleInsertSchemaCall
        - function: updateSchema(bytes,bytes,bytes)
          handler: handleUpdateSchemaCall
        - function: updateMetadata(bytes32,bytes)
          handler: handleUpdateMetadataCall
      file: ./src/mappings.ts
