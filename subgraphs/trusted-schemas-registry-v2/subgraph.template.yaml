specVersion: 1.2.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TrustedSchemasRegistry
    network: besu
    source:
      abi: TrustedSchemasRegistry
      address: "{{ address }}"
      # prettier-ignore
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Schema
        - Revision
        - Metadata
      abis:
        - name: TrustedSchemasRegistry
          # prettier-ignore
          file: {{ &abi }}
      eventHandlers:
        - event: SchemaInserted(indexed bytes,bytes,bytes32,bytes,bytes32)
          handler: handleSchemaInsertedEvent
        - event: SchemaUpdated(indexed bytes,bytes,bytes32,bytes,bytes32)
          handler: handleSchemaUpdatedEvent
        - event: MetadataUpdated(indexed bytes32,bytes,bytes32)
          handler: handleMetadataUpdatedEvent
      file: ./src/mappings.ts
