specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TrustedIssuersRegistry
    network: besu
    source:
      abi: TrustedIssuersRegistry
      address: "{{ address }}"
      # prettier-ignore
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Policy
        - Event
      abis:
        - name: TrustedIssuersRegistry
          # prettier-ignore
          file: {{ &abi }}
      eventHandlers:
        - event: AttributeMetadataUpdated((string,bytes32,uint8,string,string),bytes32)
          handler: handleAttributeMetadataUpdated
        - event: AttributeDataUpdated((string,bytes32,uint8,string,string),bytes32,bytes)
          handler: handleAttributeDataUpdated
        - event: ProxyUpdated(string,bytes32,string)
          handler: handleProxyUpdated
        - event: ProxyRemoved(string,bytes32)
          handler: handleProxyRemoved
      file: ./src/trusted-issuers-registry.ts
