enum HashAlgoStatus {
  undefined
  active
  revoked
}

type HashAlgo @entity(immutable: false) {
  id: String!
  ianaName: String!
  multiHash: String!
  oid: String!
  outputLength: BigInt!
  status: HashAlgoStatus!
}

type TimestampSet @entity(immutable: false) {
  id: Bytes!
  creator: Bytes!
  blockNumber: BigInt!
  transactionHash: Bytes!
  timestamp: BigInt!
  hashAlgorithmId: BigInt!
  timestampData: Bytes!
  hashValue: Bytes!
  recordIdsFirstVersion: [Record!]!
}

type VersionInfo @entity(immutable: false) {
  id: Bytes!
  content: Bytes!
}

type Version @entity(immutable: false) {
  id: Bytes!
  recordId: Bytes!
  versionNumber: BigInt!
  timestamps: [TimestampSet!]!
  infos: [VersionInfo!]!
}

type Owner @entity(immutable: false) {
  id: String!
  recordIds: [Record!]!
}

type OwnerRecord @entity(immutable: false) {
  id: String!
  address: String!
  notBefore: BigInt!
  notAfter: BigInt!
}

type Record @entity(immutable: false) {
  id: Bytes!
  owners: [OwnerRecord!]!
  versions: [Version!]!
}
